name: Mission Mangal verification (manual template)
on: workflow_dispatch
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd blog-engine && python -m unittest discover -s tests -v
      - run: node --test missionmangal/tests/*.test.mjs
# Only local contract tests; no blanket auto-approval.
