    :`<div class="trow"${cur&&cur.id===t.id?' aria-current="true"':''}><span class="glyph">${t.glyph}</span>${A('/tools/'+t.id,`<div class="n">${li(t.name)}</div><div class="x">${li(t.desc)}</div>`)}<button class="pin" data-act="pin" data-id="${t.id}" aria-pressed="${S.pinned.includes(t.id)}" aria-label="${L('गृहपृष्ठमा राख्नुहोस्','Keep on home')}: ${esc(li(t.name))}">${S.pinned.includes(t.id)?IC.star:IC.starO}</button></div>`;
  const nav=GROUPS.map(([g,n])=>`<div class="tgroup"><h2>${li(n)}</h2>${TOOLS.filter(t=>t.g===g).map(row).join('')}</div>`).join('');
  const panel=cur?`<div class="tpanel-h">${A('/tools',IC.left,`class="ibtn back" aria-label="${L('सबै उपकरण','All tools')}"`)}<span class="glyph">${cur.glyph}</span><div><h1>${li(cur.name)}</h1><p>${li(cur.desc)}</p></div></div><div class="tpanel-b" data-tool="${cur.id}">${TI[cur.id].html()}</div>`
    :`<div class="tpanel-h"><div><h1>${L('उपयोगी उपकरण','Useful tools')}</h1><p>${L(`${N(TOOLS.filter(t=>!t.ext).length)} वटा निःशुल्क उपकरण, सबै यही उपकरणमा चल्ने। तारा लगाएका उपकरण गृहपृष्ठमा देखिन्छन्।`,`${TOOLS.filter(t=>!t.ext).length} free tools that run on your device. Starred tools appear on your home page.`)}</p></div></div>
      <div class="tgrid">${TOOLS.filter(t=>!t.ext).map(t=>A('/tools/'+t.id,`<span class="glyph">${t.glyph}</span><span><span class="n">${li(t.name)}</span><br><span class="x">${li(t.desc)}</span></span>`,'class="tcard"')).join('')}</div>`;
  return `<div class="wrap page" style="padding-top:22px"><div class="tools${cur?' open':''}"><nav class="card tnav" aria-label="${L('उपकरण सूची','Tool list')}">${nav}</nav><section class="card tpanel">${panel}</section></div></div>`;

async function loadWeather(){const c=city();if(WX.id===c.id&&Date.now()-WX.t<30*60e3&&WX.data)return paintWx();
  try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),7000);const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`,{signal:ctl.signal});clearTimeout(tm);if(!r.ok)return;WX={id:c.id,t:Date.now(),data:await r.json()};paintWx();}catch(e){/* offline: stays hidden */}}

const icsEsc=s=>String(s).replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
function icsFile(evts,name){

const clampY=y=>Math.min(BS1,Math.max(BS0,y));

function route(){
  const raw=currentPath(),[pq,anchor]=[raw.split('#')[0],raw.split('#')[1]],[p,qs]=pq.split('?'),q=new URLSearchParams(qs||''),seg=p.split('/').filter(Boolean),T=todayDn(),cy=dnToBs(T).y,prev=V.route;

  V.route='home';V.anchor=anchor||null;

  else if(seg[0]==='year'){V.route='year';V.y=clampY(+seg[1]||cy);}
  else if(seg[0]==='holidays'){V.route='holidays';V.y=clampY(+seg[1]||cy);}

  else if(seg[0]==='tools'){V.route='tools';V.tool=seg[1]||null;if(V.tool&&tool(V.tool)&&!tool(V.tool).ext){S.recent=[V.tool,...S.recent.filter(x=>x!==V.tool)].slice(0,6);save();}}

document.addEventListener('input',onField);
document.addEventListener('change',e=>{
  if(e.target.id==='imp'){const f=e.target.files[0];if(!f)return;f.text().then(txt=>{const o=JSON.parse(txt);if(!o||!o.profile)throw 0;S={...DEF,...o,profile:{...DEF.profile,...o.profile},tools:{...(o.tools||{})},reminders:Array.isArray(o.reminders)?o.reminders:[]};save();render();toast(L('डेटा आयात भयो','Data imported'));}).catch(()=>toast(L('यो फाइल आफ्नै पात्रोको होइन।','That file isn’t an Aafnai Patro export.')));e.target.value='';return;}
  onField(e);
});
document.addEventListener('submit',e=>{
  if(e.target.id==='rem-form'){e.preventDefault();submitRem();}
  if(e.target.id==='qconv'){e.preventDefault();$('#qc-res').innerHTML=quickConvert($('#qc-in').value);}
});
['dlg','pal'].forEach(id=>$('#'+id).addEventListener('click',e=>{if(e.target===$('#'+id))$('#'+id).close();}));
document.addEventListener('keydown',e=>{
  const t=e.target,tag=(t.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea'||tag==='select'||t.isContentEditable;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();return;}
  if(t.id==='pal-q'){if(e.key==='ArrowDown'){e.preventDefault();palMove(1);}else if(e.key==='ArrowUp'){e.preventDefault();palMove(-1);}else if(e.key==='Enter'){e.preventDefault();const a=$$('#pal-res a')[V.palSel];a&&a.click();}return;}
  if(t.id==='ty-in'&&(e.key==='Enter'||e.key===' ')){const w=t.value.trim();if(w){e.preventDefault();TI.type.commit(t.closest('[data-tool]'),translit(w));}else if(e.key==='Enter'){e.preventDefault();$('#ty-doc').value+='\n';}return;}
  if(t.closest&&t.closest('[data-df="go"]')&&e.key==='Enter'){e.preventDefault();act('goto',t);return;}
  if(t.classList&&t.classList.contains('cell')){const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];if(mv){e.preventDefault();selectDay(V.sel+mv,true);return;}}
  if(typing||e.metaKey||e.ctrlKey||e.altKey||$('#dlg').open||$('#pal').open)return;
  if(e.key==='/'){e.preventDefault();openPal();return;}
  if(!['home','month'].includes(V.route))return;
  if(e.key==='t'||e.key==='T')selectDay(todayDn(),true);
  else if(e.key==='['||e.key==='PageUp'){e.preventDefault();setMonth(V.vy,V.vm-1,-1);}
  else if(e.key===']'||e.key==='PageDown'){e.preventDefault();setMonth(V.vy,V.vm+1,1);}
});
$('#search-trig').addEventListener('click',()=>openPal());
$('#lang-btn').addEventListener('click',()=>{S.profile.lang=isNe()?'en':'ne';save();render(true);});
$('#theme-btn').addEventListener('click',()=>{S.profile.theme=effectiveDark()?'light':'dark';save();applyPrefs();renderChrome();});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{applyPrefs();renderChrome();});
window.addEventListener(USE_PATH?'popstate':'hashchange',()=>{route();$('#main').focus({preventScroll:true});});

/* ================= Live clock, countdown, day rollover ================= */
let lastT=todayDn(),tick=0;
setInterval(()=>{
  const T=todayDn(),c=city();tick++;
  if(T!==lastT){lastT=T;FY.clear();if(['home','month'].includes(V.route)){V.sel=T;const b=dnToBs(T);V.vy=b.y;V.vm=b.m;render();}return;}
  const ck=$('#clock');if(ck)ck.innerHTML=fmtClock(Date.now(),c.tz);
  if(tick%20===0){const cd=$('#cd');if(cd)cd.innerHTML=countdownHTML(+cd.dataset.dn);const np=$('#npclock');if(np)np.textContent=fmtTime(Date.now(),'Asia/Kathmandu');if(V.route==='tools'&&V.tool==='clock'){const p=$('[data-tool="clock"]');p&&TI.clock.calc(p);}}
},1000);
setInterval(()=>{if(['home','month'].includes(V.route)){WX.t=0;loadWeather();}},30*60e3);

/* ================= Boot ================= */
window.AafnaiPatro={bsToDn,dnToBs,adToDn,dnToAd,tithiAt,lunarAt,nsText,eventsOn,festYear,preetiToUni,uniToPreeti,translit,neWords,enWords};
route();
})();
</script>
</body>
</html>
