/* ================= Design tokens: Himalayan blue ================= */
:root{
  color-scheme:light;
  --b950:#061A45; --b900:#0A2A66; --b800:#0D3A8C; --b700:#1149B4; --b600:#1A5FD6; --b500:#2E7BF0; --b400:#5B9BF6; --b300:#8FC1FF; --b200:#C3DDFF; --b100:#E4EFFF; --b50:#F2F7FF;
  --bg:#F2F5FB; --paper:#FFFFFF; --sunk:#F6F8FD; --tint:#EEF4FF;
  --ink:#0A2A66; --text:#0F1B3D; --muted:#56637F; --faint:#8793AD;
  --line:#DAE2F0; --line-2:#E8EDF6;
  --red:#D61F3C; --red-bg:#FFF1F3; --red-line:#FFD5DC;
  --amber:#B86E00; --green:#12805C; --violet:#6C3FD1;
  --accent:#1A5FD6; --on-accent:#fff;
  --moon-base:rgba(255,255,255,.18); --moon-lit:#FFF3C9;
  --shadow:0 1px 2px rgba(10,42,102,.06),0 10px 30px -16px rgba(10,42,102,.28);
  --f-ui:"Anek Devanagari","Noto Sans Devanagari","Nirmala UI","Mangal","Kohinoor Devanagari",system-ui,sans-serif;
  --f-display:"Eczar","Noto Serif Devanagari","Kohinoor Devanagari","Nirmala UI",Georgia,serif;
  --r1:8px; --r2:12px; --r3:18px; --r4:24px;
}
:root[data-accent="akash"]{--accent:#0B8BD9}
:root[data-accent="nilkantha"]{--accent:#4F46E5}
:root[data-accent="firoja"]{--accent:#0E8F9B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#070F24;--paper:#0E1934;--sunk:#0B1530;--tint:#11224A;
  --ink:#BFD6FF;--text:#E7EEFB;--muted:#9AA8C6;--faint:#6D7B9B;--line:#1F2D52;--line-2:#182545;
  --red:#FF6F84;--red-bg:#2A1024;--red-line:#4A1B33;--b100:#15285A;--b50:#0F1E45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7);}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#070F24;--paper:#0E1934;--sunk:#0B1530;--tint:#11224A;
  --ink:#BFD6FF;--text:#E7EEFB;--muted:#9AA8C6;--faint:#6D7B9B;--line:#1F2D52;--line-2:#182545;
  --red:#FF6F84;--red-bg:#2A1024;--red-line:#4A1B33;--b100:#15285A;--b50:#0F1E45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7);}

/* ================= Base ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background:var(--bg);color:var(--text);font:400 16.5px/1.6 var(--f-ui);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--b600)} :root[data-theme="dark"] a{color:var(--b300)}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2.5px solid var(--b500);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--b700);color:#fff;padding:8px 14px;border-radius:var(--r2);z-index:99;text-decoration:none}.skip:focus{top:12px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}

/* ================= Header ================= */
.hdr{position:sticky;top:0;z-index:40;background:linear-gradient(100deg,var(--b950),var(--b900) 35%,var(--b700));color:#fff;padding-top:env(safe-area-inset-top,0px);box-shadow:0 6px 24px -14px rgba(6,26,69,.8)}
.hdr-in{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;white-space:nowrap}
.brand svg{width:36px;height:36px;flex:none}
.brand b{font:700 23px/1 var(--f-display);letter-spacing:-.01em}
.brand small{display:block;font:500 11.5px/1.2 var(--f-ui);color:var(--b200);letter-spacing:.02em;margin-top:3px}
.search-trig{flex:1;max-width:480px;margin-left:12px;display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:rgba(255,255,255,.82);cursor:pointer;font-size:15px;text-align:left}
.search-trig:hover{background:rgba(255,255,255,.16)}
.search-trig svg{width:18px;height:18px;flex:none}
.search-trig kbd{margin-left:auto;font:600 11.5px/1 var(--f-ui);padding:4px 7px;border-radius:6px;background:rgba(255,255,255,.14);color:#fff}
.h-actions{margin-left:auto;display:flex;gap:4px;align-items:center}
.hbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:999px;border:0;background:transparent;color:#fff;cursor:pointer;font-weight:700;font-size:14.5px;text-decoration:none}
.hbtn:hover{background:rgba(255,255,255,.14)}
.hbtn svg{width:20px;height:20px}
.avatar{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;background:#fff;color:var(--b800);font:700 16px/1 var(--f-display);text-decoration:none;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.avatar svg{width:20px;height:20px}
.nav{background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.08)}
.nav-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;height:46px;align-items:stretch}
.nav-in::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:7px;padding:0 14px;color:rgba(255,255,255,.78);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;font-size:15.5px}
.nav a svg{width:17px;height:17px;opacity:.8}
.nav a:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav a[aria-current="page"]{color:#fff;border-bottom-color:var(--b300);font-weight:650}
.ticker{background:var(--b50);border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.ticker .wrap{display:flex;gap:18px;align-items:center;height:38px;overflow:hidden;white-space:nowrap}
.ticker b{color:var(--ink);font-weight:650}
.ticker .dot{width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block;margin-right:6px;vertical-align:2px}

/* ================= Hero band ================= */
.band{position:relative;overflow:hidden;color:#fff;background:radial-gradient(1200px 400px at 85% -10%,rgba(143,193,255,.35),transparent 60%),linear-gradient(160deg,var(--b900) 0%,var(--b800) 45%,var(--b600) 100%);isolation:isolate}
.band .himal{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:140px;z-index:-1;pointer-events:none}
.band-in{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(280px,.95fr);gap:28px;padding:30px 0 46px;align-items:stretch}
.today-date{display:flex;gap:18px;align-items:flex-end}
.today-num{font:800 clamp(92px,11vw,150px)/.78 var(--f-display);letter-spacing:-.04em;padding-top:.12em;text-shadow:0 8px 30px rgba(6,26,69,.35)}
.today-meta .greet{font-weight:600;color:var(--b200);font-size:15px;margin-bottom:6px}
.today-meta h1{font:700 clamp(26px,3vw,34px)/1.1 var(--f-display);white-space:nowrap}
.today-meta .wd{font-size:19px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:8px}
.today-meta .ad{color:var(--b200);font-size:15.5px}
.today-tithi{margin-top:20px;display:flex;align-items:center;gap:14px}
.today-tithi .moon{width:58px;height:58px;flex:none;filter:drop-shadow(0 0 18px rgba(255,243,201,.35))}
.today-tithi b{display:block;font:700 23px/1.2 var(--f-display)}
.today-tithi span{color:var(--b200);font-size:14.5px}
.speak{width:34px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);display:inline-grid;place-items:center;cursor:pointer;color:#fff}
.speak:hover{background:rgba(255,255,255,.18)}
.speak svg{width:16px;height:16px}
.glass{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:var(--r3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.facts{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;align-content:start}
.facts dt{font-size:12.5px;color:var(--b200)}
.facts dd{margin:0;font-weight:650;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.35}
.facts .clock{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:10px}
.facts .clock dd{font:700 34px/1 var(--f-display);letter-spacing:-.01em}
.facts .clock small{color:var(--b200);font-size:13.5px}
.facts .wide{grid-column:1/-1}
.nextcard{padding:18px;display:flex;flex-direction:column;gap:10px}
.nextcard .lbl{font-size:13px;color:var(--b200);font-weight:600}
.nextcard h2{font:700 24px/1.2 var(--f-display)}
.nextcard .cd{display:flex;gap:8px}
.nextcard .cd div{flex:1;text-align:center;background:rgba(255,255,255,.1);border-radius:var(--r2);padding:8px 4px}
.nextcard .cd b{display:block;font:800 26px/1 var(--f-display)}
.nextcard .cd span{font-size:12px;color:var(--b200)}
.nextcard .sub{font-size:14px;color:var(--b200)}
.nextcard a{color:#fff;font-weight:600;font-size:14.5px}
.qconv{display:flex;gap:6px;margin-top:auto}
.qconv input{flex:1;min-width:0;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;padding:0 14px;font-size:15px}
.qconv input::placeholder{color:rgba(255,255,255,.6)}
.qconv button{height:40px;border-radius:999px;border:0;background:#fff;color:var(--b800);font-weight:700;padding:0 16px;cursor:pointer}
.qres{font-size:14px;color:#fff;min-height:21px}
@media (prefers-reduced-motion:no-preference){.band.enter .today-num{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}.band.enter .moon{animation:glow 1.2s .2s ease-out both}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes glow{from{opacity:0;transform:scale(.8) rotate(-15deg)}to{opacity:1;transform:none}}

/* ================= Cards & dashboard ================= */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:24px;margin-top:-26px;position:relative;z-index:2;padding-bottom:40px;align-items:start}
.stack{display:grid;gap:22px;min-width:0;align-content:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.card-h h2,.card-h h3{font:700 18.5px/1.2 var(--f-display);color:var(--ink)}
.card-h .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--b100);color:var(--b700);flex:none}
.card-h .ico svg{width:18px;height:18px}
.card-h .more{margin-left:auto;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.card-b{padding:16px 18px}
.card-f{padding:10px 18px 14px;border-top:1px solid var(--line-2);font-size:13px;color:var(--faint)}
.pagehead{padding:26px 0 18px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13.5px;color:var(--muted);margin-bottom:8px}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--b600);text-decoration:underline}
.crumbs span[aria-hidden]{color:var(--faint)}
.pagehead h1{font:700 clamp(26px,3.2vw,36px)/1.15 var(--f-display);color:var(--ink)}
.pagehead p{color:var(--muted);margin-top:6px;max-width:760px}
.page{padding-bottom:48px}

/* ================= Buttons & forms ================= */
.btn{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--text);font:600 15px/1 var(--f-ui);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--b400);color:var(--b700)}
.btn svg{width:18px;height:18px}
.btn.round{width:40px;padding:0}
.btn.primary{background:var(--b700);border-color:var(--b700);color:#fff}
.btn.primary:hover{background:var(--b800);color:#fff}
.btn.small{height:32px;padding:0 12px;font-size:13.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--red)}
.linkbtn{background:none;border:0;padding:0;color:var(--b600);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14.5px}
.f{display:grid;gap:6px;font-size:14px;color:var(--muted);font-weight:500}
.f-l{font-size:14px;color:var(--muted);font-weight:500}
.inp,select.inp,textarea.inp{font-size:16px;color:var(--text);background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);padding:8px 12px;min-height:44px;width:100%}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.inp:focus{outline:2px solid var(--b500);outline-offset:0;border-color:transparent}
.inp[aria-invalid="true"]{border-color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 13px;border-radius:999px;font:600 14px/1.3 var(--f-ui);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--b700);color:#fff}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;color:var(--text);cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--b700);flex:none}
.hint{font-size:13.5px;color:var(--muted);font-weight:400}
.hint.bad{color:var(--red)}
.df{display:grid;gap:6px}
.df-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.df-row .inp{flex:1;min-width:150px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1.1fr 1.4fr .8fr;gap:8px}
.vstack{display:grid;gap:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:var(--r2);color:var(--muted);font-size:15px;background:var(--sunk)}

/* ================= Calendar ================= */
.cal-head{display:flex;align-items:center;gap:10px 14px;padding:16px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line-2)}
.cal-title{font:800 30px/1.05 var(--f-display);color:var(--ink)}
.cal-sub{color:var(--muted);font-size:14.5px}
.cal-ctrl{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cal-ctrl select{height:40px;min-height:40px;width:auto;border-radius:999px;padding:0 12px;font-weight:600}
.goto{display:flex;gap:8px;align-items:flex-start;padding:12px 18px;border-bottom:1px solid var(--line-2);background:var(--sunk)}
.goto .df{flex:1}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{padding:9px 10px;font-size:13.5px;font-weight:700;color:var(--b700);background:var(--b50);border-bottom:1px solid var(--line-2);text-align:center}
.dow.sat{color:var(--red)}
.cell{position:relative;background:var(--paper);min-height:100px;padding:8px 9px 7px;border:0;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;transition:background .12s}
.grid>.cell:nth-child(7n){border-right:0}
.cell:hover{background:var(--b50)}
.cell:focus-visible{outline-offset:-3px;z-index:2}
.cell .bs{font:700 25px/1.1 var(--f-ui);align-self:flex-start;display:inline-grid;place-items:center;min-width:1.6em;height:1.5em;border-radius:999px;margin-left:-.2em;color:var(--text)}
.cell .ad{position:absolute;top:9px;right:9px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:600}
.cell .ev{font-size:12.5px;line-height:1.25;font-stretch:84%;color:var(--b700);font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .ev.p{color:var(--violet)}
.cell .ti{margin-top:auto;font-size:12.5px;color:var(--muted);font-stretch:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.mo{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.mo.full{background:#F2B632;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.mo.new{box-shadow:inset 0 0 0 1.5px var(--muted)}
.cell.sat .bs,.cell.hol .bs{color:var(--red)}
.cell.hol{background:var(--red-bg)}
.cell.hol .ev{color:var(--red)}
.cell.today .bs{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent) 70%,transparent)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--b600);z-index:1}
.cell .mine{display:block;width:100%;font-size:12px;line-height:1.25;color:var(--accent-text);font-weight:700;font-stretch:84%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .mine::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:4px;vertical-align:2px}
.cell.out{background:var(--sunk);cursor:pointer}
.cell.out .bs{color:var(--faint);font-weight:500;font-size:17px}
.cell.blank{background:var(--sunk);cursor:default}
.dots{display:none;gap:3px;margin-top:auto}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--b500)}
.dots i.h{background:var(--red)}.dots i.me{background:var(--accent);outline:1.5px solid var(--paper)}.dots i.full{background:#F2B632}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 18px;font-size:13px;color:var(--muted);border-top:1px solid var(--line-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.slide-l{animation:sl .22s ease-out}.slide-r{animation:sr .22s ease-out}
@keyframes sl{from{opacity:.3;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:.3;transform:translateX(10px)}to{opacity:1;transform:none}}

/* Day detail */
.day-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:baseline}
.day-h h2{font:700 23px/1.2 var(--f-display);color:var(--ink)}
.rel{font-size:13.5px;color:var(--b700);background:var(--b100);padding:3px 10px;border-radius:999px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:0;background:var(--paper);border-radius:var(--r2);overflow:hidden;margin-top:14px;border:1px solid var(--line-2)}
.kv div{padding:11px 13px;box-shadow:inset -1px -1px 0 var(--line-2)}
.kv dt{font-size:12.5px;color:var(--muted);font-weight:500}
.kv dd{margin:2px 0 0;font-weight:650;line-height:1.4}
.kv dd small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{padding:4px 11px;border-radius:999px;font-size:13.5px;font-weight:650;background:var(--b100);color:var(--b800)}
.tag.h{background:var(--red-bg);color:var(--red);box-shadow:inset 0 0 0 1px var(--red-line)}
.tag.p{background:color-mix(in srgb,var(--violet) 12%,var(--paper));color:var(--violet)}
.tag.me{background:var(--accent-soft);color:var(--accent-text);border:0;cursor:pointer}
.tag small{font-weight:500;opacity:.8}

/* Lists */
.elist{list-style:none;margin:0;padding:0}
.elist li{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line-2)}
.elist li:last-child{border-bottom:0}
.elist .d{text-align:center;line-height:1.05;border-radius:var(--r2);padding:6px 0;background:var(--b50)}
.elist .d b{display:block;font:800 22px/1 var(--f-display);color:var(--b700)}
.elist .d span{font-size:11.5px;color:var(--muted);font-weight:600}
.elist li.hol .d{background:var(--red-bg)} .elist li.hol .d b{color:var(--red)}
.elist li.mine .d{background:var(--accent-soft)} .elist li.mine .d b{color:var(--accent-text)}
.elist .t{font-weight:650;line-height:1.3;overflow-wrap:anywhere}
.elist .s{font-size:13px;color:var(--muted);line-height:1.35}
.elist .c{font-size:13.5px;color:var(--muted);white-space:nowrap;text-align:right;font-weight:600}
.elist li.late .c{color:var(--red)} .elist li.soon .c{color:var(--b700)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--red-bg);color:var(--red);margin-left:6px;vertical-align:1px}
.badge.p{background:color-mix(in srgb,var(--violet) 12%,var(--paper));color:var(--violet)}
.badge.est{background:var(--sunk);color:var(--faint)}

/* Widgets */
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px}
.rcell{display:grid;justify-items:center;gap:1px;padding:9px 4px 7px;border-radius:var(--r2);background:var(--sunk);text-decoration:none;color:var(--text);position:relative;border:1px solid transparent}
.rcell:hover{border-color:var(--b300);background:var(--b50)}
.rcell .g{font-size:21px;line-height:1.1}
.rcell .n{font-size:13px;font-weight:650}
.rcell i{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%}
.rcell.me{background:var(--accent-soft);border-color:var(--accent)}
.good{background:var(--green)}.mid{background:#E0A100}.bad{background:var(--red)}
.fx{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
.fx th,.fx td{padding:8px 18px;text-align:right;border-bottom:1px solid var(--line-2)}
.fx th:first-child,.fx td:first-child{text-align:left}
.fx th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--sunk)}
.fx td:first-child b{font-weight:700;margin-right:6px}
.fx td:first-child span{color:var(--muted);font-size:12.5px}
.metal{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px}
.metal div{padding:12px;border-radius:var(--r2);background:linear-gradient(135deg,#FFF6DA,#FFE9A8);color:#5A3E00}
.metal div.ag{background:linear-gradient(135deg,#EEF2F8,#D7DEEA);color:#2F3B52}
:root[data-theme="dark"] .metal div{filter:saturate(.8) brightness(.95)}
.metal span{font-size:12.5px;font-weight:600;opacity:.85}
.metal b{display:block;font:800 21px/1.2 var(--f-display)}
.qtools{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px}
.qt{display:grid;justify-items:center;gap:6px;padding:10px 4px;border-radius:var(--r2);text-decoration:none;color:var(--text);font-size:12.5px;font-weight:600;text-align:center;line-height:1.25}
.qt:hover{background:var(--b50);color:var(--b700)}
.glyph{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--b100),var(--b50));color:var(--b700);font:800 15px/1 var(--f-display);box-shadow:inset 0 0 0 1px var(--b200)}
:root[data-theme="dark"] .glyph{box-shadow:inset 0 0 0 1px var(--line)}

/* Year view */
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.mini{padding:14px}
.mini h3{font:700 18px/1.2 var(--f-display);color:var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.mini h3 a{text-decoration:none;color:inherit}.mini h3 small{font:500 12.5px var(--f-ui);color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px;text-align:center;font-size:13.5px}
.mgrid span{padding:4px 0;border-radius:6px;font-variant-numeric:tabular-nums}
.mgrid .w{font-size:11.5px;color:var(--muted);font-weight:700}.mgrid .w.s{color:var(--red)}
.mgrid a{padding:4px 0;border-radius:6px;text-decoration:none;color:var(--text);font-weight:600}
.mgrid a:hover{background:var(--b100)}
.mgrid a.s,.mgrid a.h{color:var(--red)} .mgrid a.h{background:var(--red-bg)}
.mgrid a.t{background:var(--accent);color:#fff}
.mini ul{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--line-2);font-size:13px;color:var(--muted);display:grid;gap:3px}
.mini ul b{color:var(--red);margin-right:5px}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
.tbl th{font-size:13px;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.hol td:first-child b{color:var(--red)}
.tbl tr.past{opacity:.55}
.tbl tfoot td{font-weight:700;border-bottom:0}
.scroll-x{overflow-x:auto}
.mhead td{background:var(--b50);font:700 15px var(--f-display);color:var(--ink)}

/* Rashifal page */
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.rcard{padding:16px;display:grid;gap:8px;position:relative}
.rcard.me{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.rcard .top{display:flex;align-items:center;gap:12px}
.rcard .g{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--b100)}
.rcard h2{font:700 20px/1.1 var(--f-display);color:var(--ink)}
.rcard .syl{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill.good{background:color-mix(in srgb,var(--green) 14%,var(--paper));color:var(--green)}
.pill.mid{background:color-mix(in srgb,#E0A100 16%,var(--paper));color:var(--amber)}
.pill.bad{background:var(--red-bg);color:var(--red)}

/* Tools */
.tools{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.tnav{position:sticky;top:130px;max-height:calc(100vh - 150px);overflow:auto;padding:10px}
.tgroup+.tgroup{margin-top:12px}
.tgroup h2{font:700 12.5px/1.3 var(--f-ui);color:var(--muted);margin:6px 8px;letter-spacing:.02em}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;padding:7px 8px;border-radius:var(--r2);color:var(--text)}
.trow:hover{background:var(--b50)}
.trow[aria-current="true"]{background:var(--b100)}
.trow a{text-decoration:none;color:inherit}
.trow .n{font-weight:650;line-height:1.3;font-size:15px}
.trow .x{font-size:12.5px;color:var(--muted);line-height:1.3}
.trow .glyph{width:34px;height:34px;border-radius:10px;font-size:13px}
.pin{width:32px;height:32px;border-radius:999px;border:0;background:transparent;color:var(--faint);cursor:pointer;display:grid;place-items:center}
.pin:hover{background:var(--paper);color:var(--text)}
.pin[aria-pressed="true"]{color:#E0A100}
.pin svg{width:17px;height:17px}
.ext-ico{width:16px;height:16px;color:var(--faint)}
.tpanel-h{display:flex;align-items:flex-start;gap:14px;padding:20px 22px;border-bottom:1px solid var(--line-2)}
.tpanel-h h1{font:700 26px/1.15 var(--f-display);color:var(--ink)}
.tpanel-h p{margin-top:4px;color:var(--muted);font-size:15px}
.tpanel-h .back{display:none}
.tpanel-b{padding:20px 22px 24px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:18px}
.tcard{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r2);border:1px solid var(--line-2);text-decoration:none;color:var(--text);background:var(--paper)}
.tcard:hover{border-color:var(--b300);background:var(--b50)}
.tcard .n{font-weight:700}.tcard .x{font-size:13px;color:var(--muted)}
.result{margin-top:14px;padding:16px 18px;border-radius:var(--r2);background:linear-gradient(135deg,var(--b50),var(--sunk));border:1px solid var(--b100)}
.result .big{font:800 28px/1.2 var(--f-display);color:var(--ink);overflow-wrap:anywhere}
.result .sub{color:var(--muted);font-size:15px;margin-top:4px}
.conv{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.conv h3,.tsec h3{font:700 17px/1.3 var(--f-display);color:var(--ink);margin:0 0 10px}
.tsec+.tsec{margin-top:24px;padding-top:22px;border-top:1px solid var(--line-2)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line-2);border-radius:var(--r2);overflow:hidden;margin-top:14px;border:1px solid var(--line-2)}
.units div{background:var(--paper);padding:10px 12px}
.units dt{font-size:12.5px;color:var(--muted)}
.units dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin-top:12px;background:var(--line-2)}
.bar i{display:block;height:100%}
.ime{display:flex;flex-wrap:wrap;gap:6px;min-height:42px;margin-top:8px;align-items:center}
.ime button{padding:3px 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:19px;cursor:pointer;line-height:1.5}
.ime button:first-of-type{border-color:var(--b600);box-shadow:inset 0 0 0 1px var(--b600)}
.cheat{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-top:10px;font-size:14px}
.cheat span{padding:5px 8px;border-radius:var(--r1);background:var(--sunk)}
.cheat code{font-family:inherit;font-weight:700;color:var(--b700);margin-right:6px}
.qrbox{display:grid;place-items:center;padding:18px;background:#fff;border-radius:var(--r2);min-height:120px;border:1px solid var(--line-2)}
.cardwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:22px;align-items:start}
.cardprev{width:100%;height:auto;aspect-ratio:1;border-radius:var(--r2);box-shadow:var(--shadow);display:block;background:var(--sunk)}
.clocks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-2)}
.clocks li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2)}
.clocks .cn{font-weight:650}.clocks .dn{font-size:13px;color:var(--muted)}
.clocks .tm{font:700 22px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.clocks li.home .tm{color:var(--accent-text)} .clocks li.sleep .tm{color:var(--faint)}
input[type=range]{width:100%;accent-color:var(--b700);height:28px}
.rlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-2)}
.rlist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.rlist li span:last-child{color:var(--muted);font-size:14.5px}
.syll{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.syll span{padding:2px 12px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);font-weight:700;font-size:18px}
.syll span.on{background:var(--b700);color:#fff;border-color:var(--b700)}
.preeti-out{font-family:"Preeti",var(--f-ui)}

/* Mine */
.mine{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stats div{background:var(--b50);border-radius:var(--r2);padding:10px 12px;border:1px solid var(--b100)}
.stats b{display:block;font:800 26px/1.1 var(--f-display);color:var(--b700)}
.stats span{font-size:12.5px;color:var(--muted);font-weight:600}
.stats .late{background:var(--red-bg);border-color:var(--red-line)}.stats .late b{color:var(--red)}
.rems{list-style:none;margin:0;padding:0}
.rems li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.rems .t{font-weight:650}.rems .s{font-size:13.5px;color:var(--muted)}
.rems .k{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--b100);color:var(--b800);margin-right:6px;font-weight:700}
.rems .b{display:flex;gap:2px}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.ibtn:hover{background:var(--b50);color:var(--b700)}
.ibtn svg{width:18px;height:18px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:14px;font-weight:600}
.sw i{width:24px;height:24px;border-radius:50%}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--b600);border-color:transparent}

/* More / FAQ / SEO */
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.xcard{display:flex;gap:14px;align-items:flex-start;padding:16px;text-decoration:none;color:var(--text)}
.xcard:hover{border-color:var(--b300)}
.xcard .n{font-weight:700;font-size:17px}.xcard .x{font-size:14px;color:var(--muted)}
.faq details{border-bottom:1px solid var(--line-2);padding:4px 18px}
.faq details:last-child{border-bottom:0}
.faq summary{cursor:pointer;font-weight:650;padding:10px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";font-weight:700;color:var(--b600);font-size:20px;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq p{padding:0 0 12px;color:var(--muted)}
.seo-text{padding:18px;color:var(--muted);font-size:15px;display:grid;gap:10px}
.seo-text h2{font:700 19px/1.3 var(--f-display);color:var(--ink)}

/* Footer */
.foot{background:linear-gradient(180deg,var(--b900),var(--b950));color:rgba(255,255,255,.78);margin-top:20px;padding:34px 0 calc(24px + env(safe-area-inset-bottom,0px))}
.foot-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:28px}
.foot h2{font:700 15px/1.3 var(--f-ui);color:#fff;margin-bottom:10px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.foot a{color:rgba(255,255,255,.78);text-decoration:none}.foot a:hover{color:#fff;text-decoration:underline}
.foot .about{font-size:14px;line-height:1.6}
.foot .brand{margin-bottom:10px}
.foot .legal{border-top:1px solid rgba(255,255,255,.12);margin-top:24px;padding-top:14px;font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mgrid-links{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px}

/* Palette / dialog / toast */
dialog{border:0;border-radius:var(--r3);padding:0;width:min(560px,calc(100vw - 24px));background:var(--paper);color:var(--text);box-shadow:0 30px 80px rgba(6,26,69,.45)}
dialog::backdrop{background:rgba(6,20,52,.55);backdrop-filter:blur(2px)}
.dlg{padding:20px 22px 18px}
.dlg h2{font:700 22px/1.2 var(--f-display);color:var(--ink);margin-bottom:14px}
.dlg .foot2{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
#pal{width:min(640px,calc(100vw - 24px));margin-top:10vh}

<script>
(()=>{
'use strict';
/* =========================================================
   आफ्नै पात्रो · Aafnai Patro — portable single-file frontend
   Everything personal stays in this browser (localStorage).
   Online-only extras: web fonts, weather (open-meteo), QR library.
   ========================================================= */
const SITE='https://patro-blush.vercel.app';   // live services (rashifal, news, FM, TV…)
const STORE='aafnai-patro:v1';
const DAY=864e5;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');

/* ================= Bikram Sambat engine (BS 2000–2090) =================
   Each char = month length − 28, 12 per year, starting 1 Baisakh 2000 = 14 Apr 1943 */
const BS0=2000,BS1=2090;
const BSD='243432221213334333212122334432212122343432221123243432221213334333212122334432212122343432221123333433122113334333212122334432212122343432221123333433122122334333212122334432212122343432221123333433122122334333212122343432212122343432221213333433212122334333212122343432221122343432221213333433212122334333212122343432221123243432221213334333212122334342212122343432221123243432221213334333212122334432212122343432221123243433122113334333212122334432212122343432221123333433122122334333212122334432212122343432221123333433122122334333212122343432212122343432221123333433212122334333212122343432221122343432221213333433212122334333212122343432221122343432221213334333212122334342212122343432221123243432221213334333212122334432212122343432221123243433121213334333212122334432212122343432221123333433122113334333212122334432212122343432221123333433122122334333212122343432212122343432221123333433212122334333212122343432221122343432221213333433212122334333212122343432221122343432221213334333212122334333212122343432221123243432221213334333212122334333221222234423221222243432221222243432221222';

const YS=[];{let a=0;for(let y=BS0;y<=BS1+1;y++){YS.push(a);if(y<=BS1)for(let m=1;m<=12;m++)a+=bsLen(y,m);}}

function bsToDn(y,m,d){
  if(!(y>=BS0&&y<=BS1&&m>=1&&m<=12&&d>=1&&d<=bsLen(y,m)))return null;
  let n=YS[y-BS0];for(let i=1;i<m;i++)n+=bsLen(y,i);return EPOCH+n+d-1;
}
function dnToBs(dn){
  let o=dn-EPOCH;if(o<0||dn>MAX_DN)return null;
  let y=BS0;while(YS[y-BS0+1]<=o)y++;o-=YS[y-BS0];
  let m=1;while(o>=bsLen(y,m)){o-=bsLen(y,m);m++;}
  return {y,m,d:o+1};
}
function adToDn(y,m,d){const t=Date.UTC(y,m-1,d),x=new Date(t);if(x.getUTCFullYear()!==y||x.getUTCMonth()!==m-1||x.getUTCDate()!==d)return null;return Math.round(t/DAY);}
function dnToAd(dn){const x=new Date(dn*DAY);return {y:x.getUTCFullYear(),m:x.getUTCMonth()+1,d:x.getUTCDate()};}
const adDim=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
const wd=dn=>(((dn+4)%7)+7)%7;

/* ================= Astronomy (validated: ≤0.02° elongation 2000–2090) ================= */
const RAD=Math.PI/180,n360=x=>((x%360)+360)%360,w180=x=>{x=n360(x);return x>180?x-360:x;};
const ML=[[0,0,1,0,6288774],[2,0,-1,0,1274027],[2,0,0,0,658314],[0,0,2,0,213618],[0,1,0,0,-185116],[0,0,0,2,-114332],[2,0,-2,0,58793],[2,-1,-1,0,57066],[2,0,1,0,53322],[2,-1,0,0,45758],[0,1,-1,0,-40923],[1,0,0,0,-34720],[0,1,1,0,-30383],[2,0,0,-2,15327],[0,0,1,2,-12528],[0,0,1,-2,10980],[4,0,-1,0,10675],[0,0,3,0,10034],[4,0,-2,0,8548],[2,1,-1,0,-7888],[2,1,0,0,-6766],[1,0,-1,0,-5163],[1,1,0,0,4987],[2,-1,1,0,4036],[2,0,2,0,3994],[4,0,0,0,3861],[2,0,-3,0,3665],[0,1,-2,0,-2689],[2,0,-1,2,-2602],[2,-1,-2,0,2390],[1,0,1,0,-2348],[2,-2,0,0,2236],[0,1,2,0,-2120],[0,2,0,0,-2069],[2,-2,-1,0,2048],[2,0,1,-2,-1773],[2,0,0,2,-1595],[4,-1,-1,0,1215],[0,0,2,2,-1110],[3,0,-1,0,-892],[2,1,1,0,-810],[4,-1,-2,0,759],[0,2,-1,0,-713],[2,2,-1,0,-700],[2,1,-2,0,691],[2,-1,0,-2,596],[4,0,1,0,549],[0,0,4,0,537],[4,-1,0,0,520],[1,0,-2,0,-487]];
const jdOf=ms=>ms/DAY+2440587.5;
const Tof=ms=>(jdOf(ms)+70/86400-2451545)/36525;
function moonLon(T){
  const Lp=218.3164477+481267.88123421*T-0.0015786*T*T+T*T*T/538841,
        D=297.8501921+445267.1114034*T-0.0018819*T*T+T*T*T/545868,
        M=357.5291092+35999.0502909*T-0.0001536*T*T,
        Mp=134.9633964+477198.8675055*T+0.0087414*T*T+T*T*T/69699,
        F=93.2720950+483202.0175233*T-0.0036539*T*T,
        E=1-0.002516*T-0.0000074*T*T;
  let s=0;for(const [d,m,mp,f,c] of ML){let k=c;if(m===1||m===-1)k*=E;else if(m)k*=E*E;s+=k*Math.sin((d*D+m*M+mp*Mp+f*F)*RAD);}
  s+=3958*Math.sin((119.75+131.849*T)*RAD)+1962*Math.sin((Lp-F)*RAD)+318*Math.sin((53.09+479264.290*T)*RAD);

function sunLon(T){
  const L0=280.46646+36000.76983*T+0.0003032*T*T,M=357.52911+35999.05029*T-0.0001537*T*T;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M*RAD)+(0.019993-0.000101*T)*Math.sin(2*M*RAD)+0.000289*Math.sin(3*M*RAD);
  return n360(L0+C-0.00569);

const elong=ms=>{const T=Tof(ms);return n360(moonLon(T)-sunLon(T));};
const ayan=ms=>23.853+0.013969*((jdOf(ms)-2451545)/365.25);           // Lahiri
const sidSun=ms=>n360(sunLon(Tof(ms))-ayan(ms));

function sunTimes(dn,lat,lon){
  const nday=Math.round(dn+2440588-lon/360-2451545.0009), Js=2451545.0009-lon/360+nday, n=Js-2451545;
  const Ms=n360(357.5291+0.98560028*n), C=1.9148*Math.sin(Ms*RAD)+0.02*Math.sin(2*Ms*RAD)+0.0003*Math.sin(3*Ms*RAD);
  const lam=n360(Ms+C+180+102.9372), Jt=Js+0.0053*Math.sin(Ms*RAD)-0.0069*Math.sin(2*lam*RAD);
  const dec=Math.asin(Math.sin(lam*RAD)*Math.sin(23.44*RAD));
  const cw=(Math.sin(-0.833*RAD)-Math.sin(lat*RAD)*Math.sin(dec))/(Math.cos(lat*RAD)*Math.cos(dec));
  const w=Math.acos(Math.max(-1,Math.min(1,cw)))/RAD, toMs=j=>(j-2440587.5)*DAY;
  return {rise:toMs(Jt-w/360),set:toMs(Jt+w/360),noon:toMs(Jt),polar:cw>1?'night':cw<-1?'day':null};

function newMoonBefore(ms){let t=ms-elong(ms)/12.19*DAY;for(let i=0;i<6;i++)t-=w180(elong(t))/12.19*DAY;return t>ms?t-29.53*DAY:t;}

  const ramc=n360(gmst(ms)+lon)*RAD,e=(23.439291-0.0130042*((jdOf(ms)-2451545)/36525))*RAD,f=lat*RAD;
  return n360(Math.atan2(Math.cos(ramc),-(Math.sin(ramc)*Math.cos(e)+Math.tan(f)*Math.sin(e)))/RAD);

/* ================= Panchang (tithi at Kathmandu sunrise, the patro standard) ================= */
const KTM={lat:27.7172,lon:85.324,tz:'Asia/Kathmandu'};
const TC=new Map(), LC=new Map();
function tithiAt(dn){
  if(TC.has(dn))return TC.get(dn);
  const sr=sunTimes(dn,KTM.lat,KTM.lon).rise, e=elong(sr), ti=Math.floor(e/12);
  const tg=(ti+1)*12;let t=sr+((tg-e)/12.19)*DAY;for(let i=0;i<4;i++)t-=w180(elong(t)-tg)/12.19*DAY;

  const r={ti,e,end:t,sr,nak:Math.floor(sm/(360/27)),mr:Math.floor(sm/30)};
  TC.set(dn,r);return r;

  if(LC.has(dn))return LC.get(dn);
  const sr=tithiAt(dn).sr, nm=newMoonBefore(sr), nm2=newMoonBefore(nm+31*DAY);

  const ns=lm>=7?(x.getUTCMonth()>=8?x.getUTCFullYear():x.getUTCFullYear()-1)-879:x.getUTCFullYear()-880;
  const r={lm,adhik,ns};LC.set(dn,r);return r;

function tithiDay(dn,target){
  const a=tithiAt(dn).ti;if(a===target)return true;
  return a===(target+29)%30 && tithiAt(dn+1).ti===(target+1)%30;

/* ================= Vocab ================= */
const BSM=[['बैशाख','जेठ','असार','साउन','भदौ','असोज','कात्तिक','मंसिर','पुस','माघ','फागुन','चैत'],['Baisakh','Jestha','Asar','Shrawan','Bhadra','Asoj','Kartik','Mangsir','Poush','Magh','Falgun','Chait']];

const SC=new Map();const tithiAtSet=dn=>{if(!SC.has(dn))SC.set(dn,Math.floor(elong(sunTimes(dn,KTM.lat,KTM.lon).set)/12));return SC.get(dn);};
const FY=new Map();
function festYear(y){
  if(FY.has(y))return FY.get(y);const map={};FY.set(y,map);if(y<BS0||y>BS1)return map;
  const a=bsToDn(y,1,1),b=bsToDn(y,12,bsLen(y,12)),seen=new Set();
  for(let dn=a;dn<=b;dn++)RULES.forEach(([lm,ti,rule,ne,en,t],i)=>{
    if(!(rule==='s'?tithiAtSet(dn)===ti:tithiDay(dn,ti)))return;
    const l=lunarAt(dn);if(l.lm!==lm||l.adhik)return;const k=i+'|'+l.ns+'|'+l.lm;if(seen.has(k))return;seen.add(k);
    (map[dn]=map[dn]||[]).push([ne,en,t]);});
  return map;
}
function eventsOn(dn){
  const b=dnToBs(dn),a=dnToAd(dn),out=[];if(!b)return out;const k=b.m+'-'+b.d;
  const add=(v,est)=>{if(v&&!out.some(o=>o.ne===v[0]))out.push({ne:v[0],en:v[1],t:v[2],h:v[2]==='h',est:!!est});};
  if(OFFICIAL[b.y])add(OFFICIAL[b.y][k]);else(festYear(b.y)[dn]||[]).forEach(v=>add(v,1));
  add(EV_BS[k]);add(EV_AD[a.m+'-'+a.d]);
  return out.sort((p,q)=>(q.h?2:q.t==='p'?1:0)-(p.h?2:p.t==='p'?1:0));
}

function tzParts(ms,tz){
  const o={};for(const p of new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(new Date(ms)))o[p.type]=p.value;
  return {y:+o.year,m:+o.month,d:+o.day,h:(+o.hour)%24,mi:+o.minute};
}
function tzOffset(ms,tz){const f=ms-(((ms%60000)+60000)%60000),p=tzParts(f,tz);return Math.round((Date.UTC(p.y,p.m-1,p.d,p.h,p.mi)-f)/60000);}
function localToUtc(y,m,d,h,mi,tz){const g=Date.UTC(y,m-1,d,h,mi);let o=tzOffset(g,tz),t=g-o*60000;const o2=tzOffset(t,tz);if(o2!==o)t=g-o2*60000;return t;}

  return h12+':'+mm+(period?(p.h<12?' am':' pm'):'');
}

/* ================= Reminders engine =================
   r = {id,title,kind:'bill'|'family'|'doc'|'prep'|'other',sub,base:dn,cal:'bs'|'ad',
        repeat:'none'|'bsm'|'adm'|'bsy'|'ady'|'days'|'tim'|'tiy', n, note, doneUntil} */
function occurrences(r,from,to){
  const out=[],base=r.base;if(base==null||to<base)return out;
  const lo=Math.max(from,base),push=dn=>{if(dn>=lo&&dn<=to)out.push(dn);};
  switch(r.repeat){
    case 'none':push(base);break;
    case 'days':{const n=Math.max(1,r.n|0);let dn=base+Math.max(0,Math.ceil((lo-base)/n))*n;for(;dn<=to;dn+=n)push(dn);break;}
    case 'bsm':{const d0=dnToBs(base).d,s=dnToBs(lo);if(!s)break;let y=s.y,m=s.m;for(let i=0;i<40&&y<=BS1;i++){const dn=bsToDn(y,m,Math.min(d0,bsLen(y,m)));if(dn>to)break;push(dn);if(++m>12){m=1;y++;}}break;}
    case 'adm':{const d0=dnToAd(base).d,s=dnToAd(lo);let y=s.y,m=s.m;for(let i=0;i<40;i++){const dn=adToDn(y,m,Math.min(d0,adDim(y,m)));if(dn>to)break;push(dn);if(++m>12){m=1;y++;}}break;}
    case 'bsy':{const b=dnToBs(base),s=dnToBs(lo);if(!s)break;for(let y=s.y;y<=Math.min(BS1,s.y+3);y++){const dn=bsToDn(y,b.m,Math.min(b.d,bsLen(y,b.m)));if(dn>to)break;push(dn);}break;}
    case 'ady':{const a=dnToAd(base),s=dnToAd(lo);for(let y=s.y;y<=s.y+3;y++){const dn=adToDn(y,a.m,Math.min(a.d,adDim(y,a.m)));if(dn>to)break;push(dn);}break;}
    case 'tim':case 'tiy':{
      const ti=tithiAt(base).ti,lm=lunarAt(base).lm,hi=Math.min(to,lo+800);
      for(let dn=lo;dn<=hi;dn++){if(!tithiDay(dn,ti))continue;if(r.repeat==='tiy'){const l=lunarAt(dn);if(l.lm!==lm||l.adhik)continue;}push(dn);if(r.repeat==='tim')dn+=25;else dn+=320;}
      break;}
  }
  return out;
}
const nextOcc=(r,from)=>{const o=occurrences(r,from,from+(r.repeat==='tiy'||r.repeat==='bsy'||r.repeat==='ady'?400:r.repeat==='none'?30000:120));return o.length?o[0]:null;};
function remMapFor(from,to){const m=new Map();for(const r of S.reminders)for(const dn of occurrences(r,from,to)){if(!m.has(dn))m.set(dn,[]);m.get(dn).push(r);}return m;}
function birthdayOcc(from,to){const d=S.profile.dob;if(d==null)return [];return occurrences({base:d,repeat:'bsy'},from,to);}
function remStats(){
  const T=todayDn(),st={today:0,week:0,late:0,month:0};
  for(const r of S.reminders){
    for(const dn of occurrences(r,T-120,T+30)){
      if(r.doneUntil!=null&&dn<=r.doneUntil)continue;
      if(dn<T){if(r.kind!=='family')st.late++;continue;}
      if(dn===T)st.today++;if(dn<=T+7)st.week++;if(dn<=T+30)st.month++;
    }
  }
  return st;
}

/* ================= Shared UI helpers ================= */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2800);}
function cityOptions(sel,exclude=[]){
  const o=c=>exclude.includes(c.id)?'':`<option value="${c.id}"${c.id===sel?' selected':''}>${esc(cityName(c))}</option>`;
  return `<optgroup label="${L('नेपाल','Nepal')}">${CITIES.filter(c=>c.tz==='Asia/Kathmandu').map(o).join('')}</optgroup><optgroup label="${L('विदेश','Abroad')}">${CITIES.filter(c=>c.tz!=='Asia/Kathmandu').map(o).join('')}</optgroup>`;
}
const segVal=el=>{const b=el&&el.querySelector('[aria-pressed="true"]');return b?b.dataset.v:null;};
const segHTML=(id,opts,cur,label)=>`<div class="seg" id="${id}" role="group" aria-label="${esc(label)}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join('')}</div>`;
function mon(m){return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1];}
function fmtNum(x,dp=4){return N(Number(x).toLocaleString('en-IN',{maximumFractionDigits:dp}));}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
async function copyText(s){
  try{await navigator.clipboard.writeText(s);return true;}catch(e){
    const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();return ok;}
}

/* Date field: one input that accepts BS or AD, shows the other calendar live */
function dfVal(dn,cal){if(dn==null)return '';if(cal==='bs'){const b=dnToBs(dn);return b?N(`${b.y}-${pad(b.m)}-${pad(b.d)}`):'';}const a=dnToAd(dn);return `${a.y}-${pad(a.m)}-${pad(a.d)}`;}
function dfHTML(id,dn,cal='bs',label=''){
  return `<div class="df" data-df="${id}" data-cal="${cal}">
    ${label?`<span class="f-l" id="dfl-${id}">${esc(label)}</span>`:''}
    <div class="df-row">
      <div class="seg" role="group" aria-label="${L('पात्रो छान्नुहोस्','Calendar')}"><button type="button" data-dfcal="bs" aria-pressed="${cal==='bs'}">${L('वि.सं.','BS')}</button><button type="button" data-dfcal="ad" aria-pressed="${cal==='ad'}">${L('ई.सं.','AD')}</button></div>
      <input class="inp" ${cal==='ad'?'type="date"':'type="text" inputmode="numeric" autocomplete="off"'} value="${dfVal(dn,cal)}" placeholder="${cal==='bs'?N('2083-06-14'):'YYYY-MM-DD'}" ${label?`aria-labelledby="dfl-${id}"`:`aria-label="${L('मिति','Date')}"`}>
    </div>
    <span class="hint" aria-live="polite"></span>
  </div>`;
}
function dfRead(el){
  if(!el)return null;const v=toLat($('input',el).value.trim()),m=v.match(/^(\d{4})[-/. ](\d{1,2})[-/. ](\d{1,2})$/);if(!m)return null;
  const dn=el.dataset.cal==='bs'?bsToDn(+m[1],+m[2],+m[3]):adToDn(+m[1],+m[2],+m[3]);
  return dn==null||dn<MIN_DN||dn>MAX_DN?null:dn;
}
function dfUpdate(el){
  const inp=$('input',el),h=$('.hint',el),dn=dfRead(el);
  if(!inp.value.trim()){h.textContent='';h.classList.remove('bad');inp.removeAttribute('aria-invalid');return null;}
  if(dn==null){h.textContent=L('यो मिति मिलेन। YYYY-MM-DD ढाँचामा, वि.सं. २००० देखि २०९० भित्र लेख्नुहोस्।','That date doesn’t work. Use YYYY-MM-DD, within BS 2000–2090.');h.classList.add('bad');inp.setAttribute('aria-invalid','true');return null;}
  h.classList.remove('bad');inp.removeAttribute('aria-invalid');
  h.textContent='= '+(el.dataset.cal==='bs'?fmtAd(dn,true):fmtBs(dn))+', '+wdName(dn);return dn;
}
function dfSet(el,dn){if(!el)return;$('input',el).value=dfVal(dn,el.dataset.cal);dfUpdate(el);}
function dfSwitch(el,cal){
  const dn=dfRead(el);el.dataset.cal=cal;const inp=$('input',el);
  inp.type=cal==='ad'?'date':'text';inp.placeholder=cal==='bs'?N('2083-06-14'):'YYYY-MM-DD';
  if(cal==='bs')inp.setAttribute('inputmode','numeric');else inp.removeAttribute('inputmode');
  inp.value=dfVal(dn,cal);$$('[data-dfcal]',el).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.dfcal===cal)));dfUpdate(el);
}

/* Moon drawn from the real Sun–Moon elongation */
function moonD(e){
  const r=46,c=50,rx=Math.abs(Math.cos(e*RAD))*r;
  return e<180?`M${c} ${c-r}A${r} ${r} 0 0 1 ${c} ${c+r}A${rx} ${r} 0 0 ${e<90?0:1} ${c} ${c-r}Z`
              :`M${c} ${c-r}A${r} ${r} 0 0 0 ${c} ${c+r}A${rx} ${r} 0 0 ${e>270?1:0} ${c} ${c-r}Z`;
}
function moonSVG(e){
  const pct=Math.round((1-Math.cos(e*RAD))/2*100);
  return `<svg class="moon" viewBox="0 0 100 100" role="img" aria-label="${L('चन्द्रमा '+N(pct)+'% उज्यालो','Moon '+pct+'% lit')}"><circle cx="50" cy="50" r="46" fill="var(--moon-base)"/><path d="${moonD(e)}" fill="var(--moon-lit)"/></svg>`;
}

/* ================= Roman → Devanagari (local, nothing is sent anywhere) ================= */
const TV=[['aa','ा','आ'],['ai','ै','ऐ'],['au','ौ','औ'],['ee','ी','ई'],['ii','ी','ई'],['oo','ू','ऊ'],['uu','ू','ऊ'],['A','ा','आ'],['I','ी','ई'],['U','ू','ऊ'],['R','ृ','ऋ'],['a','','अ'],['i','ि','इ'],['u','ु','उ'],['e','े','ए'],['o','ो','ओ']];
const TCN=[['ksh','क्ष'],['chh','छ'],['gy','ज्ञ'],['kh','ख'],['gh','घ'],['NG','ङ'],['NY','ञ'],['ch','च'],['Ch','छ'],['jh','झ'],['Th','ठ'],['Dh','ढ'],['th','थ'],['dh','ध'],['ph','फ'],['bh','भ'],['Sh','ष'],['sh','श'],['k','क'],['g','ग'],['c','च'],['j','ज'],['T','ट'],['D','ड'],['N','ण'],['t','त'],['d','द'],['n','न'],['p','प'],['f','फ'],['b','ब'],['m','म'],['y','य'],['r','र'],['l','ल'],['v','व'],['w','व'],['s','स'],['S','श'],['h','ह'],['x','क्ष'],['z','ज'],['q','क']];
function translit(src){
  let o='',i=0,pc=false;
  while(i<src.length){
    if(src.startsWith('OM',i)){o+='ॐ';i+=2;pc=false;continue;}
    const ch=src[i];
    if(ch==='_'){if(pc)o+='्';pc=false;i++;continue;}
    const c=TCN.find(([k])=>src.startsWith(k,i));
    if(c){if(pc)o+='्';o+=c[1];i+=c[0].length;pc=true;const v=TV.find(([k])=>src.startsWith(k,i));if(v){o+=v[1];i+=v[0].length;pc=false;}continue;}
    const v=TV.find(([k])=>src.startsWith(k,i));
    if(v){o+=v[2];i+=v[0].length;pc=false;continue;}
    pc=false;i++;
    o+=ch==='M'?'ं':ch==='~'?'ँ':ch==='H'?'ः':ch==='.'?'।':/\d/.test(ch)?DEV[ch]:ch;
  }
  return o.replace(/(\S{2,})ि(?=$|[\s।,?!])/g,'$1ी'); /* Nepali words rarely end in short ि: nepali → नेपाली, ki → कि */
}
function variants(w){
  const out=[w],add=s=>{if(s&&!out.includes(s))out.push(s);};
  add(w.replace(/ि$/,'ी'));add(w.replace(/ी$/,'ि'));add(w.replace(/ु$/,'ू'));
  for(const [a,b] of [['त','ट'],['द','ड'],['न','ण'],['स','श'],['ब','व'],['ि','ी'],['ु','ू'],['ं','ँ'],['थ','ठ'],['ध','ढ'],['श','ष']]){
    const k=w.indexOf(a);if(k>=0)add(w.slice(0,k)+b+w.slice(k+1));if(out.length>=6)break;
  }
  return out.slice(0,6);
}

/* ================= Preeti ⇄ Unicode (verified against reference converters) ================= */
const PM={'!':'१','"':'ू','#':'३','$':'४','%':'५','&':'७',"'":'ु','(':'९',')':'०','*':'८','+':'ं',',':',','-':'(','.':'।','/':'र','0':'ण्','1':'ज्ञ','2':'द्द','3':'घ','4':'द्ध','5':'छ','6':'ट','7':'ठ','8':'ड','9':'ढ',':':'स्',';':'स','<':'?','=':'.','>':'श्र','?':'रु','@':'२','A':'ब्','B':'द्य','C':'ऋ','D':'म्','E':'भ्','F':'ँ','G':'न्','H':'ज्','I':'क्ष्','J':'व्','K':'प्','L':'ी','M':'ः','N':'ल्','O':'इ','P':'ए','Q':'त्त','R':'च्','S':'क्','T':'त्','U':'ग्','V':'ख्','W':'ध्','X':'ह्','Y':'थ्','Z':'श्','[':'ृ','\\':'्',']':'े','^':'६','_':')','`':'ञ','a':'ब','b':'द','c':'अ','d':'म','e':'भ','f':'ा','g':'न','h':'ज','i':'ष्','j':'व','k':'प','l':'ि','n':'ल','o':'य','p':'उ','q':'त्र','r':'च','s':'क','t':'त','u':'ग','v':'ख','w':'ध','x':'ह','y':'थ','z':'श','{':'र्','|':'्र','}':'ै','~':'ञ्','¡':'ज्ञ्','¢':'द्घ','£':'घ्','¤':'झ्','¥':'र्‍','§':'ट्ट','©':'र','ª':'ङ','«':'्र','°':'ङ्ढ','±':'+','´':'झ','¶':'ठ्ठ','¿':'रू','Å':'हृ','Æ':'”','Ë':'ङ्ग','Ì':'न्न','Í':'ङ्क','Î':'ङ्ख','Ö':'=','Ø':'्य','Ù':';','Ú':'’','Û':'!','Ü':'%','Ý':'ट्ठ','ß':'द्म','å':'द्व','æ':'“','ç':'ॐ','÷':'/','‘':'ॅ','•':'ड्ड','…':'‘','ˆ':'फ्','˜':'ऽ','‰':'झ्','‹':'ङ्घ','›':'द्र'};
const PPRE=[['cf]','ओ'],['cf}','औ'],['cf','आ'],['O{','ई'],['P]','ऐ'],['km','फ'],['Km','फ्'],['pm','ऊ'],['qm','क्र'],['Qm','क्त']];
const PCONS='[\\u0915-\\u0939\\u0958-\\u095F]',PCL=`(?:${PCONS}्)*${PCONS}(?:्र|्य)?`,PMAT='[ािीुूृेैोौंँः]*';
function preetiToUni(s){
  let o='';
  outer:for(let i=0;i<s.length;){for(const [k,v] of PPRE){if(s.startsWith(k,i)){o+=v;i+=k.length;continue outer;}}const c=s[i];o+=PM[c]!==undefined?PM[c]:c;i++;}
  o=o.replace(/्ा/g,'').replace(/ाे/g,'ो').replace(/ाै/g,'ौ').replace(/अा/g,'आ').replace(/([ंँ])([ािीुूृेैोौ])/g,'$2$1').replace(/(^|[^\u0900-\u097F])ः/g,'$1:');
  o=o.replace(new RegExp(`ि(${PCL})`,'g'),'$1ि');
  return o.replace(new RegExp(`(${PCL}${PMAT})र्`,'g'),'र्$1');
}
const PINV=(()=>{const m={};for(const [k,v] of Object.entries(PM)){if(!(v in m)||(m[v].charCodeAt(0)>=128&&k.charCodeAt(0)<128))m[v]=k;}
  Object.assign(m,{'ओ':'cf]','औ':'cf}','आ':'cf','ई':'O{','ऐ':'P]','ो':'f]','ौ':'f}','फ':'km','फ्':'Km','ऊ':'pm','क्र':'qm','क्त':'Qm','र':'/','्र':'|','ः':'M','ञ':'`'});return m;})();
const PINVK=Object.keys(PINV).sort((a,b)=>b.length-a.length);
function uniToPreeti(s){
  s=s.normalize('NFC').replace(new RegExp(`र्(${PCL}${PMAT})`,'g'),'$1{').replace(new RegExp(`(${PCL})ि`,'g'),'ि$1');
  let o='';outer:for(let i=0;i<s.length;){for(const k of PINVK){if(s.startsWith(k,i)){o+=PINV[k];i+=k.length;continue outer;}}o+=s[i];i++;}
  return o.replace(/्/g,'\\');
}

/* ================= Canvas helpers for share cards ================= */
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function wrapLines(x,text,maxW){
  const out=[];for(const para of text.split(/\n/)){let line='';for(const w of para.split(/\s+/)){const t=line?line+' '+w:w;if(x.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}if(line)out.push(line);}
  return out;
}
function fitFont(x,text,maxW,size,tpl){let s=size;do{x.font=tpl.replace('{s}',s);s-=6;}while(x.measureText(text).width>maxW&&s>24);}

function resultDate(dn,mode){
  const T=todayDn(),t=tithiAt(dn);
  const big=mode==='ad'?fmtAd(dn,true):fmtBs(dn);
  const other=mode==='both'?fmtAd(dn,true)+', ':'';
  return `<div class="big">${big}</div><div class="sub">${other}${wdName(dn)}, ${tithiName(t.ti)} ${t.ti<15?L('शुक्ल','(shukla)'):L('कृष्ण','(krishna)')}, ${relText(dn-T)}</div>
  <div class="acts"><button class="btn small" data-act="open-day" data-dn="${dn}">${L('पात्रोमा हेर्नुहोस्','Show in calendar')}</button><button class="btn small" data-act="add-rem" data-dn="${dn}">+ ${L('सम्झना','Reminder')}</button></div>`;
}
function bsDiff(d1,d2){
  if(d1>d2)[d1,d2]=[d2,d1];const a=dnToBs(d1),b=dnToBs(d2);let y=b.y-a.y,m=b.m-a.m,d=b.d-a.d;
  if(d<0){m--;let pm=b.m-1,py=b.y;if(pm<1){pm=12;py--;}d+=py>=BS0?bsLen(py,pm):30;}
  if(m<0){y--;m+=12;}return {y,m,d};
}
function upcomingEvents(from,days){const out=[];for(let dn=from;dn<=Math.min(MAX_DN,from+days);dn++)for(const e of eventsOn(dn))out.push({dn,...e});return out;}

    const T=todayDn(),evs=upcomingEvents(T,150),P=S.profile;
    return `<div class="cardwrap"><div class="stack">
      <div class="f">${L('कार्डको प्रकार','Card type')}${segHTML('cd-type',[['date',L('मिति','Date')],['fest',L('पर्व','Festival')],['bday',L('जन्मदिन','Birthday')]],'date',L('कार्डको प्रकार','Card type'))}</div>
      <label class="f" id="cd-ev-w" hidden>${L('पर्व','Festival')}<select class="inp" id="cd-ev">${evs.map(e=>`<option value="${e.dn}">${esc(li([e.ne,e.en]))}, ${fmtBs(e.dn,{year:false})}</option>`).join('')||`<option value="">${L('नजिकै पर्व छैन','No festival coming up')}</option>`}</select></label>
      <div id="cd-dt-w">${dfHTML('cd',V.sel??T,'bs',L('मिति','Date'))}</div>
      <label class="f" id="cd-to-w" hidden>${L('कसलाई','For whom')}<input class="inp" id="cd-to" placeholder="${L('जस्तै: आमा','e.g. Mum')}"></label>
      <label class="f">${L('सन्देश','Message')}<textarea class="inp" id="cd-msg" rows="3" style="min-height:90px"></textarea></label>
      <label class="f">${L('पठाउने','From')}<input class="inp" id="cd-from" value="${esc(P.name)}"></label>
      <div class="f">${L('शैली','Style')}${segHTML('cd-style',[['light',L('उज्यालो','Light')],['dark',L('गाढा','Dark')]],'light',L('शैली','Style'))}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="cd-dl">${L('PNG डाउनलोड गर्नुहोस्','Download PNG')}</button>${navigator.share?`<button class="btn" data-act="cd-share">${L('सेयर गर्नुहोस्','Share')}</button>`:''}</div>
    </div><canvas class="cardprev" id="cd-c" width="1080" height="1080" role="img" aria-label="${L('कार्डको पूर्वावलोकन','Card preview')}"></canvas></div>`;
  },
  init(p){this.dirty=false;this.calc(p);},
  msg(p){
    const ty=segVal($('#cd-type',p));
    if(ty==='bday')return L('जन्मदिनको धेरै धेरै शुभकामना! सुस्वास्थ्य, सफलता र खुसीको कामना।','Happy birthday! Wishing you health, success and happiness.');
    if(ty==='fest'){const dn=+$('#cd-ev',p).value,ev=dn?eventsOn(dn)[0]:null;if(ev)return L(`${ev.ne}को हार्दिक मंगलमय शुभकामना!`,`Warm wishes on ${ev.en}!`);}
    return L('शुभ दिन! तपाईंको दिन सुन्दर बितोस्।','Wishing you a lovely day!');
  },
  calc(p,e){
    if(e&&e.target.id==='cd-msg')this.dirty=true;
    const ty=segVal($('#cd-type',p));
    $('#cd-ev-w',p).hidden=ty!=='fest';$('#cd-dt-w',p).hidden=ty==='fest';$('#cd-to-w',p).hidden=ty!=='bday';
    if(!this.dirty)$('#cd-msg',p).value=this.msg(p);
    drawCard(p);
  }
},

tax:{

      <label class="check"><input type="checkbox" id="tx-ssf" ${v.ssf?'checked':''}> ${L('म SSF मा योगदान गर्छु (पहिलो तहको १% सामाजिक सुरक्षा कर छुट)','I contribute to SSF (1% social security tax on the first slab is waived)')}</label>
      <label class="check"><input type="checkbox" id="tx-f" ${v.f?'checked':''}> ${L('महिला, पारिश्रमिक आय मात्र (करमा १०% छुट)','Woman with only employment income (10% rebate)')}</label>
    </div><div class="result" id="tx-r"></div>`;
  },
  init(p){this.calc(p);},
  calc(p,e){

    const inc=g('#tx-inc'),ssf=$('#tx-ssf',p).checked,fem=$('#tx-f',p).checked;
    const ret=Math.min(g('#tx-ret'),inc/3,500000),life=Math.min(g('#tx-life'),40000),hea=Math.min(g('#tx-health'),20000);
    const taxable=Math.max(0,inc-ret-life-hea);
    const SL=[[1000000,ssf?0:.01],[500000,.10],[1000000,.20],[1500000,.27],[Infinity,.29]];
    let left=taxable,tax=0,rows='';
    const labs=[L('पहिलो रु. १० लाख','First Rs 10 lakh'),L('अर्को रु. ५ लाख','Next Rs 5 lakh'),L('अर्को रु. १० लाख','Next Rs 10 lakh'),L('अर्को रु. १५ लाख','Next Rs 15 lakh'),L('रु. ४० लाखभन्दा माथि','Above Rs 40 lakh')];
    SL.forEach(([w,r],i)=>{const a=Math.min(left,w);if(a<=0&&i>0)return;const t=a*r;tax+=t;left-=a;rows+=`<tr><td>${labs[i]}</td><td>${N(Math.round(r*100))}%</td><td>${money(a)}</td><td>${money(t)}</td></tr>`;});

  }
},
land:{
  U:[['rapd',['रोपनी-आना-पैसा-दाम','Ropani-Aana-Paisa-Daam'],0],['ropani',['रोपनी','Ropani'],5476],['aana',['आना','Aana'],342.25],['paisa',['पैसा','Paisa'],85.5625],['daam',['दाम','Daam'],21.390625],['bkd',['बिघा-कट्ठा-धुर','Bigha-Kattha-Dhur'],0],['bigha',['बिघा','Bigha'],72900],['kattha',['कट्ठा','Kattha'],3645],['dhur',['धुर','Dhur'],182.25],['sqft',['वर्ग फिट','Square feet'],1],['sqm',['वर्ग मिटर','Square metres'],10.7639104],['acre',['एकड','Acre'],43560],['hectare',['हेक्टर','Hectare'],107639.104]],
  html(){const v=S.tools.land||{u:'rapd',x:'0-8-0-0'};return `<div class="two"><label class="f">${L('परिमाण','Amount')}<input class="inp" id="ld-v" value="${esc(v.x)}" inputmode="decimal" autocomplete="off"></label>
      <label class="f">${L('एकाइ','Unit')}<select class="inp" id="ld-u">${this.U.map(([k,n])=>`<option value="${k}"${k===v.u?' selected':''}>${li(n)}</option>`).join('')}</select></label></div>
      <p class="hint" style="margin-top:8px">${L('जोडिएका एकाइमा ड्यासले छुट्याउनुहोस्, जस्तै ०-८-२-० (रोपनी-आना-पैसा-दाम) वा १-५-० (बिघा-कट्ठा-धुर)।','For compound units separate with dashes, e.g. 0-8-2-0 (R-A-P-D) or 1-5-0 (B-K-D).')}</p>

  calc(p){

    if(u==='rapd'){const [r=0,a=0,pa=0,d=0]=parts;if(parts.every(x=>!isNaN(x)))sq=r*5476+a*342.25+pa*85.5625+d*21.390625;}
    else if(u==='bkd'){const [b=0,k=0,d=0]=parts;if(parts.every(x=>!isNaN(x)))sq=b*72900+k*3645+d*182.25;}
    else{const x=parseFloat(raw);if(!isNaN(x))sq=x*this.U.find(z=>z[0]===u)[2];}
    S.tools.land={u,x:$('#ld-v',p).value};save();
    if(sq==null||!raw){$('#ld-r',p).innerHTML=`<div class="sub">${L('अंक लेख्नुहोस्।','Enter a number.')}</div>`;$('#ld-units',p).innerHTML='';return;}
    let d=sq/21.390625;const R=Math.floor(d/256+1e-9);d-=R*256;const A=Math.floor(d/16+1e-9);d-=A*16;const P=Math.floor(d/4+1e-9);d-=P*4;
    let h=sq/182.25;const B=Math.floor(h/400+1e-9);h-=B*400;const K=Math.floor(h/20+1e-9);h-=K*20;
    $('#ld-r',p).innerHTML=`<div class="sub">${L('रोपनी-आना-पैसा-दाम','Ropani-Aana-Paisa-Daam')}</div><div class="big">${N(R)}-${N(A)}-${N(P)}-${fmtNum(d,2)}</div><div class="sub">${L('बिघा-कट्ठा-धुर','Bigha-Kattha-Dhur')}: ${N(B)}-${N(K)}-${fmtNum(h,2)}, ${fmtNum(sq,2)} ${L('वर्ग फिट','sq ft')}</div>`;

type:{
  html(){return `<label class="f">${L('रोमनमा लेख्नुहोस्; Space ले पहिलो सुझाव थप्छ','Type in Roman; Space adds the first suggestion')}<input class="inp" id="ty-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="namaste" style="font-size:19px"></label>

  init(p){this.calc(p);},
  cur:'',
  suggest(p){const w=$('#ty-in',p).value.trim();const box=$('#ty-sug',p);if(!w){box.innerHTML=`<span class="hint">${L('सुझाव यहाँ देखिन्छन्','Suggestions appear here')}</span>`;return;}
    box.innerHTML=variants(translit(w)).map(s=>`<button type="button" data-act="ty-pick" data-w="${esc(s)}">${esc(s)}</button>`).join('');},
  commit(p,word){const doc=$('#ty-doc',p);doc.value+=(doc.value&&!/\s$/.test(doc.value)?' ':'')+word+' ';$('#ty-in',p).value='';this.suggest(p);S.tools.typeDoc=doc.value;save();},
  calc(p,e){
    if(e&&e.target.id==='ty-doc'){S.tools.typeDoc=e.target.value;save();return;}

    if(/\s/.test(v)){const parts=v.split(/\s+/);const last=parts.pop();for(const w of parts)if(w)this.commit(p,translit(w));inp.value=last;}
    this.suggest(p);
  }
},

qr:{
  html(){return `<div class="two"><label class="f">${L('पाठ वा लिंक','Text or link')}<textarea class="inp" id="qr-t">${esc(S.tools.qr||'आफ्नै पात्रो')}</textarea></label>
      <div class="stack"><label class="f">${L('आकार','Size')}<select class="inp" id="qr-s"><option value="256">256 px</option><option value="384" selected>384 px</option><option value="512">512 px</option></select></label>
      <button class="btn primary" data-act="qr-dl">${L('PNG डाउनलोड गर्नुहोस्','Download PNG')}</button></div></div>
    <div class="qrbox" id="qr-box" style="margin-top:16px"></div>
    <p class="hint" style="margin-top:10px">${L('QR यही उपकरणमा बन्छ, पाठ कतै पठाइँदैन। पहिलो पटक QR लाइब्रेरी लोड गर्न इन्टरनेट चाहिन्छ।','QR codes are made on this device and the text is never sent anywhere. The first use needs internet to load the QR library.')}</p>`;},
  init(p){this.calc(p);},
  calc(p){clearTimeout(this.h);this.h=setTimeout(()=>this.draw(p),250);},
  async draw(p){
    const box=$('#qr-box',p);if(!box)return;const t=$('#qr-t',p).value,s=+$('#qr-s',p).value;S.tools.qr=t;save();
    if(!t.trim()){box.innerHTML=`<span class="hint">${L('पाठ लेख्नुहोस्।','Enter some text.')}</span>`;return;}
    try{await loadQR();box.innerHTML='';new window.QRCode(box,{text:t,width:s,height:s,colorDark:'#0E2A6B',colorLight:'#ffffff',correctLevel:window.QRCode.CorrectLevel.M});}
    catch(e){box.innerHTML=`<span class="hint bad">${e&&e.message==='load'?L('QR लाइब्रेरी लोड भएन। इन्टरनेट जोडेर फेरि प्रयास गर्नुहोस्।','The QR library didn’t load. Connect to the internet and try again.'):L('पाठ धेरै लामो भयो। छोटो बनाउनुहोस्।','That text is too long for a QR code. Shorten it.')}</span>`;}
  }
}
};
function loadQR(){
  if(window.QRCode)return Promise.resolve();
  return loadQR.p||(loadQR.p=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=()=>res();s.onerror=()=>{loadQR.p=null;rej(new Error('load'));};document.head.appendChild(s);}));
}

async function drawCard(p){
  const cv=$('#cd-c',p);if(!cv)return;const x=cv.getContext('2d'),W=1080,tok=drawCard.tok=(drawCard.tok||0)+1;
  try{await Promise.race([Promise.all([document.fonts.load('700 120px "Eczar"'),document.fonts.load('500 40px "Anek Devanagari"')]),new Promise(r=>setTimeout(r,1200))]);}catch(e){}
  if(tok!==drawCard.tok)return;
  const ty=segVal($('#cd-type',p)),dark=segVal($('#cd-style',p))==='dark';
  const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#E08E00';
  const C=dark?{bg:'#0A2A66',ink:'#FFFFFF',sub:'#C5D1F0',red:'#FF9AA8',line:'rgba(255,255,255,.24)',mb:'#2B4687',ml:'#F6E2A2'}:{bg:'#FFFFFF',ink:'#0A2A66',sub:'#566079',red:'#C8102E',line:'#D8DEE9',mb:'#E3E8F1',ml:'#F0B02C'};
  const DISP='"Eczar","Noto Serif Devanagari","Nirmala UI",serif',UI='"Anek Devanagari","Noto Sans Devanagari","Nirmala UI",sans-serif';
  x.clearRect(0,0,W,W);x.fillStyle=C.bg;x.fillRect(0,0,W,W);x.strokeStyle=C.line;x.lineWidth=4;rr(x,44,44,W-88,W-88,56);x.stroke();
  x.textAlign='center';x.textBaseline='alphabetic';
  const dn=ty==='fest'?(+$('#cd-ev',p).value||todayDn()):(dfRead($('[data-df="cd"]',p))??todayDn()),b=dnToBs(dn),t=tithiAt(dn);
  let msgY;

function upcomingItems(days=60){
  const T=todayDn(),items=[];
  for(const r of S.reminders){

    const late=occ.filter(dn=>dn<T);if(late.length&&r.kind!=='family')items.push({dn:late[late.length-1],r,late:true});
    occ.filter(dn=>dn>=T).slice(0,2).forEach(dn=>items.push({dn,r}));
  }
  for(const dn of birthdayOcc(T,T+days))items.push({dn,bday:true});

function fmtClock(ms,tz){const p=tzParts(ms,tz),s=new Date(ms).getSeconds();return fmtTime(ms,tz)+`<span style="font-size:.55em;opacity:.7">:${N(pad(s))}</span>`;}
function countdownHTML(dn){
  const ad=dnToAd(dn),target=localToUtc(ad.y,ad.m,ad.d,0,0,'Asia/Kathmandu'),ms=Math.max(0,target-Date.now());
  const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/36e5),m=Math.floor(ms%36e5/6e4);
  return [[d,L('दिन','days')],[h,L('घण्टा','hours')],[m,L('मिनेट','min')]].map(([v,l])=>`<div><b>${N(v)}</b><span>${l}</span></div>`).join('');

function quickConvert(q){
  const v=toLat(q.trim()).match(/^(\d{4})[-/. ](\d{1,2})[-/. ](\d{1,2})$/);if(!v)return L('YYYY-MM-DD ढाँचामा लेख्नुहोस्।','Use YYYY-MM-DD.');
  const [y,m,d]=[+v[1],+v[2],+v[3]],out=[];const bs=bsToDn(y,m,d),ad=adToDn(y,m,d);
  if(bs!=null)out.push(`${L('वि.सं.','BS')} → <b>${fmtAd(bs,true)}</b>, ${wdName(bs)}`);
  if(ad!=null&&ad>=MIN_DN&&ad<=MAX_DN)out.push(`${L('ई.सं.','AD')} → <b>${fmtBs(ad)}</b>, ${wdName(ad)}`);
  return out.join('<br>')||L('यो मिति मिलेन।','That date doesn’t work.');
}

function faqItems(){
  const T=todayDn(),b=dnToBs(T),t=tithiAt(T),y=b.y,find=(re)=>nextEvents(bsToDn(y,1,1),400,false,999).find(e=>re.test(e.en));
  const gh=find(/Ghatasthapana/),vd=find(/Vijaya Dashami/),lp=find(/Laxmi Puja/),bt=find(/Bhai Tika/);
  let days=0;for(let m=1;m<=12;m++)days+=bsLen(y,m);
  const d=e=>e?`${fmtBs(e.dn)} (${fmtAd(e.dn,true)}, ${wdName(e.dn)})`:'—';
  return [
    [L('आज कति गते हो?','What is today’s Nepali date?'),L(`आज वि.सं. ${N(b.y)} ${bsMonth(b.m)} ${N(b.d)} गते, ${wdName(T)} हो। ई.सं. मा ${fmtAd(T,true)}। तिथि ${pakshaName(t.ti)} ${tithiName(t.ti)}।`,`Today is ${bsMonth(b.m)} ${b.d}, ${b.y} BS, ${wdName(T)} (${fmtAd(T,true)}). Tithi: ${tithiName(t.ti)}, ${pakshaName(t.ti)}.`)],
    [L(`दसैं ${N(y)} कहिले हो?`,`When is Dashain ${y}?`),L(`घटस्थापना ${d(gh)} र विजया दशमी ${d(vd)} मा पर्छ।`,`Ghatasthapana is on ${d(gh)} and Vijaya Dashami on ${d(vd)}.`)],
    [L(`तिहार ${N(y)} कहिले हो?`,`When is Tihar ${y}?`),L(`लक्ष्मी पूजा ${d(lp)} र भाइटीका ${d(bt)} मा पर्छ।`,`Laxmi Puja is on ${d(lp)} and Bhai Tika on ${d(bt)}.`)],
    [L(`वि.सं. ${N(y)} मा कति दिन छन्?`,`How many days are in ${y} BS?`),L(`वि.सं. ${N(y)} मा ${N(days)} दिन छन्। महिनाका दिन: ${Array.from({length:12},(_,i)=>N(bsLen(y,i+1))).join(', ')}।`,`${y} BS has ${days} days. Month lengths: ${Array.from({length:12},(_,i)=>bsLen(y,i+1)).join(', ')}.`)],
    [L('वि.सं. लाई ई.सं. मा कसरी बदल्ने?','How do I convert BS to AD?'),L('मिति रूपान्तरण उपकरणमा साल, महिना र गते छान्नुहोस्। वि.सं. ई.सं. भन्दा करिब ५६ वर्ष ८ महिना अगाडि हुन्छ, तर महिनाका दिन हरेक वर्ष फरक हुने भएकाले तालिका चाहिन्छ।','Use the date converter and choose year, month and day. BS runs about 56 years 8 months ahead of AD, but month lengths change every year, so a lookup table is needed.')],
    [L('तिथि कसरी निकालिन्छ?','How is the tithi calculated?'),L('सूर्य र चन्द्रमाबीचको कोण हरेक १२ अंश बढ्दा एक तिथि पूरा हुन्छ। यहाँ काठमाडौंको सूर्योदयमा रहेको तिथि (उदया तिथि) देखाइन्छ।','One tithi passes each time the Moon gains 12° on the Sun. The tithi shown is the one prevailing at Kathmandu sunrise (udaya tithi).')]
  ];
}
function faqCard(){return `<section class="card faq" aria-labelledby="faq-h">${cardH('info',L('प्रायः सोधिने प्रश्न','Frequently asked questions'),'','faq-h')}${faqItems().map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</section>`;}

/* ================= Pages ================= */
function viewHome(first){
  return bandHTML(first)+`<div class="wrap dash"><div class="stack">
      <section class="card" id="cal" aria-labelledby="cal-title">${calCard()}</section>
      <section class="card card-b" id="day" aria-live="polite" aria-label="${L('छानिएको दिन','Selected day')}">${dayCard(V.sel)}</section>
      ${monthEventsCard()}${faqCard()}
      <section class="card seo-text"><h2>${L('नेपाली पात्रो, तपाईंकै लागि','A Nepali calendar made yours')}</h2><p>${L('आफ्नै पात्रोमा वि.सं. २००० देखि २०९० सम्मको पूरा नेपाली पात्रो छ। हरेक दिनको तिथि, नक्षत्र, नेपाल संवत्, सूर्योदय र सूर्यास्त खगोलीय गणनाबाट निकालिन्छ। २०८३ सालका सार्वजनिक बिदा नेपाल राजपत्रअनुसार छन्।','Aafnai Patro covers the full Bikram Sambat calendar from 2000 to 2090. Each day’s tithi, nakshatra, Nepal Sambat, sunrise and sunset are calculated astronomically, and 2083 public holidays follow the Nepal Gazette.')}</p><p>${L('मिति रूपान्तरण, उमेर गणक, आयकर, EMI, जग्गा नाप, विदेशी मुद्रा, सुनचाँदी, प्रीति–युनिकोड र नेपाली टाइपिङ जस्ता उपकरण निःशुल्क छन्, र तपाईंका सम्झना तपाईंकै ब्राउजरमा सुरक्षित रहन्छन्।','Tools like the date converter, age calculator, income tax, EMI, land units, forex, gold, Preeti–Unicode and Nepali typing are free, and your reminders stay in your own browser.')}</p></section>
    </div><aside class="stack side" aria-label="${L('साइडबार','Sidebar')}">${upcomingCard()}${rashiWidget()}${widgetFx()}${widgetMetal()}${quickTools()}</aside></div>`;
}
function pageHead(crumbs,h1,p){return `<div class="wrap pagehead"><nav class="crumbs" aria-label="${L('ब्रेडक्रम्ब','Breadcrumb')}">${crumbs.map(([t,u],i)=>(u?A(u,esc(t)):`<span aria-current="page">${esc(t)}</span>`)+(i<crumbs.length-1?'<span aria-hidden="true">›</span>':'')).join('')}</nav><h1>${h1}</h1>${p?`<p>${p}</p>`:''}</div>`;}
function viewDate(dn){
  const b=dnToBs(dn),evs=eventsOn(dn),T=todayDn();
  return pageHead([[L('गृहपृष्ठ','Home'),'/'],[`${bsMonth(b.m)} ${N(b.y)}`,`/calendar/${b.y}/${b.m}`],[fmtBs(dn),null]],`${fmtBs(dn)}, ${wdName(dn)}`,`${fmtAd(dn,true)}${evs.length?', '+evs.map(e=>esc(li([e.ne,e.en]))).join(', '):''}`)
   +`<div class="wrap dash" style="margin-top:0"><div class="stack"><section class="card card-b">${dayCard(dn,true)}</section>
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">${dn>MIN_DN?A(bsPath(dn-1),IC.left+fmtBs(dn-1),'class="btn"'):'<span></span>'}${A('/',L('आज','Today'),'class="btn"')}${dn<MAX_DN?A(bsPath(dn+1),fmtBs(dn+1)+IC.right,'class="btn"'):''}</div></div>
    <aside class="stack side">${(()=>{V.vy=b.y;V.vm=b.m;V.sel=dn;return '';})()}<section class="card" id="cal" aria-labelledby="cal-title">${calCard()}</section>${upcomingCard()}</aside></div>`;
}
function viewYear(y){
  const T=todayDn();
  const mini=m=>{const f=bsToDn(y,m,1),n=bsLen(y,m),lead=wd(f),hols=[];let g=li(WDS).map((w,i)=>`<span class="w${i===6?' s':''}">${w.slice(0,isNe()?2:1)}</span>`).join('')+'<span></span>'.repeat(lead);
    for(let d=0;d<n;d++){const dn=f+d,ev=eventsOn(dn),h=ev.some(e=>e.h);if(h)hols.push([d+1,li([ev.find(e=>e.h).ne,ev.find(e=>e.h).en])]);g+=A(bsPath(dn),N(d+1),`class="${dn===T?'t':h?'h':wd(dn)===6?'s':''}" aria-label="${esc(fmtBs(dn)+(h?', '+L('बिदा','holiday'):''))}"`);}
    const a1=dnToAd(f),a2=dnToAd(f+n-1);
    return `<section class="card mini"><h3>${A(`/calendar/${y}/${m}`,bsMonth(m))}<small>${mon(a1.m)}–${mon(a2.m)} ${a2.y}</small></h3><div class="mgrid">${g}</div>${hols.length?`<ul>${hols.slice(0,5).map(([d,n])=>`<li><b>${N(d)}</b>${esc(n)}</li>`).join('')}${hols.length>5?`<li>+${N(hols.length-5)}</li>`:''}</ul>`:''}</section>`;};
  return pageHead([[L('गृहपृष्ठ','Home'),'/'],[L(`वार्षिक पात्रो ${N(y)}`,`Year ${y}`),null]],L(`नेपाली पात्रो ${N(y)}`,`Nepali Calendar ${y} BS`),L(`वि.सं. ${N(y)} का १२ महिना एकै पृष्ठमा, सार्वजनिक बिदा रातोमा।${isOfficialYear(y)?'':' यस वर्षका चाडपर्व तिथि नियमबाट अनुमान गरिएका।'}`,`All 12 months of ${y} BS on one page, public holidays in red.${isOfficialYear(y)?'':' Festivals this year are estimated from tithi rules.'}`))
   +`<div class="wrap page"><div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">${y>BS0?A('/year/'+(y-1),IC.left+N(y-1),'class="btn"'):''}${y<BS1?A('/year/'+(y+1),N(y+1)+IC.right,'class="btn"'):''}${A('/holidays/'+y,IC.flag+L('बिदाको सूची','Holiday list'),'class="btn primary"')}<button class="btn" data-act="print">${L('प्रिन्ट','Print')}</button></div><div class="ygrid">${Array.from({length:12},(_,i)=>mini(i+1)).join('')}</div></div>`;
}
function viewHolidays(y){
  const T=todayDn(),all=nextEvents(bsToDn(y,1,1),366,false,999).filter(e=>dnToBs(e.dn).y===y),f=V.hf||'h',list=all.filter(e=>f==='all'||(f==='h'?e.h:e.h||e.t==='p'));
  let lastM=0,rows='';for(const e of list){const b=dnToBs(e.dn);if(b.m!==lastM){lastM=b.m;rows+=`<tr class="mhead"><td colspan="5">${bsMonth(b.m)} ${N(y)}</td></tr>`;}
    rows+=`<tr class="${e.h?'hol':''}${e.dn<T?' past':''}"><td><b>${N(b.d)} ${bsMonth(b.m)}</b></td><td>${fmtAd(e.dn)}</td><td>${wdName(e.dn)}</td><td>${A(bsPath(e.dn),esc(li([e.ne,e.en])))}${e.h?`<span class="badge">${L('बिदा','Holiday')}</span>`:e.t==='p'?`<span class="badge p">${L('आंशिक','Partial')}</span>`:''}${e.est?`<span class="badge est">${L('अनुमानित','est.')}</span>`:''}</td><td class="r">${e.dn<T?L('बितिसक्यो','passed'):relText(e.dn-T)}</td></tr>`;}
  const nh=all.filter(e=>e.h).length;
  return pageHead([[L('गृहपृष्ठ','Home'),'/'],[L(`बिदा ${N(y)}`,`Holidays ${y}`),null]],L(`सार्वजनिक बिदा र चाडपर्व ${N(y)}`,`Public holidays & festivals ${y} BS`),L(`वि.सं. ${N(y)} मा शनिबारबाहेक ${N(nh)} दिन राष्ट्रिय सार्वजनिक बिदा।${isOfficialYear(y)?' स्रोत: नेपाल राजपत्र।':' यो वर्षका चाडपर्व तिथिबाट अनुमान गरिएका; आधिकारिक सूची आएपछि मिलाउनुहोस्।'}`,`${nh} nationwide public holidays in ${y} BS besides Saturdays.${isOfficialYear(y)?' Source: Nepal Gazette.':' Festivals this year are estimated from tithi rules; check the official list.'}`))
   +`<div class="wrap page"><div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center">${segHTML('hf',[['h',L('सार्वजनिक बिदा','Public holidays')],['hp',L('+ आंशिक बिदा','+ Partial')],['all',L('सबै चाडपर्व','All festivals')]],f,L('फिल्टर','Filter'))}<span style="flex:1"></span>${y>BS0?A('/holidays/'+(y-1),IC.left+N(y-1),'class="btn"'):''}${y<BS1?A('/holidays/'+(y+1),N(y+1)+IC.right,'class="btn"'):''}<button class="btn primary" data-act="ics-hol" data-y="${y}">${IC.download}${L('क्यालेन्डरमा थप्नुहोस् (.ics)','Add to calendar (.ics)')}</button></div>
     <section class="card"><div class="scroll-x"><table class="tbl"><thead><tr><th>${L('वि.सं.','BS')}</th><th>${L('ई.सं.','AD')}</th><th>${L('बार','Day')}</th><th>${L('चाडपर्व / बिदा','Festival / holiday')}</th><th class="r">${L('बाँकी','In')}</th></tr></thead><tbody>${rows}</tbody></table></div></section></div>`;
}
function viewRashifal(){
  const T=todayDn(),t=tithiAt(T),me=S.profile.rashi;
  return pageHead([[L('गृहपृष्ठ','Home'),'/'],[L('राशिफल','Rashifal'),null]],L('आजको राशि संकेत','Today’s signs'),L(`${fmtBs(T)}: चन्द्रमा ${RASHI[0][t.mr]} राशि र ${NAK[0][t.nak]} नक्षत्रमा। तलका संकेत परम्परागत चन्द्र गोचर (जन्म राशिबाट चन्द्रमाको घर) मा आधारित छन्; मनोरञ्जन र परम्पराका लागि मात्र।`,`${fmtBs(T)}: the Moon is in ${RASHI[1][t.mr]} and ${NAK[1][t.nak]}. Signals follow traditional Moon transit (the Moon’s house from your birth sign), for tradition and fun only.`))
   +`<div class="wrap page"><div class="rcards">${li(RASHI).map((r,i)=>{const g=gocharOf(i,t.mr),h=(t.mr-i+12)%12;return `<article class="card rcard${i===me?' me':''}" id="r${i}"><div class="top"><span class="g" aria-hidden="true">${RGLYPH[i]}</span><div><h2>${r}${i===me?` <span class="badge" style="background:var(--accent-soft);color:var(--accent-text)">${L('तपाईं','You')}</span>`:''}</h2><div class="syl">${SYL.slice(i*9,i*9+9).join(', ')}</div></div></div>
      <div><span class="pill ${g[0]}">${li(GLAB[g[0]])}</span> <span class="hint">${L(`चन्द्रमा ${ORD[h]} घरमा`,`Moon in the ${ORDEN[h]} house`)}</span></div><p>${esc(li([g[1],g[2]]))}</p>

      ${me<0?`<div class="empty" style="margin-top:18px">${L('आफ्नो राशि थाहा छैन?','Don’t know your sign?')} ${A('/tools/janma',L('जन्म मितिबाट पत्ता लगाउनुहोस्','Find it from your birth date'))}</div>`:''}</div>`;

function viewTools(){
  const cur=V.tool&&tool(V.tool)&&!tool(V.tool).ext?tool(V.tool):null;
