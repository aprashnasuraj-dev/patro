# nginx snippet for aafnaipatro.com — include inside your existing `server { }`.
# Serves the generated pages from /var/www/aafnai-places (the build/ output).
#
# If your site already uses /festivals/ etc., build with --path-root /explore
# and replace the location regex below with:  location ^~ /explore/ { ... }
#                                     and:  location ^~ /ne/explore/ { ... }

set $places_root /var/www/aafnai-places;

# 301s for years the build no longer produces (regenerated by every build)
include /var/www/aafnai-places/redirects-places.conf;

# HTML pages: English and Nepali. These paths are not used by the existing
# site (/date, /calendar, /tools, /convert, /rashifal stay untouched).
location ~ ^/(ne/)?(places|festivals|mountains|treks|kati|janma|shraddha)(/|$) {
    root $places_root;
    try_files $uri $uri/index.html =404;
    charset utf-8;
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    add_header X-Content-Type-Options nosniff;
}

# Social cards, static assets and fonts: long cache (file names change per build)
location ^~ /og/ {
    root $places_root;
    add_header Cache-Control "public, max-age=604800";
}
location ^~ /static/places/ {
    root $places_root;
    add_header Cache-Control "public, max-age=2592000, immutable";
    location ~* \.woff2$ { add_header Access-Control-Allow-Origin "*"; add_header Cache-Control "public, max-age=31536000, immutable"; }
}

# JSON for the Aafnai Patro app / backend (own path, so the site's /api is untouched)
location ^~ /places-data/ {
    root $places_root;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    add_header Access-Control-Allow-Origin "*";
}

# Sitemaps (add "Sitemap: https://www.aafnaipatro.com/sitemap-places.xml" to robots.txt)
location = /sitemap-places.xml { root $places_root; default_type application/xml; }
location ^~ /sitemaps/         { root $places_root; default_type application/xml; }

gzip on;
gzip_types text/html text/css application/javascript application/json application/xml image/svg+xml;
