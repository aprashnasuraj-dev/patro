# Rebuild every day just after midnight Nepal time, so "days to go",
# today's panchang and upcoming-festival lists stay current, then deploy.
#
# Required repository secrets:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY (SSH private key), DEPLOY_PATH (e.g. /var/www/aafnai-places)
name: rebuild-places
on:
  schedule:
    - cron: "20 18 * * *"      # 00:05 NPT (UTC+05:45)
  push:
    branches: [main]
    paths: ["data/**", "engine/**", "generator/**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y libraqm0
      - run: pip install -r requirements.txt
      - name: Check festival dates against official calendars
        run: python tests/test_dates.py
      - name: Check unit conversions
        run: python tests/test_units.py
      - name: Restore previous social cards (they only change when data changes)
        uses: actions/cache@v4
        with:
          path: build/og
          key: og-${{ hashFiles('data/**', 'generator/images.py') }}
      - name: Build
        run: python -m generator.build --workers 4   # current BS year to 2100
      - name: Check build
        run: python tests/check_build.py build
      - name: Deploy
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null ~/.ssh_key && echo "$KEY" > ~/.ssh_key
          rsync -az --delete -e "ssh -i ~/.ssh_key -o StrictHostKeyChecking=accept-new" \
            build/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"
