# Trek routes with overnight stops (seed set). Altitudes are commonly cited
# values; coordinates approximate. Straight-line distances between stops are
# computed, not trail distances — pages label them as such.

treks:
  - id: everest-base-camp
    name_en: Everest Base Camp Trek
    name_ne: सगरमाथा आधार शिविर पदयात्रा
    region: Khumbu
    district: Solukhumbu
    district_ne: सोलुखुम्बु
    permits_en: Sagarmatha National Park entry permit and the Khumbu Pasang Lhamu rural municipality permit.
    permits_ne: सगरमाथा राष्ट्रिय निकुञ्ज प्रवेश अनुमति र खुम्बु पासाङल्हामु गाउँपालिका अनुमति।
    best_months: [3, 4, 5, 10, 11]
    about_en: The classic walk from Lukla to the foot of the Khumbu Icefall, through Sherpa villages and monasteries, with two acclimatisation days built in at Namche and Dingboche.
    about_ne: लुक्लादेखि खुम्बु आइसफलको फेदसम्मको प्रसिद्ध पदयात्रा, शेर्पा गाउँ र गुम्बा हुँदै, नाम्चे र डिङबोचेमा उचाइमा अभ्यस्त हुन दुई दिनको विश्राम सहित।
    acclimatise_at: [namche-bazaar, dingboche]
    stops:
      - {id: lukla, name_en: Lukla, name_ne: लुक्ला, alt_m: 2860, lat: 27.6881, lon: 86.7314}
      - {id: phakding, name_en: Phakding, name_ne: फाक्दिङ, alt_m: 2610, lat: 27.7397, lon: 86.7128}
      - {id: namche-bazaar, name_en: Namche Bazaar, name_ne: नाम्चे बजार, alt_m: 3440, lat: 27.8048, lon: 86.7135}
      - {id: tengboche, name_en: Tengboche, name_ne: तेङबोचे, alt_m: 3867, lat: 27.8362, lon: 86.7646}
      - {id: dingboche, name_en: Dingboche, name_ne: डिङबोचे, alt_m: 4410, lat: 27.8925, lon: 86.8311}
      - {id: lobuche, name_en: Lobuche, name_ne: लोबुचे, alt_m: 4940, lat: 27.9483, lon: 86.8103}
      - {id: gorak-shep, name_en: Gorak Shep, name_ne: गोरखशेप, alt_m: 5164, lat: 27.9806, lon: 86.8289}
      - {id: everest-base-camp, name_en: Everest Base Camp, name_ne: सगरमाथा आधार शिविर, alt_m: 5364, lat: 28.0026, lon: 86.8528, sleep: false}
      - {id: kala-patthar, name_en: Kala Patthar, name_ne: काला पत्थर, alt_m: 5644, lat: 27.9958, lon: 86.8286, sleep: false}

  - id: annapurna-circuit
    name_en: Annapurna Circuit Trek
    name_ne: अन्नपूर्ण सर्किट पदयात्रा
    region: Annapurna
    district: Manang / Mustang
    district_ne: मनाङ / मुस्ताङ
    permits_en: Annapurna Conservation Area Permit (ACAP); a trekker registration card may also be required.
    permits_ne: अन्नपूर्ण संरक्षण क्षेत्र प्रवेश अनुमति (एक्याप); पदयात्री दर्ता कार्ड पनि आवश्यक पर्न सक्छ।
    best_months: [3, 4, 5, 10, 11]
    about_en: A loop around the Annapurna massif from the subtropical Marsyangdi valley over the 5,416 m Thorong La pass to Muktinath and the Kali Gandaki.
    about_ne: उपोष्ण मर्स्याङ्दी उपत्यकाबाट ५,४१६ मिटरको थोरोङ ला भञ्ज्याङ पार गरी मुक्तिनाथ र कालीगण्डकीसम्म अन्नपूर्ण हिमशृंखला घेर्ने पदयात्रा।
    acclimatise_at: [manang]
    stops:
      - {id: besisahar, name_en: Besisahar, name_ne: बेसीशहर, alt_m: 760, lat: 28.2307, lon: 84.3787}
      - {id: chame, name_en: Chame, name_ne: चामे, alt_m: 2670, lat: 28.5517, lon: 84.2419}
      - {id: pisang, name_en: Pisang, name_ne: पिसाङ, alt_m: 3200, lat: 28.6104, lon: 84.1567}
      - {id: manang, name_en: Manang, name_ne: मनाङ, alt_m: 3540, lat: 28.6667, lon: 84.0167}
      - {id: yak-kharka, name_en: Yak Kharka, name_ne: याक खर्क, alt_m: 4018, lat: 28.7128, lon: 83.9900}
      - {id: thorong-phedi, name_en: Thorong Phedi, name_ne: थोरोङ फेदी, alt_m: 4450, lat: 28.7631, lon: 83.9603}
      - {id: thorong-la, name_en: Thorong La Pass, name_ne: थोरोङ ला भञ्ज्याङ, alt_m: 5416, lat: 28.7930, lon: 83.9330, sleep: false}
      - {id: muktinath-village, name_en: Muktinath (Ranipauwa), name_ne: मुक्तिनाथ (रानीपौवा), alt_m: 3700, lat: 28.8166, lon: 83.8716}
      - {id: jomsom, name_en: Jomsom, name_ne: जोमसोम, alt_m: 2720, lat: 28.7804, lon: 83.7232}

  - id: annapurna-base-camp-trek
    name_en: Annapurna Base Camp Trek
    name_ne: अन्नपूर्ण आधार शिविर पदयात्रा
    region: Annapurna
    district: Kaski
    district_ne: कास्की
    permits_en: Annapurna Conservation Area Permit (ACAP).
    permits_ne: अन्नपूर्ण संरक्षण क्षेत्र प्रवेश अनुमति (एक्याप)।
    best_months: [3, 4, 5, 10, 11]
    about_en: Up the Modi Khola gorge through Gurung villages and bamboo forest into the Annapurna Sanctuary, a ring of peaks around Annapurna Base Camp.
    about_ne: गुरुङ गाउँ र बाँसको जंगल हुँदै मोदी खोलाको गल्छी उक्लेर अन्नपूर्ण आधार शिविर वरिपरि हिमालले घेरिएको अन्नपूर्ण सेन्चुरीसम्म।
    acclimatise_at: []
    stops:
      - {id: nayapul, name_en: Nayapul, name_ne: नयाँपुल, alt_m: 1070, lat: 28.2389, lon: 83.7983}
      - {id: ghandruk, name_en: Ghandruk, name_ne: घान्द्रुक, alt_m: 1940, lat: 28.3772, lon: 83.8072}
      - {id: chhomrong, name_en: Chhomrong, name_ne: छोमरोङ, alt_m: 2170, lat: 28.4172, lon: 83.8197}
      - {id: bamboo, name_en: Bamboo, name_ne: बाम्बु, alt_m: 2310, lat: 28.4517, lon: 83.8222}
      - {id: deurali, name_en: Deurali, name_ne: देउराली, alt_m: 3230, lat: 28.4911, lon: 83.8411}
      - {id: machhapuchhre-base-camp, name_en: Machhapuchhre Base Camp, name_ne: माछापुच्छ्रे आधार शिविर, alt_m: 3700, lat: 28.5103, lon: 83.8619}
      - {id: annapurna-base-camp, name_en: Annapurna Base Camp, name_ne: अन्नपूर्ण आधार शिविर, alt_m: 4130, lat: 28.5308, lon: 83.8781}

  - id: langtang-valley
    name_en: Langtang Valley Trek
    name_ne: लाङटाङ उपत्यका पदयात्रा
    region: Langtang
    district: Rasuwa
    district_ne: रसुवा
    permits_en: Langtang National Park entry permit.
    permits_ne: लाङटाङ राष्ट्रिय निकुञ्ज प्रवेश अनुमति।
    best_months: [3, 4, 5, 10, 11]
    about_en: The closest high-mountain valley to Kathmandu, following the Langtang Khola to Kyanjin Gompa through Tamang villages rebuilt after the 2015 earthquake.
    about_ne: काठमाडौंको सबैभन्दा नजिकको उच्च हिमाली उपत्यका, सन् २०१५ को भूकम्पपछि पुनर्निर्माण भएका तामाङ गाउँ हुँदै लाङटाङ खोला पछ्याउँदै क्याञ्जिन गुम्बासम्म।
    acclimatise_at: [kyanjin-gompa]
    stops:
      - {id: syabrubesi, name_en: Syabrubesi, name_ne: स्याफ्रुबेंसी, alt_m: 1460, lat: 28.1606, lon: 85.3436}
      - {id: lama-hotel, name_en: Lama Hotel, name_ne: लामा होटल, alt_m: 2470, lat: 28.1694, lon: 85.4361}
      - {id: langtang-village, name_en: Langtang Village, name_ne: लाङटाङ गाउँ, alt_m: 3430, lat: 28.2120, lon: 85.5200}
      - {id: kyanjin-gompa, name_en: Kyanjin Gompa, name_ne: क्याञ्जिन गुम्बा, alt_m: 3870, lat: 28.2108, lon: 85.5636}

  - id: poon-hill-trek
    name_en: Ghorepani Poon Hill Trek
    name_ne: घोरेपानी पुनहिल पदयात्रा
    region: Annapurna
    district: Myagdi / Kaski
    district_ne: म्याग्दी / कास्की
    permits_en: Annapurna Conservation Area Permit (ACAP).
    permits_ne: अन्नपूर्ण संरक्षण क्षेत्र प्रवेश अनुमति (एक्याप)।
    best_months: [2, 3, 4, 10, 11, 12]
    about_en: A short, family-friendly trek through rhododendron forest to Ghorepani, with a pre-dawn climb to Poon Hill for sunrise over Dhaulagiri and Annapurna.
    about_ne: लालीगुराँसको जंगल हुँदै घोरेपानीसम्मको छोटो, परिवारमैत्री पदयात्रा, जहाँ बिहान सबेरै पुनहिल उक्लेर धौलागिरि र अन्नपूर्णमाथिको सूर्योदय हेरिन्छ।
    acclimatise_at: []
    stops:
      - {id: nayapul, name_en: Nayapul, name_ne: नयाँपुल, alt_m: 1070, lat: 28.2389, lon: 83.7983}
      - {id: tikhedhunga, name_en: Tikhedhunga, name_ne: तिखेढुंगा, alt_m: 1540, lat: 28.3222, lon: 83.7489}
      - {id: ulleri, name_en: Ulleri, name_ne: उल्लेरी, alt_m: 2070, lat: 28.3436, lon: 83.7356}
      - {id: ghorepani, name_en: Ghorepani, name_ne: घोरेपानी, alt_m: 2860, lat: 28.4006, lon: 83.7006}
      - {id: poon-hill, name_en: Poon Hill, name_ne: पुनहिल, alt_m: 3210, lat: 28.4003, lon: 83.6900, sleep: false}

  - id: manaslu-circuit
    name_en: Manaslu Circuit Trek
    name_ne: मनास्लु सर्किट पदयात्रा
    region: Manaslu
    district: Gorkha
    district_ne: गोरखा
    permits_en: Manaslu Restricted Area Permit (licensed guide and at least two trekkers required), Manaslu Conservation Area Permit and ACAP.
    permits_ne: मनास्लु प्रतिबन्धित क्षेत्र अनुमति (इजाजतप्राप्त गाइड र कम्तीमा दुई पदयात्री अनिवार्य), मनास्लु संरक्षण क्षेत्र अनुमति र एक्याप।
    best_months: [3, 4, 5, 9, 10, 11]
    about_en: A remote loop around the world's eighth-highest mountain, up the Budhi Gandaki gorge and over the Larkya La pass at about 5,106 m.
    about_ne: बूढीगण्डकीको गल्छी उक्लँदै करिब ५,१०६ मिटरको लार्के ला भञ्ज्याङ पार गरी विश्वको आठौं अग्लो हिमाल घेर्ने दुर्गम पदयात्रा।
    acclimatise_at: [samagaun]
    stops:
      - {id: soti-khola, name_en: Soti Khola, name_ne: सोती खोला, alt_m: 710, lat: 28.2167, lon: 84.8833}
      - {id: machha-khola, name_en: Machha Khola, name_ne: माछाखोला, alt_m: 930, lat: 28.3253, lon: 84.8892}
      - {id: jagat, name_en: Jagat, name_ne: जगत, alt_m: 1340, lat: 28.4083, lon: 84.9000}
      - {id: deng, name_en: Deng, name_ne: देङ, alt_m: 1860, lat: 28.4792, lon: 84.9167}
      - {id: namrung, name_en: Namrung, name_ne: नाम्रुङ, alt_m: 2630, lat: 28.5290, lon: 84.8050}
      - {id: samagaun, name_en: Samagaun, name_ne: सामागाउँ, alt_m: 3530, lat: 28.5810, lon: 84.6390}
      - {id: samdo, name_en: Samdo, name_ne: साम्दो, alt_m: 3860, lat: 28.6440, lon: 84.6230}
      - {id: dharamsala, name_en: Dharamsala (Larkya Phedi), name_ne: धर्मशाला (लार्के फेदी), alt_m: 4460, lat: 28.6730, lon: 84.5750}
      - {id: larkya-la, name_en: Larkya La Pass, name_ne: लार्के ला भञ्ज्याङ, alt_m: 5106, lat: 28.6830, lon: 84.5230, sleep: false}
      - {id: bimthang, name_en: Bimthang, name_ne: बिम्थाङ, alt_m: 3720, lat: 28.6542, lon: 84.4381}
