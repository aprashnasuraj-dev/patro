    tips_en:
      - The final steps above the cable car are at nearly 3,850 m; walk slowly.
      - Roads to Kuri can be blocked by snow in winter.
    tips_ne:
      - केबलकारमाथिका अन्तिम खुड्किला करिब ३,८५० मिटरमा छन्; बिस्तारै हिँड्नुहोस्।
      - जाडोमा कुरीसम्मको सडक हिउँले अवरुद्ध हुन सक्छ।
    festivals:
      - id: maha-ashtami
      - id: janai-purnima

