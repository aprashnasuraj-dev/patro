    about_ne: भक्तपुरको सूर्यविनायक क्षेत्रमा रहेको शिव मन्दिर, जसलाई धेरैले भारतको केदारनाथ लिङ्गको शिर मान्छन्।
    tips_en:
      - Roads to the temple are narrow; use public transport on festival days.
    tips_ne:
      - मन्दिर पुग्ने सडक साँघुरो छ; पर्वका दिन सार्वजनिक यातायात प्रयोग गर्नुहोस्।
    festivals:
      - id: maha-shivaratri

  - id: kalinchowk
