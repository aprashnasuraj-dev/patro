    religion: hindu
    deity_en: Goddess Sita (Janaki)
    deity_ne: देवी सीता (जानकी)
    district: Dhanusha
    district_ne: धनुषा
    province: Madhesh
    lat: 26.7307
    lon: 85.9256
    elev_m: 74
    coord_verified: false
    about_en: A white marble palace-temple built in 1910 in Hindu-Koiri style on the site where Sita is believed to have been born, at the heart of the ancient city of Mithila.
    about_ne: सीताको जन्मस्थल मानिने ठाउँमा सन् १९१० मा हिन्दु-कोइरी शैलीमा बनेको सेतो संगमरमरको दरबार-मन्दिर, प्राचीन मिथिला सहरको मुटुमा।
