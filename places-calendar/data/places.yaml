    name_ne: कश्मिरी तकिया जामे मस्जिद
    kind: mosque
    religion: muslim
    deity_en: Mosque
    deity_ne: मस्जिद
    district: Kathmandu
    district_ne: काठमाडौं
    province: Bagmati
    lat: 27.7066
    lon: 85.3152
    elev_m: 1300
    coord_verified: false
    about_en: One of Kathmandu's oldest mosques, near Ghantaghar and Durbar Marg, and a focal point for Eid prayers in the capital.
    about_ne: घण्टाघर र दरबारमार्गनजिक रहेको काठमाडौंको पुरानो मस्जिदमध्ये एक, र राजधानीमा इदको नमाजको मुख्य केन्द्र।
    tips_en:
      - Dress modestly; women should cover their heads if invited inside.
    tips_ne:
      - शालीन पहिरन लगाउनुहोस्; भित्र निम्तो भएमा महिलाले टाउको ढाक्नुपर्छ।
    festivals:
      - id: eid-al-fitr
        note_en: Eid prayers overflow into the surrounding streets and Ratna Park area in the morning.
        note_ne: बिहानको इदको नमाज वरपरका सडक र रत्नपार्क क्षेत्रसम्म फैलिन्छ।
      - id: eid-al-adha

  - id: shaileshwari
    name_en: Shaileshwari Temple, Doti
    name_ne: शैलेश्वरी मन्दिर, डोटी
    kind: temple
    religion: hindu
    deity_en: Goddess Shaileshwari
    deity_ne: शैलेश्वरी देवी
    district: Doti
    district_ne: डोटी
    province: Sudurpashchim
    lat: 29.2650
    lon: 80.9450
    elev_m: 1300
    coord_verified: false
    about_en: The principal goddess temple of Silgadhi in Doti, at the centre of far-western Nepal's festival life.
    about_ne: डोटीको सिलगढीमा रहेको प्रमुख देवी मन्दिर, सुदूरपश्चिमको चाडपर्वको केन्द्र।
    tips_en:
      - Gaura and Dashain bring deuda dancing circles to the temple grounds.
    tips_ne:
      - गौरा र दशैंमा मन्दिर परिसरमा देउडा खेलिन्छ।
    festivals:
      - id: gaura-parva
        note_en: Women carry the Gaura image and sing deuda songs through the night.
        note_ne: महिलाहरू गौराको मूर्ति बोकी रातभर देउडा गीत गाउँछन्।
      - id: maha-ashtami

  # ------------------------------------------------------------- added: more temples, gumbas, church, gurudwara
  - id: asan-annapurna
    name_en: Annapurna Ajima Temple, Asan
    name_ne: अन्नपूर्ण अजिमा मन्दिर, असन
    kind: temple
    religion: hindu
    deity_en: Goddess Annapurna (Asan Ajima)
    deity_ne: देवी अन्नपूर्ण (असन अजिमा)
    district: Kathmandu
    district_ne: काठमाडौं
    province: Bagmati
    lat: 27.7077
    lon: 85.3116
    elev_m: 1300
    coord_verified: false
    about_en: A three-tiered temple at the heart of Asan, Kathmandu's old market crossroads, dedicated to the goddess of grain and plenty.
    about_ne: काठमाडौंको पुरानो बजार असन चोकको मुटुमा रहेको अन्न र समृद्धिकी देवी अन्नपूर्णको तीनतले मन्दिर।
    tips_en:
      - Asan is a busy wholesale market; mornings before nine are the easiest time to walk through.
    tips_ne:
      - असन व्यस्त थोक बजार हो; बिहान नौ बजेअघि हिँड्न सबैभन्दा सजिलो हुन्छ।
    festivals:
      - id: pahan-charhe
        note_en: Mother goddesses from around the old city are carried here in palanquins and made to meet in the Asan square.
        note_ne: पुरानो सहरका विभिन्न मातृदेवीलाई खटमा राखी यहाँ ल्याइन्छ र असन चोकमा भेट गराइन्छ।
      - id: ghatasthapana
      - id: maha-ashtami

