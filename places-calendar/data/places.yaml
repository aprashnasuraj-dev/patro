    festivals:
      - id: maha-ashtami
        note_en: The temple's peak day of the year, with queues often stretching back along the access road.
        note_ne: वर्षकै सबैभन्दा भीड हुने दिन, लाइन प्रायः पहुँच सडकसम्म लम्बिन्छ।
      - id: maha-navami

