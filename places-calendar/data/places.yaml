    about_ne: नारायणगढको उत्तरमा रहेको पवित्र दोभान, जहाँ धेरै वृद्ध भक्तजन जीवनको अन्तिम समय बिताउँछन्; किनारमा आश्रम र मन्दिर छन्।
    tips_en:
      - A suspension bridge links the Chitwan and Tanahun banks; the mela spreads across both.
    tips_ne:
      - झोलुंगे पुलले चितवन र तनहुँ किनार जोड्छ; मेला दुवैतर्फ फैलिन्छ।
    festivals:
      - id: maghe-sankranti
        note_en: The Maghe Sankranti mela draws tens of thousands for a holy dip at the confluence.
        note_ne: माघे संक्रान्तिको मेलामा दोभानमा स्नान गर्न हजारौं भक्तजन आउँछन्।

  - id: doleshwor
