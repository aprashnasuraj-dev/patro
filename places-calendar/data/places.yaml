    unesco: true
    about_en: The birthplace of Siddhartha Gautama. The Maya Devi Temple marks the marker stone, beside the Ashoka pillar of 249 BCE and the sacred Puskarini pond, at the centre of a monastic zone with temples from many countries.
    about_ne: सिद्धार्थ गौतमको जन्मस्थल। मायादेवी मन्दिरले जन्मस्थलको चिह्न ढुंगा जनाउँछ, छेउमा ईसापूर्व २४९ को अशोक स्तम्भ र पवित्र पुष्करिणी पोखरी छन्, र वरिपरि विभिन्न देशका गुम्बा भएको बौद्ध विहार क्षेत्र छ।
    tips_en:
      - The monastic zone is large; rent a bicycle or e-rickshaw at the gates.
      - From April to June, midday heat often passes 40 °C; visit early morning or late afternoon.
    tips_ne:
      - विहार क्षेत्र ठूलो छ; मूलद्वारमा साइकल वा ई-रिक्सा भाडामा लिन सकिन्छ।
      - वैशाखदेखि असारसम्म दिउँसो ४० डिग्रीभन्दा बढी गर्मी हुने भएकाले बिहान वा बेलुकी घुम्नुहोस्।
    festivals:
      - id: buddha-jayanti
        note_en: Pilgrims and monks from across Asia gather for prayers, processions and peace ceremonies; dignitaries usually attend.
        note_ne: एसियाभरका तीर्थयात्री र भिक्षु प्रार्थना, शोभायात्रा र शान्ति समारोहका लागि भेला हुन्छन्; प्रायः विशिष्ट व्यक्तिहरू सहभागी हुन्छन्।

  - id: janaki-mandir
