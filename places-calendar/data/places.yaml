    religion: buddhist
    deity_en: Tibetan Buddhist monastery (Nyingma)
    deity_ne: तिब्बती बौद्ध गुम्बा (ञिङ्मा)
    district: Solukhumbu
    district_ne: सोलुखुम्बु
    province: Koshi
    lat: 27.8362
    lon: 86.7646
    elev_m: 3867
    coord_verified: false
    about_en: The largest monastery in the Khumbu, on a ridge at about 3,867 m on the Everest Base Camp trail, facing Ama Dablam and Everest.
    about_ne: सगरमाथा आधार शिविर पदमार्गमा करिब ३,८६७ मिटरको डाँडामा रहेको खुम्बुको सबैभन्दा ठूलो गुम्बा, जसको अगाडि अमादब्लम र सगरमाथा देखिन्छन्।
    tips_en:
      - Afternoon prayers can usually be watched quietly from the back of the hall; no photography inside.
      - Most trekkers reach Tengboche from Namche Bazaar in a day.
    tips_ne:
      - दिउँसोको प्रार्थना प्रायः हलको पछाडिबाट चुपचाप हेर्न सकिन्छ; भित्र फोटो खिच्न पाइँदैन।
      - अधिकांश पदयात्री नाम्चे बजारबाट एक दिनमा तेङबोचे पुग्छन्।
    festivals:
      - id: mani-rimdu
        note_en: Masked cham dances fill the courtyard over three days; lodges in Tengboche and Deboche book out.
        note_ne: तीन दिनसम्म आँगनमा मुकुण्डो लगाएर छाम नाच हुन्छ; तेङबोचे र देबोचेका लज भरिन्छन्।
      - id: gyalpo-lhosar
      - id: buddha-jayanti

  - id: namo-buddha
