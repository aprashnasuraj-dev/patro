# Religious sites and jatra venues (seed set). Scale this to thousands with
# tools/osm_import.py. Coordinates marked coord_verified: false are close
# (within a few hundred metres) but should be checked before launch; they
# only affect sunrise/moonrise by seconds.
#
# festivals: festival ids from festivals.yaml that are celebrated *here*,
# each optionally with a place-specific note (en/ne) and crowd override (1-5).

places:
  - id: pashupatinath
    name_en: Pashupatinath Temple
    name_ne: पशुपतिनाथ मन्दिर
    kind: temple
    religion: hindu
    deity_en: Lord Shiva (Pashupati)
    deity_ne: भगवान शिव (पशुपति)
    district: Kathmandu
    district_ne: काठमाडौं
    province: Bagmati
    lat: 27.7105
    lon: 85.3487
    elev_m: 1310
    coord_verified: false
    unesco: true
    about_en: Nepal's most sacred Hindu temple, on the banks of the Bagmati river in eastern Kathmandu. The two-tiered pagoda houses the four-faced Pashupati linga; Arya Ghat beside it is the country's most important cremation site.
    about_ne: काठमाडौंको पूर्वमा बागमती किनारमा रहेको नेपालको सबैभन्दा पवित्र हिन्दु मन्दिर। दुईतले प्यागोडा शैलीको मन्दिरमा चतुर्मुखी पशुपति लिङ्ग छ; छेउको आर्यघाट देशकै प्रमुख दाहसंस्कार स्थल हो।
    tips_en:
      - Only Hindus may enter the main temple courtyard; others can view it from the terraces across the Bagmati.
      - Leather items are not allowed inside the inner premises.
      - On big festival days, police set up separate queues for men and women from well before dawn.
    tips_ne:
      - मुख्य मन्दिर प्राङ्गणमा हिन्दुहरू मात्र प्रवेश गर्न पाउँछन्; अरूले बागमती पारिको डिलबाट हेर्न सक्छन्।
      - भित्री परिसरमा छालाका सामान लैजान पाइँदैन।
      - ठूला पर्वका दिन प्रहरीले बिहानैदेखि महिला र पुरुषका लागि छुट्टाछुट्टै लाइन मिलाउँछ।
    festivals:
      - id: maha-shivaratri
        note_en: Sadhus arrive from across Nepal and India days earlier and camp in the Shleshmantak forest. Expect queues of several hours; the temple stays open through the night.
        note_ne: नेपाल र भारतभरबाट साधुहरू केही दिनअघि नै आई श्लेष्मान्तक वनमा बस्छन्। घण्टौं लामो लाइनको अपेक्षा गर्नुहोस्; मन्दिर रातभर खुला रहन्छ।
      - id: haritalika-teej
        note_en: Women in red queue from midnight; the area around Gaushala becomes a sea of red by morning.
        note_ne: रातो पहिरनमा महिलाहरू मध्यरातदेखि लाइन बस्छन्; बिहानसम्म गौशाला क्षेत्र रातैरातो हुन्छ।
      - id: bala-chaturdashi
        note_en: Families keep vigil with lamps on the night before and scatter satbij along the forest path at dawn.
        note_ne: अघिल्लो रात परिवारहरू बत्ती बालेर जाग्राम बस्छन् र बिहान वनको बाटोमा सतबीज छर्छन्।
      - id: janai-purnima
      - id: kartik-purnima

  - id: guhyeshwari
    name_en: Guhyeshwari Temple
    name_ne: गुह्येश्वरी मन्दिर
    kind: temple
    religion: hindu
    deity_en: Goddess Guhyeshwari (Shakti peeth)
    deity_ne: देवी गुह्येश्वरी (शक्तिपीठ)
    district: Kathmandu
    district_ne: काठमाडौं
    province: Bagmati
    lat: 27.7112
    lon: 85.3535
    elev_m: 1310
    coord_verified: false
    about_en: One of the most important Shakti peeths, a short walk upstream from Pashupatinath along the Bagmati.
    about_ne: पशुपतिनाथबाट बागमती किनारै केही माथि रहेको प्रमुख शक्तिपीठमध्ये एक।
    tips_en:
      - Combine with Pashupatinath; the riverside path between them takes about ten minutes.
    tips_ne:
      - पशुपतिनाथसँगै दर्शन गर्न सकिन्छ; दुईबीचको किनारको बाटो करिब दस मिनेटको छ।
    festivals:
      - id: ghatasthapana
      - id: maha-ashtami
      - id: maha-navami

  - id: boudhanath
    name_en: Boudhanath Stupa
    name_ne: बौद्धनाथ स्तूप
    kind: stupa
    religion: buddhist
    deity_en: Buddhist stupa
    deity_ne: बौद्ध स्तूप
    district: Kathmandu
    district_ne: काठमाडौं
    province: Bagmati
    lat: 27.7215
    lon: 85.3620
    elev_m: 1310
    coord_verified: false
    unesco: true
    about_en: One of the largest spherical stupas in the world and the heart of Tibetan Buddhist life in Kathmandu, ringed by monasteries, butter-lamp shops and cafés.
    about_ne: विश्वकै ठूला गोलाकार स्तूपमध्ये एक र काठमाडौंमा तिब्बती बौद्ध जीवनको केन्द्र, जसको वरिपरि गुम्बा, दियो पसल र क्याफे छन्।
    tips_en:
      - Walk around the stupa clockwise (kora).
      - Rooftop cafés on the circuit give the best view of evening lamp offerings.
    tips_ne:
      - स्तूपको परिक्रमा घडीको सुईको दिशामा गर्नुहोस्।
      - परिक्रमा मार्गका छतका क्याफेबाट साँझको दियो चढाउने दृश्य राम्रो देखिन्छ।
    festivals:
      - id: gyalpo-lhosar
        note_en: Families in traditional dress circle the stupa from early morning; flags are changed and tsampa is thrown in the air.
        note_ne: बिहानैदेखि परम्परागत पहिरनमा परिवारहरू स्तूप परिक्रमा गर्छन्; ध्वजा फेरिन्छ र साम्पा उडाइन्छ।
      - id: sonam-lhosar
      - id: buddha-jayanti

  - id: swayambhunath
    name_en: Swayambhunath Stupa
    name_ne: स्वयम्भूनाथ स्तूप
    kind: stupa
    religion: buddhist
    deity_en: Buddhist stupa (also revered by Hindus)
    deity_ne: बौद्ध स्तूप (हिन्दुहरूले पनि पुज्ने)
    district: Kathmandu
    district_ne: काठमाडौं
    province: Bagmati
    lat: 27.7149
    lon: 85.2904
    elev_m: 1420
    coord_verified: false
    unesco: true
    about_en: The hilltop stupa west of Kathmandu, known for the Buddha's eyes painted on its tower and the monkeys on its 365 stone steps.
    about_ne: काठमाडौंको पश्चिम डाँडामा रहेको स्तूप, जसको गजुरमा कोरिएका बुद्धका आँखा र ३६५ ढुंगे खुड्किलामा बस्ने बाँदरका लागि प्रसिद्ध छ।
    tips_en:
      - The eastern stairway is steep; the western entrance has a road almost to the top.
      - Keep food out of sight — the monkeys are quick.
    tips_ne:
      - पूर्वतर्फको भर्‍याङ ठाडो छ; पश्चिमी प्रवेशद्वारसम्म गाडीको बाटो छ।
      - खानेकुरा लुकाएर राख्नुहोस् — बाँदर छिटो खोस्छन्।
    festivals:
      - id: buddha-jayanti
        note_en: Butter lamps are lit through the night before and the hill is crowded from dawn.
        note_ne: अघिल्लो राति दियो बालिन्छ र बिहानैदेखि डाँडामा भीड लाग्छ।
      - id: shree-panchami
        note_en: The Saraswati shrine near the top of the hill draws students and parents for children's first letters.
        note_ne: डाँडाको टुप्पोनजिकको सरस्वती स्थानमा अक्षरारम्भका लागि विद्यार्थी र अभिभावक आउँछन्।
      - id: sonam-lhosar

  - id: kathmandu-durbar-square
    name_en: Kathmandu Durbar Square (Hanuman Dhoka)
    name_ne: काठमाडौं दरबार क्षेत्र (हनुमानढोका)
    kind: square
    religion: hindu
    deity_en: Taleju Bhawani, Kumari, Kal Bhairav
    deity_ne: तलेजु भवानी, कुमारी, काल भैरव
    district: Kathmandu
    district_ne: काठमाडौं
    province: Bagmati
    lat: 27.7042
    lon: 85.3067
    elev_m: 1300
    coord_verified: false
    unesco: true
    about_en: The old royal palace square of Kathmandu, home of the Kumari Ghar, Taleju temple and Kal Bhairav, and the stage for Indra Jatra.
    about_ne: काठमाडौंको पुरानो राजदरबार क्षेत्र, जहाँ कुमारी घर, तलेजु मन्दिर र काल भैरव छन्, र इन्द्रजात्राको मुख्य थलो हो।
    tips_en:
      - Foreign visitors pay an entry fee at the ticket booths on the approach roads.
      - For Indra Jatra, temple steps around the square fill hours before the chariot procession.
    tips_ne:
      - विदेशी आगन्तुकले प्रवेशमार्गका टिकट काउन्टरमा शुल्क तिर्नुपर्छ।
      - इन्द्रजात्रामा रथ यात्राभन्दा घण्टौं अघि नै वरिपरिका मन्दिरका खुड्किला भरिन्छन्।
    festivals:
      - id: indra-jatra
        note_en: The Kumari, Ganesh and Bhairav chariots set off from the Kumari Ghar in the afternoon; the Head of State traditionally receives tika from the Kumari.
        note_ne: कुमारी, गणेश र भैरवका रथ दिउँसो कुमारी घरबाट निस्कन्छन्; परम्पराअनुसार राष्ट्रप्रमुखले कुमारीबाट टीका ग्रहण गर्छन्।
      - id: fulpati
        note_en: The Fulpati procession arrives at Hanuman Dhoka from Jamal with an army salute.
        note_ne: फूलपातीको शोभायात्रा जमलबाट सेनाको सलामीसहित हनुमानढोका आइपुग्छ।
      - id: maha-navami
        note_en: Taleju Bhawani temple opens to the public on this one day; the queue stretches across the square.
        note_ne: तलेजु भवानी मन्दिर यही एक दिन आम दर्शनका लागि खुल्छ; लाइन दरबार क्षेत्रभर फैलिन्छ।
      - id: holi-hill
        note_en: The chir pole is raised in Basantapur a week before Fagu Purnima; the square is the centre of colour play on the day.
        note_ne: फागु पूर्णिमाको एक हप्ताअघि बसन्तपुरमा चीर ठड्याइन्छ; पर्वको दिन रंग खेल्ने मुख्य थलो यही हो।

  - id: patan-durbar-square
    name_en: Patan Durbar Square and Krishna Mandir
    name_ne: पाटन दरबार क्षेत्र र कृष्ण मन्दिर
    kind: square
    religion: hindu
    deity_en: Lord Krishna, Taleju
    deity_ne: भगवान कृष्ण, तलेजु
    district: Lalitpur
    district_ne: ललितपुर
    province: Bagmati
    lat: 27.6727
    lon: 85.3253
    elev_m: 1300
    coord_verified: false
    unesco: true
    about_en: The royal square of Lalitpur with its stone shikhara Krishna Mandir, built in the 17th century, and the Patan Museum.
    about_ne: ललितपुरको दरबार क्षेत्र, जहाँ सत्रौं शताब्दीमा बनेको ढुंगाको शिखर शैलीको कृष्ण मन्दिर र पाटन संग्रहालय छन्।
    tips_en:
      - On Janmashtami the square stays open all night; arrive before 9 pm for a place near the temple.
    tips_ne:
      - जन्माष्टमीमा दरबार क्षेत्र रातभर खुला रहन्छ; मन्दिरनजिक ठाउँ पाउन राति ९ बजेअघि पुग्नुहोस्।
    festivals:
      - id: krishna-janmashtami
        note_en: Devotees sing bhajans through the night and light lamps on the temple's stone steps.
        note_ne: भक्तजन रातभर भजन गाउँछन् र मन्दिरका ढुंगे खुड्किलामा दियो बाल्छन्।
      - id: rato-machhindranath-start

  - id: kumbheshwar
    name_en: Kumbheshwar Temple
    name_ne: कुम्भेश्वर मन्दिर
    kind: temple
    religion: hindu
    deity_en: Lord Shiva
    deity_ne: भगवान शिव
    district: Lalitpur
    district_ne: ललितपुर
    province: Bagmati
    lat: 27.6766
    lon: 85.3245
    elev_m: 1300
    coord_verified: false
    about_en: A five-tiered pagoda in northern Patan whose ponds are believed to be fed by the sacred Gosaikunda lake.
    about_ne: पाटनको उत्तरमा रहेको पाँचतले प्यागोडा मन्दिर, जसका कुण्डमा गोसाइँकुण्डको पानी आउने विश्वास गरिन्छ।
    tips_en:
      - On Janai Purnima, a silver and gold linga is placed in the pond and devotees bathe around it.
    tips_ne:
      - जनै पूर्णिमामा कुण्डमा चाँदी र सुनको लिङ्ग राखिन्छ र भक्तजन त्यसैको वरिपरि स्नान गर्छन्।
    festivals:
      - id: janai-purnima
        note_en: Jhankri (shamans) dance around the pond through the day.
        note_ne: दिनभर कुण्ड वरिपरि झाँक्रीहरू नाच्छन्।

  - id: bhaktapur-durbar-square
    name_en: Bhaktapur Durbar Square and Taumadhi
    name_ne: भक्तपुर दरबार क्षेत्र र टौमढी
    kind: square
    religion: hindu
    deity_en: Bhairav, Bhadrakali, Nyatapola
    deity_ne: भैरव, भद्रकाली, न्यातपोल
    district: Bhaktapur
    district_ne: भक्तपुर
    province: Bagmati
    lat: 27.6722
    lon: 85.4280
    elev_m: 1401
    coord_verified: false
    unesco: true
    about_en: The best-preserved medieval city square in the Kathmandu Valley, with the five-storey Nyatapola temple at Taumadhi.
    about_ne: काठमाडौं उपत्यकाको सबैभन्दा राम्ररी संरक्षित मध्यकालीन सहर, जहाँ टौमढीमा पाँचतले न्यातपोल मन्दिर छ।
    tips_en:
      - The chariot tug-of-war in Taumadhi is boisterous; watch from a temple plinth or a rooftop café.
      - Try juju dhau (king curd) from the shops around the square.
    tips_ne:
      - टौमढीमा रथ तानातान निकै उत्साहजनक हुन्छ; मन्दिरको डबली वा छतको क्याफेबाट हेर्नुहोस्।
      - वरिपरिका पसलमा जुजु धौ चाख्न नबिर्सनुहोस्।
    festivals:
      - id: bisket-jatra
        note_en: The lingo pole is raised at Yoshin Khel on the last day of Chaitra and pulled down on Baisakh 1, marking the new year.
        note_ne: चैतको अन्तिम दिन योसिंखेलमा लिंगो ठड्याइन्छ र वैशाख १ गते ढालिन्छ, जसले नयाँ वर्षको सुरुआत जनाउँछ।
      - id: gai-jatra
        note_en: Bhaktapur's Gai Jatra lasts several days with stick dances and tall bamboo taha-macha.
        note_ne: भक्तपुरको गाईजात्रा लाठे नाच र अग्लो बाँसको ताहामचासहित धेरै दिन चल्छ।
      - id: nepali-new-year

  - id: changu-narayan
    name_en: Changu Narayan Temple
    name_ne: चाँगुनारायण मन्दिर
    kind: temple
    religion: hindu
    deity_en: Lord Vishnu (Narayan)
    deity_ne: भगवान विष्णु (नारायण)
    district: Bhaktapur
    district_ne: भक्तपुर
    province: Bagmati
    lat: 27.7163
    lon: 85.4278
    elev_m: 1541
    coord_verified: false
    unesco: true
    about_en: Considered the oldest temple in the Kathmandu Valley, on a ridge north of Bhaktapur, with a Lichhavi-era stone inscription and fine woodcarving.
    about_ne: भक्तपुरको उत्तर डाँडामा रहेको काठमाडौं उपत्यकाकै सबैभन्दा पुरानो मानिने मन्दिर, जहाँ लिच्छविकालीन शिलालेख र उत्कृष्ट काष्ठकला छ।
    tips_en:
      - A pleasant walk connects Changu Narayan with Nagarkot or Telkot.
    tips_ne:
      - चाँगुनारायणबाट नगरकोट वा तेलकोटसम्म रमाइलो पैदल बाटो छ।
    festivals:
      - id: haribodhini-ekadashi
      - id: harishayani-ekadashi

  - id: budhanilkantha
    name_en: Budhanilkantha Temple
    name_ne: बूढानीलकण्ठ मन्दिर
    kind: temple
    religion: hindu
    deity_en: Lord Vishnu reclining on the serpent Shesh
    deity_ne: शेषनागमाथि शयन गरेका भगवान विष्णु
    district: Kathmandu
    district_ne: काठमाडौं
    province: Bagmati
    lat: 27.7783
    lon: 85.3626
    elev_m: 1450
    coord_verified: false
    about_en: A five-metre stone statue of Vishnu reclining in a pool of water at the foot of Shivapuri hill in north Kathmandu.
    about_ne: उत्तर काठमाडौंको शिवपुरी डाँडाको फेदमा पानीको कुण्डमा शयन गरेका विष्णुको पाँच मिटर लामो ढुंगे मूर्ति।
    tips_en:
      - Only Hindus may enter the inner enclosure; the statue is visible from the railing outside.
    tips_ne:
      - भित्री घेरामा हिन्दु मात्र प्रवेश गर्न पाउँछन्; मूर्ति बाहिरको रेलिङबाट देखिन्छ।
    festivals:
      - id: haribodhini-ekadashi
        note_en: The temple's biggest day, when Vishnu is believed to wake; a large fair surrounds the temple.
        note_ne: विष्णु जाग्ने विश्वास गरिएको मन्दिरको सबैभन्दा ठूलो दिन; मन्दिर वरिपरि ठूलो मेला लाग्छ।
      - id: harishayani-ekadashi

  - id: dakshinkali
    name_en: Dakshinkali Temple
    name_ne: दक्षिणकाली मन्दिर
    kind: temple
    religion: hindu
    deity_en: Goddess Kali
    deity_ne: देवी काली
    district: Kathmandu
    district_ne: काठमाडौं
    province: Bagmati
    lat: 27.6005
    lon: 85.2627
    elev_m: 1400
    coord_verified: false
