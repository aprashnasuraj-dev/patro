    about_ne: कोका र कोशी नदीको दोभानमा रहेको प्राचीन तीर्थस्थल, जहाँ विष्णुको वराह अवतारको पूजा गरिन्छ।
    tips_en:
      - Large melas fill the riverbank; nearby lodging books up early.
    tips_ne:
      - नदी किनारभरि ठूलो मेला लाग्छ; नजिकका होटल चाँडै भरिन्छन्।
    festivals:
      - id: kartik-purnima
        note_en: One of the largest fairs in eastern Nepal is held on the riverbank.
        note_ne: पूर्वी नेपालकै ठूलो मेलामध्ये एक नदी किनारमा लाग्छ।
      - id: maghe-sankranti

  - id: devghat
    name_en: Devghat Dham
    name_ne: देवघाट धाम
    kind: confluence
    religion: hindu
    deity_en: Confluence of the Kali Gandaki and Trishuli
    deity_ne: कालीगण्डकी र त्रिशूलीको दोभान
    district: Tanahun
