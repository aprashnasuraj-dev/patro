    deity_ne: भगवान विष्णु (मुक्तिनाथ); बौद्धहरूका लागि छुमिग ग्यात्सा
    district: Mustang
    district_ne: मुस्ताङ
    province: Gandaki
    lat: 28.8166
    lon: 83.8716
    elev_m: 3710
    coord_verified: false
    about_en: A high-altitude pilgrimage site below Thorong La, sacred to both Hindus and Buddhists, with 108 water spouts and an eternal natural gas flame.
    about_ne: थोरोङ लाको फेदमा रहेको उच्च हिमाली तीर्थस्थल, हिन्दु र बौद्ध दुवैका लागि पवित्र, जहाँ १०८ धारा र प्राकृतिक ग्याँसको अखण्ड ज्योति छ।
    tips_en:
      - At over 3,700 m, take altitude seriously — ascend gradually from Jomsom and drink plenty of water.
      - Bathing under all 108 spouts is bracingly cold; carry a change of clothes.
      - Mornings are calmest; strong winds usually pick up in the Kali Gandaki valley after noon.
    tips_ne:
      - ३,७०० मिटरभन्दा माथि भएकाले उचाइ रोगप्रति सजग रहनुहोस् — जोमसोमबाट बिस्तारै उक्लनुहोस् र प्रशस्त पानी पिउनुहोस्।
      - १०८ धारामा स्नान गर्दा निकै चिसो हुन्छ; फेर्ने लुगा लैजानुहोस्।
      - बिहान शान्त हुन्छ; कालीगण्डकी उपत्यकामा दिउँसोपछि प्रायः हुरी चल्छ।
    festivals:
      - id: janai-purnima
      - id: maha-shivaratri

