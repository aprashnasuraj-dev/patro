    about_en: A hilltop stupa and the Thrangu Tashi Yangtse monastery south-east of Dhulikhel, linked to the Jataka story of a prince who offered himself to a starving tigress.
    about_ne: धुलिखेलको दक्षिण-पूर्व डाँडामा रहेको स्तूप र थ्रांगु ताशी याङ्त्से गुम्बा, जसलाई भोकाएकी बाघिनीलाई आफूलाई अर्पण गर्ने राजकुमारको जातक कथासँग जोडिन्छ।
    tips_en:
      - A popular day hike links Dhulikhel and Namo Buddha through farming villages.
    tips_ne:
      - धुलिखेलदेखि नमोबुद्धसम्म खेतीपाती भएका गाउँ हुँदै लोकप्रिय दिने पैदल यात्रा गर्न सकिन्छ।
    festivals:
      - id: buddha-jayanti
      - id: gyalpo-lhosar

  - id: jame-masjid-kathmandu
