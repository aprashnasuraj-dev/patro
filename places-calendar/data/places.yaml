      - मिथिला कलाका पसल र जनकपुर महिला कला केन्द्र अवश्य हेर्नुहोस्।
    festivals:
      - id: vivah-panchami
        note_en: Week-long celebrations re-enact the wedding of Ram and Sita, with a grand barat procession from Ram Mandir to Janaki Mandir on the day.
        note_ne: हप्ता दिनसम्म राम-सीता विवाहको पुनर्मञ्चन गरिन्छ, पर्वको दिन राम मन्दिरबाट जानकी मन्दिरसम्म भव्य बारात निस्कन्छ।
      - id: ram-navami
      - id: chhath
        note_en: Janakpur's many ponds (sagar), including Gangasagar and Dhanushsagar, fill with devotees for the sunset and sunrise arghya.
        note_ne: गंगासागर, धनुषसागर लगायत जनकपुरका सागरहरू सूर्यास्त र सूर्योदयको अर्घ्यका लागि भक्तजनले भरिन्छन्।
      - id: holi-terai

  - id: ram-mandir-janakpur
    name_en: Ram Mandir, Janakpur
    name_ne: राम मन्दिर, जनकपुर
    kind: temple
    religion: hindu
    deity_en: Lord Ram
    deity_ne: भगवान राम
    district: Dhanusha
    district_ne: धनुषा
    province: Madhesh
    lat: 26.7290
    lon: 85.9240
    elev_m: 74
    coord_verified: false
    about_en: A pagoda-style temple of Lord Ram near Janaki Mandir, the starting point of the Vivah Panchami wedding procession.
    about_ne: जानकी मन्दिरनजिकको प्यागोडा शैलीको राम मन्दिर, जहाँबाट विवाह पञ्चमीको बारात सुरु हुन्छ।
    tips_en:
      - Walk between Ram Mandir and Janaki Mandir through the old bazaar.
    tips_ne:
      - पुरानो बजार हुँदै राम मन्दिरदेखि जानकी मन्दिरसम्म पैदल घुम्नुहोस्।
    festivals:
      - id: ram-navami
        note_en: The main celebrations of Ram's birth take place here at midday.
        note_ne: रामजन्मको मुख्य उत्सव यहाँ मध्याह्नमा हुन्छ।
      - id: vivah-panchami

  - id: gosaikunda
    name_en: Gosaikunda Lake
    name_ne: गोसाइँकुण्ड
    kind: lake
    religion: hindu
    deity_en: Sacred lake of Lord Shiva
    deity_ne: भगवान शिवको पवित्र कुण्ड
    district: Rasuwa
    district_ne: रसुवा
    province: Bagmati
    lat: 28.0820
    lon: 85.4150
    elev_m: 4380
    coord_verified: false
    about_en: An alpine lake at about 4,380 m in Langtang National Park, believed to have been created by Shiva's trident. Thousands make the pilgrimage on Janai Purnima.
    about_ne: लाङटाङ राष्ट्रिय निकुञ्जमा करिब ४,३८० मिटर उचाइमा रहेको हिमताल, जुन शिवको त्रिशूलले बनेको विश्वास गरिन्छ। जनै पूर्णिमामा हजारौं तीर्थयात्री पुग्छन्।
    tips_en:
      - The usual route climbs from Dhunche via Sing Gompa in two days; rushing it risks altitude sickness.
      - Janai Purnima falls in the monsoon — expect rain, leeches lower down, and slippery trails.
      - Carry warm layers; nights near the lake are cold even in August.
    tips_ne:
      - सामान्य बाटो धुन्चेबाट सिङगुम्बा हुँदै दुई दिनमा उक्लन्छ; हतार गर्दा लेक लाग्ने जोखिम हुन्छ।
      - जनै पूर्णिमा वर्षामा पर्ने भएकाले पानी, तल जुका र चिप्लो बाटोको अपेक्षा गर्नुहोस्।
      - न्यानो लुगा लैजानुहोस्; साउनमा पनि कुण्डनजिक राति चिसो हुन्छ।
    festivals:
      - id: janai-purnima
        note_en: Pilgrims and jhankris walk up for days to bathe in the lake at dawn on the full moon.
        note_ne: पूर्णिमाको बिहान कुण्डमा स्नान गर्न तीर्थयात्री र झाँक्रीहरू दिनौं हिँडेर पुग्छन्।

  - id: pathibhara
    name_en: Pathibhara Devi Temple
    name_ne: पाथीभरा देवी मन्दिर
    kind: temple
    religion: hindu
    deity_en: Goddess Pathibhara
    deity_ne: पाथीभरा देवी
    district: Taplejung
    district_ne: ताप्लेजुङ
    province: Koshi
    lat: 27.4270
    lon: 87.7660
    elev_m: 3794
    coord_verified: false
    about_en: A ridge-top shrine at about 3,794 m in Taplejung, eastern Nepal's most visited pilgrimage site, with views of Kanchenjunga on clear days.
    about_ne: ताप्लेजुङमा करिब ३,७९४ मिटर उचाइको डाँडामा रहेको पूर्वी नेपालको सबैभन्दा धेरै भक्तजन पुग्ने तीर्थस्थल, सफा दिनमा कञ्चनजंघा देखिन्छ।
    tips_en:
      - The trail from Kafle Bhanjyang is steep; start before dawn to reach the top while the sky is clear.
      - Snow can cover the final section from December to February.
    tips_ne:
      - काफ्ले भन्ज्याङबाटको बाटो ठाडो छ; आकाश सफा हुँदै टुप्पो पुग्न बिहान सबेरै हिँड्नुहोस्।
      - पुसदेखि फागुनसम्म अन्तिम खण्डमा हिउँ पर्न सक्छ।
    festivals:
      - id: maha-navami
      - id: buddha-jayanti

  - id: halesi
    name_en: Halesi Mahadev (Maratika Cave)
    name_ne: हलेसी महादेव (मारातिका गुफा)
    kind: cave
    religion: hindu
    deity_en: Lord Shiva; sacred to Buddhists as Maratika
    deity_ne: भगवान शिव; बौद्धहरूका लागि मारातिका
    district: Khotang
    district_ne: खोटाङ
    province: Koshi
    lat: 27.1976
    lon: 86.6200
    elev_m: 1400
    coord_verified: false
    about_en: A natural limestone cave in Khotang, revered by Hindus as a Shiva shrine and by Buddhists as the cave where Padmasambhava attained longevity.
    about_ne: खोटाङको प्राकृतिक चुनढुंगे गुफा, जसलाई हिन्दुहरू शिवस्थलका रूपमा र बौद्धहरू पद्मसम्भवले दीर्घायु सिद्धि प्राप्त गरेको गुफाका रूपमा पुज्छन्।
    tips_en:
      - Bring a torch for the inner chambers; floors can be wet.
    tips_ne:
      - भित्री गुफाका लागि टर्च लैजानुहोस्; भुइँ चिप्लो हुन सक्छ।
    festivals:
      - id: maha-shivaratri
        note_en: The cave's biggest gathering of the year, with pilgrims from across eastern Nepal and India.
        note_ne: पूर्वी नेपाल र भारतभरबाट तीर्थयात्री आउने गुफाको वर्षकै ठूलो जमघट।
      - id: bala-chaturdashi

  - id: barahachhetra
    name_en: Barahachhetra
    name_ne: बराहक्षेत्र
    kind: temple
    religion: hindu
    deity_en: Lord Vishnu as Varaha
    deity_ne: वराह अवतारका भगवान विष्णु
