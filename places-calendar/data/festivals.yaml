# Festival rules. Dates are COMPUTED from these rules for every BS year.
# month  = purnimanta lunar month (Nepal convention)
# paksha = shukla | krishna ; tithi = 1..15 within the paksha (15 = Purnima / Aunsi)
# kaal   = sunrise | nishita | pradosh | aparahna | madhyahna  (see engine/festivals.py)
# Published official dates can be pinned in overrides.yaml.

festivals:
  # ---------------------------------------------------------------- Dashain
  - id: ghatasthapana
    name_en: Ghatasthapana
    name_ne: घटस्थापना
    type: lunar
    month: Asoj
    paksha: shukla
    tithi: 1
    kaal: sunrise
    group: dashain
    holiday: true
    category: hindu
    crowd: 3
    summary_en: First day of Dashain. The kalash is installed and jamara (barley) is sown in a dark puja room, to be offered as blessing on Vijaya Dashami.
    summary_ne: दशैंको पहिलो दिन। कलश स्थापना गरी अँध्यारो पूजा कोठामा जमरा राखिन्छ, जुन विजया दशमीमा प्रसादका रूपमा लगाइन्छ।

  - id: fulpati
    name_en: Fulpati
    name_ne: फूलपाती
    type: lunar
    month: Asoj
    paksha: shukla
    tithi: 7
    kaal: madhyahna
    group: dashain
    holiday: true
    category: hindu
    crowd: 4
    summary_en: The seventh day of Dashain, when sacred leaves and flowers are carried in procession to Hanuman Dhoka in Kathmandu.
    summary_ne: दशैंको सातौं दिन, जब पवित्र फूल र पातहरू शोभायात्रासहित काठमाडौंको हनुमानढोका पुर्‍याइन्छ।

  - id: maha-ashtami
    name_en: Maha Ashtami
    name_ne: महाअष्टमी
    type: lunar
    month: Asoj
    paksha: shukla
    tithi: 8
    kaal: madhyahna
    group: dashain
    holiday: true
    category: hindu
    crowd: 5
    summary_en: The eighth day of Dashain, dedicated to the fierce forms of Durga. Shakti peeths such as Dakshinkali and Guhyeshwari see their biggest crowds of the year.
    summary_ne: दशैंको आठौं दिन, देवी दुर्गाका उग्र रूपको पूजा गरिन्छ। दक्षिणकाली, गुह्येश्वरीजस्ता शक्तिपीठमा वर्षकै ठूलो भीड लाग्छ।

  - id: maha-navami
    name_en: Maha Navami
    name_ne: महानवमी
    type: lunar
    month: Asoj
    paksha: shukla
    tithi: 9
    kaal: madhyahna
    group: dashain
    holiday: true
    category: hindu
    crowd: 5
    summary_en: The ninth day of Dashain. Taleju Bhawani temple in Kathmandu opens to the public on this one day of the year, and vehicles and tools receive puja.
    summary_ne: दशैंको नवौं दिन। काठमाडौंको तलेजु भवानी मन्दिर वर्षमा यही एक दिन आम दर्शनका लागि खुल्छ र सवारी साधन तथा औजारको पूजा गरिन्छ।

  - id: vijaya-dashami
    name_en: Vijaya Dashami
    name_ne: विजया दशमी
    type: lunar
    month: Asoj
    paksha: shukla
    tithi: 10
    kaal: madhyahna
    group: dashain
    holiday: true
    category: hindu
    crowd: 4
    summary_en: The main day of Dashain, when elders give tika and jamara with blessings. Tika continues until Kojagrat Purnima.
    summary_ne: दशैंको मुख्य दिन, जब ठूलाबडाबाट टीका, जमरा र आशीर्वाद ग्रहण गरिन्छ। टीका कोजाग्रत पूर्णिमासम्म लगाइन्छ।

  - id: kojagrat-purnima
    name_en: Kojagrat Purnima
    name_ne: कोजाग्रत पूर्णिमा
    type: lunar
    month: Asoj
    paksha: shukla
    tithi: 15
    kaal: sunrise
    group: dashain
    holiday: false
    category: hindu
    crowd: 2
    summary_en: The full moon that closes Dashain. Devotees stay awake at night worshipping Laxmi.
    summary_ne: दशैं समापन गर्ने पूर्णिमा। भक्तजन रातभर जाग्राम बसी लक्ष्मीको पूजा गर्छन्।

  # ---------------------------------------------------------------- Tihar
  - id: kag-tihar
    name_en: Kag Tihar
    name_ne: काग तिहार
    type: lunar
    month: Kartik
    paksha: krishna
    tithi: 13
    kaal: sunrise
    group: tihar
    holiday: false
    category: hindu
    crowd: 2
    summary_en: First day of Tihar, when crows are fed as messengers of Yama.
    summary_ne: तिहारको पहिलो दिन, यमराजका दूत मानिने कागलाई खाना दिइन्छ।

  - id: kukur-tihar
    name_en: Kukur Tihar
    name_ne: कुकुर तिहार
    type: lunar
    month: Kartik
    paksha: krishna
    tithi: 14
    kaal: sunrise
    group: tihar
    holiday: false
    category: hindu
    crowd: 2
    summary_en: Second day of Tihar, honouring dogs with garlands, tika and food.
    summary_ne: तिहारको दोस्रो दिन, कुकुरलाई माला, टीका र मीठो खाना दिई सम्मान गरिन्छ।

  - id: laxmi-puja
    name_en: Laxmi Puja
    name_ne: लक्ष्मी पूजा
    type: lunar
    month: Kartik
    paksha: krishna
    tithi: 15
    kaal: pradosh
    group: tihar
    holiday: true
    category: hindu
    crowd: 3
    summary_en: The night of lights. Cows are worshipped in the morning; in the evening homes are lit with diyo and Laxmi is worshipped during Pradosh kaal.
    summary_ne: बत्तीको रात। बिहान गाईको पूजा गरिन्छ र साँझ प्रदोष कालमा घर उज्यालो पारी लक्ष्मीको पूजा गरिन्छ।

  - id: govardhan-puja
    name_en: Govardhan Puja / Mha Puja
    name_ne: गोवर्धन पूजा / म्हपूजा
    type: lunar
    month: Kartik
    paksha: shukla
    tithi: 1
    kaal: sunrise
    group: tihar
    holiday: true
    category: hindu
    crowd: 2
    summary_en: Govardhan Puja and Goru Tihar; the Newar community performs Mha Puja (worship of the self) and celebrates Nepal Sambat New Year.
    summary_ne: गोवर्धन पूजा र गोरु तिहार; नेवार समुदायले म्हपूजा गरी नेपाल संवत् नयाँ वर्ष मनाउँछ।

  - id: bhai-tika
    name_en: Bhai Tika
    name_ne: भाइटीका
    type: lunar
    month: Kartik
    paksha: shukla
    tithi: 2
    kaal: sunrise
    group: tihar
    holiday: true
    category: hindu
    crowd: 3
    summary_en: Sisters give brothers seven-coloured tika and a garland of makhamali flowers and pray for their long life. Rani Pokhari's temple opens on this day.
    summary_ne: दिदीबहिनीले दाजुभाइलाई सप्तरंगी टीका र मखमली माला लगाई दीर्घायुको कामना गर्छन्। रानीपोखरीको मन्दिर यही दिन खुल्छ।

  # ---------------------------------------------------------------- Shiva / Vishnu
  - id: maha-shivaratri
    name_en: Maha Shivaratri
    name_ne: महाशिवरात्रि
    type: lunar
    month: Falgun
    paksha: krishna
    tithi: 14
    kaal: nishita
    holiday: true
    category: hindu
    crowd: 5
    summary_en: The great night of Shiva. Pashupatinath receives hundreds of thousands of devotees and sadhus from Nepal and India; worship peaks at Nishita kaal around midnight.
    summary_ne: भगवान शिवको महान रात। पशुपतिनाथमा नेपाल र भारतबाट लाखौं भक्तजन तथा साधु आउँछन्; पूजा मध्यरातको निशीथ कालमा चरम हुन्छ।

  - id: bala-chaturdashi
    name_en: Bala Chaturdashi
    name_ne: बालाचतुर्दशी
    type: lunar
    month: Mangsir
    paksha: krishna
    tithi: 14
    kaal: sunrise
    holiday: false
    category: hindu
    crowd: 4
    summary_en: Devotees keep an all-night vigil at Pashupatinath and at dawn scatter satbij (seven grains) in the Shleshmantak forest in memory of departed family members.
    summary_ne: पशुपतिनाथमा रातभर बत्ती बाली जाग्राम बसिन्छ र बिहान दिवंगत परिवारजनको सम्झनामा श्लेष्मान्तक वनमा सतबीज छरिन्छ।

  - id: haribodhini-ekadashi
    name_en: Haribodhini Ekadashi
    name_ne: हरिबोधिनी एकादशी
    type: lunar
    month: Kartik
    paksha: shukla
    tithi: 11
    kaal: sunrise
    holiday: false
    category: hindu
    crowd: 4
    summary_en: Lord Vishnu wakes from his four-month sleep. Budhanilkantha and other Narayan temples hold their largest gatherings.
    summary_ne: भगवान विष्णु चार महिनाको शयनबाट उठ्ने दिन। बूढानीलकण्ठ लगायत नारायण मन्दिरमा ठूलो भीड लाग्छ।

  - id: harishayani-ekadashi
    name_en: Harishayani Ekadashi
    name_ne: हरिशयनी एकादशी
    type: lunar
    month: Asar
    paksha: shukla
    tithi: 11
    kaal: sunrise
    holiday: false
    category: hindu
    crowd: 3
    summary_en: Lord Vishnu goes to sleep for four months (Chaturmas). Rice planting season is in full swing.
    summary_ne: भगवान विष्णु चार महिना (चतुर्मास) शयनमा जाने दिन। यतिबेला धान रोपाइँ जोडतोडले चलिरहेको हुन्छ।

  - id: krishna-janmashtami
    name_en: Krishna Janmashtami
    name_ne: कृष्ण जन्माष्टमी
    type: lunar
    month: Bhadra
    paksha: krishna
    tithi: 8
    kaal: nishita
    holiday: true
    category: hindu
    crowd: 5
    summary_en: The birth of Lord Krishna, celebrated at midnight. Krishna Mandir in Patan Durbar Square draws devotees through the night.
    summary_ne: भगवान कृष्णको जन्मोत्सव, मध्यरातमा मनाइन्छ। पाटन दरबार क्षेत्रको कृष्ण मन्दिरमा रातभर भक्तजनको घुइँचो लाग्छ।

  - id: ram-navami
    name_en: Ram Navami
    name_ne: राम नवमी
    type: lunar
    month: Chaitra
    paksha: shukla
    tithi: 9
    kaal: madhyahna
    holiday: true
    category: hindu
    crowd: 4
    summary_en: Birth of Lord Ram, celebrated at midday. Janakpur's Ram Mandir and Janaki Mandir hold the biggest celebrations.
    summary_ne: भगवान रामको जन्मोत्सव, मध्याह्नमा मनाइन्छ। जनकपुरको राम मन्दिर र जानकी मन्दिरमा सबैभन्दा ठूलो उत्सव हुन्छ।

  - id: vivah-panchami
    name_en: Vivah Panchami
    name_ne: विवाह पञ्चमी
    type: lunar
    month: Mangsir
    paksha: shukla
    tithi: 5
    kaal: sunrise
    holiday: false
    category: hindu
    crowd: 5
    summary_en: The wedding anniversary of Ram and Sita, re-enacted at Janaki Mandir in Janakpur with a week of processions.
    summary_ne: राम र सीताको विवाह वार्षिकोत्सव, जनकपुरको जानकी मन्दिरमा हप्ता दिनसम्म शोभायात्रासहित मनाइन्छ।

  # ---------------------------------------------------------------- Women / family
  - id: haritalika-teej
    name_en: Haritalika Teej
    name_ne: हरितालिका तीज
    type: lunar
    month: Bhadra
    paksha: shukla
    tithi: 3
    kaal: sunrise
    holiday: true
    category: hindu
    crowd: 5
    summary_en: Women fast, dress in red and dance and sing. Pashupatinath sees long queues from before dawn.
    summary_ne: महिलाहरू व्रत बसी रातो पहिरनमा नाचगान गर्छन्। पशुपतिनाथमा बिहानैदेखि लामो लाइन लाग्छ।

  - id: rishi-panchami
    name_en: Rishi Panchami
    name_ne: ऋषि पञ्चमी
    type: lunar
    month: Bhadra
    paksha: shukla
    tithi: 5
    kaal: sunrise
    holiday: false
    category: hindu
    crowd: 3
    summary_en: The last day of the Teej festival; women bathe in rivers and honour the seven sages.
    summary_ne: तीज पर्वको अन्तिम दिन; महिलाहरू नदीमा स्नान गरी सप्तऋषिको पूजा गर्छन्।

  - id: gaura-parva
    name_en: Gaura Parva
    name_ne: गौरा पर्व
    type: lunar_solar
    bs_month: 5
    paksha: shukla
    tithi: 8
    kaal: sunrise
    holiday: false
    category: hindu
    crowd: 3
    summary_en: The festival of Gauri and Mahadev in far-western Nepal, with deuda songs and dances; a public holiday in Sudurpashchim.
    summary_ne: सुदूरपश्चिममा देउडा गीत र नाचसहित मनाइने गौरा र महादेवको पर्व; सुदूरपश्चिम प्रदेशमा सार्वजनिक बिदा।

  - id: kushe-aunsi
    name_en: Kushe Aunsi (Father's Day)
    name_ne: कुशे औंसी (बुबाको मुख हेर्ने दिन)
    type: lunar
    month: Bhadra
    paksha: krishna
    tithi: 15
    kaal: sunrise
    holiday: false
    category: hindu
    crowd: 4
    summary_en: Children honour their fathers; those whose fathers have died go to Gokarneshwor to perform shraddha.
    summary_ne: सन्तानले बुबाको मुख हेरी सम्मान गर्छन्; बुबा बितिसकेकाहरू गोकर्णेश्वर गई श्राद्ध गर्छन्।

  - id: mata-tirtha-aunsi
    name_en: Mata Tirtha Aunsi (Mother's Day)
    name_ne: मातातीर्थ औंसी (आमाको मुख हेर्ने दिन)
    type: lunar
    month: Baisakh
    paksha: krishna
    tithi: 15
    kaal: sunrise
    holiday: false
    category: hindu
    crowd: 4
    summary_en: Children honour their mothers; those whose mothers have died bathe at Mata Tirtha in Kathmandu.
    summary_ne: सन्तानले आमाको मुख हेरी सम्मान गर्छन्; आमा बितिसकेकाहरू काठमाडौंको मातातीर्थमा स्नान गर्छन्।

  - id: janai-purnima
    name_en: Janai Purnima / Raksha Bandhan
    name_ne: जनै पूर्णिमा / रक्षाबन्धन
    type: lunar
    month: Shrawan
    paksha: shukla
    tithi: 15
    kaal: sunrise
    holiday: true
    category: hindu
    crowd: 5
    summary_en: The sacred thread (janai) is changed and protective doro is tied. Pilgrims climb to Gosaikunda lake and gather at Kumbheshwar in Patan.
    summary_ne: जनै फेरिन्छ र रक्षाबन्धनको डोरो बाँधिन्छ। तीर्थयात्री गोसाइँकुण्ड चढ्छन् र पाटनको कुम्भेश्वरमा भेला हुन्छन्।

  - id: nag-panchami
    name_en: Nag Panchami
    name_ne: नागपञ्चमी
    type: lunar
    month: Shrawan
    paksha: shukla
    tithi: 5
    kaal: sunrise
    holiday: false
    category: hindu
    crowd: 2
    summary_en: Pictures of the serpent deities are pasted above doorways and nag puja is performed for protection and rain.
    summary_ne: घरका ढोकामाथि नागको चित्र टाँसी सुरक्षा र वर्षाका लागि नागपूजा गरिन्छ।

  - id: chhath
    name_en: Chhath Parva
    name_ne: छठ पर्व
    type: lunar
    month: Kartik
    paksha: shukla
    tithi: 6
    kaal: sunrise
    grace_min: 20   # reproduces the Samiti's dates for 2080 and 2082
    window: sunset  # pages show the evening arghya window
    span_days: 2
    holiday: true
    category: hindu
    crowd: 5
    summary_en: Devotees stand in rivers and ponds to offer arghya to the setting sun on Shashthi and the rising sun the next morning.
    summary_ne: षष्ठीको साँझ अस्ताउँदो सूर्य र भोलिपल्ट बिहान उदाउँदो सूर्यलाई नदी र पोखरीमा उभिएर अर्घ्य दिइन्छ।

  - id: holi-hill
    name_en: Fagu Purnima (Holi, hills)
    name_ne: फागु पूर्णिमा (होली, पहाड)
    type: lunar
    month: Falgun
    paksha: shukla
    tithi: 15
    kaal: pradosh
    holiday: true
    category: hindu
    crowd: 4
    summary_en: The festival of colours in Kathmandu and the hill districts. Basantapur and Kathmandu Durbar Square host the largest celebration.
    summary_ne: काठमाडौं र पहाडी जिल्लामा रंगको पर्व। बसन्तपुर र काठमाडौं दरबार क्षेत्रमा सबैभन्दा ठूलो उत्सव हुन्छ।

  - id: holi-terai
    name_en: Holi (Terai)
    name_ne: होली (तराई)
    type: relative
    base: holi-hill
    offset_days: 1
    holiday: true
    category: hindu
    crowd: 4
    summary_en: Holi in the Terai districts falls one day after the hills.
    summary_ne: तराईका जिल्लामा होली पहाडभन्दा एक दिनपछि मनाइन्छ।

  - id: shree-panchami
    name_en: Basanta Panchami / Saraswati Puja
    name_ne: श्रीपञ्चमी / सरस्वती पूजा
    type: lunar
    month: Magh
    paksha: shukla
    tithi: 5
    kaal: sunrise
    holiday: false
    category: hindu
    crowd: 4
    summary_en: Worship of Saraswati, goddess of learning. Children begin learning their letters; Saraswati shrines at Swayambhu and Neel Saraswati are crowded.
    summary_ne: विद्याकी देवी सरस्वतीको पूजा। बालबालिकाले अक्षरारम्भ गर्छन्; स्वयम्भू र नील सरस्वतीमा भीड लाग्छ।

  # ---------------------------------------------------------------- Buddhist
  - id: buddha-jayanti
    name_en: Buddha Jayanti
    name_ne: बुद्ध जयन्ती
    type: lunar
    month: Baisakh
    paksha: shukla
    tithi: 15
    kaal: sunrise
    holiday: true
    category: buddhist
    crowd: 4
    summary_en: The birth, enlightenment and passing of Gautama Buddha, marked at Lumbini, his birthplace, and at Swayambhu and Boudha stupas.
    summary_ne: गौतम बुद्धको जन्म, बुद्धत्व प्राप्ति र महापरिनिर्वाणको दिन; उनको जन्मस्थल लुम्बिनी तथा स्वयम्भू र बौद्ध स्तूपमा मनाइन्छ।

  - id: sonam-lhosar
    name_en: Sonam Lhosar
    name_ne: सोनाम ल्होसार
    type: lunar
    month: Magh
    paksha: shukla
    tithi: 1
    kaal: sunrise
    holiday: true
    category: buddhist
    crowd: 3
    summary_en: New Year of the Tamang community. Boudha and Swayambhu fill with traditional dress, dance and music.
