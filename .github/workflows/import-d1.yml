name: Repair D1 from R2 and refresh calendar fallback

on:
  workflow_dispatch:
    inputs:
      r2_bucket:
        description: "R2 bucket containing the full SQL backup (optional when CF_R2_BUCKET_NAME variable/secret exists)"
        required: false
        type: string
      sql_key:
        description: "Exact R2 SQL object key (optional only when CF_R2_SQL_KEY variable/secret exists)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-calendar-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
      CF_R2_BUCKET_NAME: ${{ inputs.r2_bucket || vars.CF_R2_BUCKET_NAME || secrets.CF_R2_BUCKET_NAME }}
      CF_R2_SQL_KEY: ${{ inputs.sql_key || vars.CF_R2_SQL_KEY || secrets.CF_R2_SQL_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate Cloudflare credentials and configured R2 backup
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CF_R2_BUCKET_NAME" || (echo "Set CF_R2_BUCKET_NAME to the R2 bucket that contains the SQL backup." && exit 1)
          test -n "$CF_R2_SQL_KEY" || (echo "Set CF_R2_SQL_KEY to the exact object key of the uploaded SQL backup." && exit 1)
      - name: Verify, repair from configured R2 SQL if needed, refresh R2 JSON, deploy
        run: node scripts/bootstrap-cloudflare.mjs
