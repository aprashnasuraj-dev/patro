name: Repair and verify production Cloudflare D1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-d1.yml"
      - "migration/data/public/**"
      - "cloudflare/d1/**"
      - "scripts/ensure-d1-content.mjs"
      - "scripts/generate-d1-migrations.mjs"
      - "wrangler.jsonc"

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-import
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout canonical repository data
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical idempotent D1 snapshot
        run: npm run cloudflare:generate-d1

      - name: Apply production D1 schema migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Repair missing or partial canonical public data
        run: node scripts/ensure-d1-content.mjs wrangler.jsonc

      - name: Verify exact production D1 parity
        run: node scripts/verify-d1-remote.mjs wrangler.jsonc
