name: Explore pages to R2

# Manual only: builds every enabled explore family and syncs it to R2 under explore/v1/ in the ARCHIVE bucket.
# Touches nothing else in the bucket and never deploys the Worker.
on:
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Allow the total page count to drop by more than 20% (deletes pages)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: explore-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.git || secrets.GIT || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME || secrets.CF_R2_BUCKET_NAME }}
      CF_CACHE_AUTO_PROVISION: '0'
      # Optional dedicated R2 S3 keys. When absent, S3 credentials are derived from CLOUDFLARE_API_TOKEN
      # (Cloudflare: access key id = token id, secret = SHA-256 of the token value), so no new secret is needed.
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PREFIX: explore/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Explore contract tests
        run: npm run test:explore

      - name: Resolve ARCHIVE R2 bucket
        run: |
          set -uo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then echo '::error::Cloudflare credentials are required.'; exit 1; fi
          if ! out="$(node scripts/prepare-cloudflare-config.mjs 2>&1)"; then
            echo "$out" | grep -E "Error|error|at file" | head -6 | while IFS= read -r line; do echo "::error::config: ${line}"; done
            exit 1
          fi
          echo "$out"
          bucket="$(node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.generated.jsonc','utf8'));const r=(c.r2_buckets||[]).find(x=>x.binding==='ARCHIVE');process.stdout.write(r&&r.bucket_name||'')")"
          if [[ -z "${bucket}" ]]; then
            echo "::error::ARCHIVE R2 bucket could not be resolved. Config output: $(echo "$out" | tr '\n' ' ')"; exit 1
          fi
          echo "${bucket}" > /tmp/r2-bucket
          echo "::notice::ARCHIVE bucket=${bucket}"

      - name: Build pages and sitemaps
        run: npm run explore:build -- --out .cloudflare/explore

      - name: Shrink guard
        run: |
          set -euo pipefail
          bucket="$(cat /tmp/r2-bucket)"
          if npx wrangler r2 object get "${bucket}/${PREFIX}/manifest.json" --file /tmp/prev-manifest.json --remote >/dev/null 2>&1; then
            prev="$(node -p "require('/tmp/prev-manifest.json').totals.pages")"
          else
            prev=0
          fi
          next="$(node -p "require('./.cloudflare/explore/manifest.json').totals.pages")"
          echo "Previous pages: ${prev}; new pages: ${next}"
          echo "PREV_PAGES=${prev}" >> "$GITHUB_ENV"
          if [[ "${prev}" -gt 0 && $(( next * 100 )) -lt $(( prev * 80 )) && "${{ inputs.allow_shrink }}" != "true" ]]; then
            echo "::error::Page count would drop from ${prev} to ${next} (>20%). Re-run with allow_shrink if intended."
            exit 1
          fi

      - name: Resolve R2 S3 credentials
        run: |
          set -euo pipefail
          if [[ -n "${R2_ACCESS_KEY_ID:-}" && -n "${R2_SECRET_ACCESS_KEY:-}" ]]; then
            key_id="${R2_ACCESS_KEY_ID}"; key_secret="${R2_SECRET_ACCESS_KEY}"
          else
            auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            key_id="$(curl -fsS "${auth[@]}" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.result.id // empty' || true)"
            if [[ -z "${key_id}" ]]; then
              key_id="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" | jq -r '.result.id // empty' || true)"
            fi
            key_secret="$(printf '%s' "${CLOUDFLARE_API_TOKEN}" | sha256sum | cut -d' ' -f1)"
          fi
          if [[ -z "${key_id}" ]]; then echo "::warning::Could not resolve S3 credentials; falling back to Wrangler uploads."; exit 0; fi
          echo "::add-mask::${key_id}"; echo "::add-mask::${key_secret}"
          { echo "S3_KEY_ID=${key_id}"; echo "S3_KEY_SECRET=${key_secret}"; } >> "$GITHUB_ENV"

      - name: Upload with rclone (S3 API, incremental)
        if: env.S3_KEY_ID != ''
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ env.S3_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ env.S3_KEY_SECRET }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          bucket="$(cat /tmp/r2-bucket)"
          if [[ "${{ inputs.allow_shrink }}" == "true" ]]; then max_delete=-1; else max_delete=$(( PREV_PAGES / 5 + 100 )); fi
          # Only unchanged-checksum files are skipped; only paths under explore/v1/ are ever written or deleted.
          rclone sync .cloudflare/explore/pages "r2:${bucket}/${PREFIX}/pages" --checksum --fast-list --transfers 64 --checkers 64 \
            --max-delete "${max_delete}" --header-upload "Content-Type: application/json; charset=utf-8" --stats 60s --stats-one-line
          rclone sync .cloudflare/explore/sitemaps "r2:${bucket}/${PREFIX}/sitemaps" --checksum --transfers 16 \
            --header-upload "Content-Type: application/xml; charset=utf-8"
          rclone copyto .cloudflare/explore/manifest.json "r2:${bucket}/${PREFIX}/manifest.json" --header-upload "Content-Type: application/json"

      - name: Upload with Wrangler (fallback when S3 credentials are unavailable)
        if: env.S3_KEY_ID == ''
        run: |
          set -euo pipefail
          bucket="$(cat /tmp/r2-bucket)"
          cd .cloudflare/explore
          count="$(find pages sitemaps -type f | wc -l)"
          if [[ "${count}" -gt 5000 ]]; then
            echo "::error::${count} objects is too many for Wrangler uploads, and S3 credentials could not be derived from CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          export bucket PREFIX
          put() {
            local file="$1" type="application/json"
            [[ "$file" == *.xml ]] && type="application/xml"
            for attempt in 1 2 3; do
              npx wrangler r2 object put "${bucket}/${PREFIX}/${file}" --file "$file" --content-type "$type" --remote --force >/dev/null 2>&1 && return 0
              sleep $(( attempt * 3 ))
            done
            echo "::error::Upload failed: ${file}"; return 1
          }
          export -f put
          find pages sitemaps -type f -print0 | xargs -0 -n 1 -P 8 bash -c 'put "$0"'
          put manifest.json
          echo "Uploaded ${count} objects with Wrangler (pages removed from the build are not deleted on this path)."

      - name: Summary
        if: always()
        run: |
          if [[ -f .cloudflare/explore/report.json ]]; then
            { echo '### Explore build'; echo '```json'; cat .cloudflare/explore/report.json; echo '```';
              echo 'Submit https://aafnaipatro.com/sitemap-explore.xml in Google Search Console and Bing Webmaster Tools.'; } >> "$GITHUB_STEP_SUMMARY"
          fi
