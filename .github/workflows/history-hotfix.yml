name: History Hotfix Deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/history-hotfix.yml

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy packaged history fallback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Build product and packaged history archive
        run: |
          set -euo pipefail
          npm run build
          test -s dist/data/on-this-day/manifest.json
          test -s dist/data/on-this-day/month-01.json
          test -s dist/data/on-this-day/month-12.json
      - name: Deploy without D1 data import
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID || secrets.CF_KV_NAMESPACE_ID }}
          CF_KV_PREVIEW_NAMESPACE_ID: ${{ vars.CF_KV_PREVIEW_NAMESPACE_ID || secrets.CF_KV_PREVIEW_NAMESPACE_ID }}
          CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME || secrets.CF_R2_BUCKET_NAME }}
          CF_R2_PREVIEW_BUCKET_NAME: ${{ vars.CF_R2_PREVIEW_BUCKET_NAME || secrets.CF_R2_PREVIEW_BUCKET_NAME }}
          CF_CACHE_AUTO_PROVISION: "0"
          PUBLIC_REFERENCE_CACHE_VERSION: public-reference-v1
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare deployment credentials are missing."
            exit 1
          fi
          node scripts/prepare-cloudflare-config.mjs
          npx wrangler deploy --config wrangler.generated.jsonc
      - name: Verify live On This Day response
        shell: bash
        run: |
          set -euo pipefail
          date_value="$(TZ=Asia/Kathmandu date +%F)"
          out="$(mktemp)"
          headers="$(mktemp)"
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS -D "$headers" -o "$out" "https://aafnaipatro.com/api/v1/on-this-day?date=${date_value}&rev=history-static-hotfix-v1"
          node --input-type=module "$out" "$date_value" <<'NODE'
          import { readFileSync } from "node:fs";
          const [file,date]=process.argv.slice(2);
          const body=JSON.parse(readFileSync(file,"utf8"));
          if(body?.ok!==true||body?.date!==date||!Array.isArray(body?.items)){
            throw new Error(`Invalid live history payload: ${JSON.stringify(body).slice(0,300)}`);
          }
          console.log(JSON.stringify({ok:true,date,count:body.count,source:body.source}));
          NODE
          grep -iE '^(x-patro-backend|x-patro-cache):' "$headers" || true
