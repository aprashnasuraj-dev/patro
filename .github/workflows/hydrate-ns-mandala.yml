name: Hydrate Nepal Sambat mandala
on:
  push:
    branches: [feat/community-suites-b-nepal-lhosar-tharu]
    paths: ['.github/workflows/hydrate-ns-mandala.yml']
permissions:
  contents: write
jobs:
  hydrate:
    if: "!contains(github.event.head_commit.message || '', '[ns-mandala-hydrated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/community-suites-b-nepal-lhosar-tharu }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - shell: bash
        env:
          SHARE_URL: https://firestorage.ai/ja/f/FYlFhgXG9N_x
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1 >/dev/null
          npx playwright install chromium >/dev/null
          cat >/tmp/get.cjs <<'NODE'
          const {chromium}=require('playwright'),fs=require('fs'),path=require('path');
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({acceptDownloads:true});const p=await c.newPage();await p.goto(process.env.SHARE_URL,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(3000);const name='nepal-sambat-suite (1).zip';const t=p.getByText(name,{exact:false}).first();await t.waitFor({state:'visible',timeout:30000});let a=t.locator('xpath=ancestor-or-self::a[1] | ancestor-or-self::button[1]').first();if(await a.count()===0)a=t;const href=await a.getAttribute('href').catch(()=>null);if(href){const r=await c.request.get(new URL(href,p.url()).toString(),{timeout:60000});if(r.ok()){fs.writeFileSync('/tmp/ns.zip',await r.body());await b.close();return;}}const d=p.waitForEvent('download',{timeout:45000});await a.click();const dl=await d;await dl.saveAs('/tmp/ns.zip');await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/get.cjs
          rm -rf /tmp/ns && mkdir -p /tmp/ns
          unzip -q /tmp/ns.zip -d /tmp/ns
          F="$(find /tmp/ns -type f -path '*/immersive/nepal-sambat-mandala.html' | head -1)"
          test -n "$F"
          cp "$F" community-frontends/nepal-sambat-mandala.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f community-frontends/nepal-sambat-mandala.html
          git commit -m "feat(community): add Nepal Sambat mandala source [ns-mandala-hydrated]"
          git push origin HEAD:feat/community-suites-b-nepal-lhosar-tharu
