name: Remove generated ad placeholders
on:
  push:
    branches: [codex/remove-all-ads-20261109]
    paths: [.github/workflows/codex-remove-ad-placeholders.yml]
permissions:
  contents: write
jobs:
  clean:
    if: github.repository == 'aprashnasuraj-dev/patro' && github.ref == 'refs/heads/codex/remove-all-ads-20261109'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/remove-all-ads-20261109
      - name: Remove placeholders and update generated manifest
        run: node scripts/strip-generated-ad-slots.mjs
      - name: Commit cleaned generated files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/advancetools
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove generated ad placeholders'
          git push origin HEAD:refs/heads/codex/remove-all-ads-20261109
