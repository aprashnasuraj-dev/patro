name: Mission Mangal validation
on:
  pull_request:
    paths:
      - 'missionmangal/**'
      - 'blog-engine/**'
      - '.github/workflows/missionmangal-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate schema and provider registry
        run: |
          node -e "for (const f of ['missionmangal/schema/article.schema.json','missionmangal/config/catalogs.json','missionmangal/config/providers.json','missionmangal/config/adapter-allowlist.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Test 2000 URLs, APA rendering, evidence, sitemap, old Facts isolation
        run: node --test missionmangal/tests/*.test.mjs
      - name: Import all three pinned API catalogs (offline, unverified)
        run: cd blog-engine && python -m engine.catalog_import --output data/api_candidates.json
      - name: Test resumable Python article stages
        run: cd blog-engine && python -m unittest discover -s tests -v
      - name: Confirm incomplete article is blocked
        run: |
          if node missionmangal/scripts/validate-article.mjs missionmangal/examples/article.json; then
            echo 'ERROR: unsupported example passed'; exit 1
          fi
          echo 'PASS: unsupported example blocked'
# No API secrets, scheduling, root build changes, published content or Cloudflare deployment.
