name: Mission Mangal validation
on:
  pull_request:
    paths:
      - 'missionmangal/**'
      - '.github/workflows/missionmangal-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate schema/catalog files
        run: |
          node -e "for (const f of ['missionmangal/schema/article.schema.json','missionmangal/config/catalogs.json','missionmangal/config/providers.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Run evidence tests
        run: node --test missionmangal/tests/*.test.mjs
      - name: Confirm deliberately incomplete sample is blocked
        run: |
          if node missionmangal/scripts/validate-article.mjs missionmangal/examples/article.json; then
            echo 'ERROR: unverified sample passed validation'; exit 1
          fi
          echo 'PASS: unverified sample correctly blocked'
# This workflow does not expose GitHub secrets, call LLMs, publish content, or deploy.
