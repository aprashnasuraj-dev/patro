name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  affected-checks:
    name: Affected PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          printf '%s\n' "$files"

          any=false
          full=false
          ui=false
          tools=false
          community=false
          community_static=false
          cloudflare=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              *.md|docs/*|research/*|CHANGELOG.md|PLAN.md|SHA256SUMS.txt)
                ;;
              *) any=true ;;
            esac

            case "$file" in
              package.json|package-lock.json|tsconfig*.json|vite.config.*|src/main.*|src/App.*|packages/core/*|packages/core/**)
                full=true ;;
            esac

            case "$file" in
              src/*|src/**|public/*|public/**|index.html|vite.config.*|scripts/emit-*|scripts/prerender-*|scripts/generate-seo.mjs|scripts/enhance-seo-discovery.mjs|scripts/verify-seo-build.mjs)
                ui=true ;;
            esac

            case "$file" in
              *tool*|*tools*|tests/core.test.ts|tests/tithi-events.test.ts|tests/sait-baby.test.ts|tests/language.test.ts|tests/bots-letters.test.ts)
                tools=true ;;
            esac

            case "$file" in
              community-frontends/*|community-frontends/**|*samudaya*|*community*|tests/communities.test.ts|tests/nepal-sambat.test.ts)
                community=true ;;
            esac

            case "$file" in
              community-frontends/*|community-frontends/**|scripts/emit-community-suites.mjs|tests/community-migration-contract.test.mjs)
                community_static=true ;;
            esac

            case "$file" in
              worker/*|worker/**|cloudflare/*|cloudflare/**|wrangler.jsonc|scripts/cloudflare/*|scripts/cloudflare/**|scripts/validate-cloudflare.mjs|scripts/prepare-cloudflare-config.mjs|tests/*cloudflare*|tests/*cutover*|tests/*connectivity*)
                cloudflare=true ;;
            esac
          done <<< "$files"

          {
            echo "any=$any"
            echo "full=$full"
            echo "ui=$ui"
            echo "tools=$tools"
            echo "community=$community"
            echo "community_static=$community_static"
            echo "cloudflare=$cloudflare"
          } >> "$GITHUB_OUTPUT"

      - name: Use Node.js 22
        if: steps.changes.outputs.any == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies once
        if: steps.changes.outputs.any == 'true'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Baseline compile and core tests
        if: steps.changes.outputs.any == 'true'
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:core

      - name: UI / product build
        if: steps.changes.outputs.ui == 'true' || steps.changes.outputs.full == 'true' || steps.changes.outputs.cloudflare == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.changes.outputs.cloudflare }}" == "true" || "${{ steps.changes.outputs.full }}" == "true" ]]; then
            # Cloudflare/product contract tests read SEO, intent and prerender artifacts emitted by
            # the canonical build pipeline. A bare `vite build` cannot create those files.
            npm run build
          else
            npx vite build
          fi

      - name: Patro tool tests
        if: steps.changes.outputs.tools == 'true' || steps.changes.outputs.full == 'true'
        run: npm run test:patro-tools

      - name: Community tests
        if: steps.changes.outputs.community == 'true' || steps.changes.outputs.full == 'true'
        run: npm run test:community

      - name: Community standalone frontends
        if: steps.changes.outputs.community_static == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/emit-community-suites.mjs
          node --test tests/community-migration-contract.test.mjs
          required=(
            dist/nepal-sambat/mandala/index.html
            dist/samudaya/lhosar/index.html
            dist/samudaya/tharu/index.html
            dist/samudaya/mithila/index.html
            dist/samudaya/kirat/index.html
            dist/samudaya/hijri/index.html
            dist/samudaya/chakra/index.html
          )
          for file in "${required[@]}"; do test -s "$file"; done

      - name: Cloudflare and product contracts
        if: steps.changes.outputs.cloudflare == 'true' || steps.changes.outputs.full == 'true'
        run: npm run test:cloudflare-contract

      - name: Place, birthday and free-plan regressions
        if: steps.changes.outputs.cloudflare == 'true' || steps.changes.outputs.full == 'true'
        run: |
          set -euo pipefail
          npm run test:place-birthday
          npm run test:birthday-modules
          npm run test:free-plan
          npm run test:growth-pages
          npm run test:growth

      - name: Cross-cutting safety tests
        if: steps.changes.outputs.full == 'true'
        run: |
          set -euo pipefail
          npm run test:typing
          npm run test:release-safety


      - name: Release homepage and canonical browser regression
        if: steps.changes.outputs.ui == 'true' || steps.changes.outputs.full == 'true' || steps.changes.outputs.cloudflare == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps --no-save --no-package-lock playwright@1.56.1 >/dev/null
          npx playwright install chromium >/dev/null
          PATRO_AUDIT_API=1 node scripts/serve-dist.mjs > /tmp/patro-pr-static.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat /tmp/patro-pr-static.log' EXIT
          ready=false
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then echo "::error::Static test server unavailable"; exit 1; fi
          NODE_PATH="$PWD/node_modules" node scripts/check-homepage-release.cjs
          NODE_PATH="$PWD/node_modules" node scripts/check-canonical-tools.cjs

      - name: Documentation-only PR
        if: steps.changes.outputs.any != 'true'
        run: echo "Only documentation/non-runtime files changed; expensive application checks skipped."
