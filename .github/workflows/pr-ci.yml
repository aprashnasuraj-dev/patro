name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  affected-checks:
    name: Affected PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      browser_required: ${{ steps.changes.outputs.ui == 'true' || steps.changes.outputs.full == 'true' || steps.changes.outputs.cloudflare == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          printf '%s\n' "$files"

          any=false
          full=false
          ui=false
          tools=false
          community=false
          community_static=false
          cloudflare=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              *.md|docs/*|research/*|CHANGELOG.md|PLAN.md|SHA256SUMS.txt)
                ;;
              *) any=true ;;
            esac

            case "$file" in
              package.json|package-lock.json|tsconfig*.json|vite.config.*|src/main.*|src/App.*|packages/core/*|packages/core/**)
                full=true ;;
            esac

            case "$file" in
              src/*|src/**|public/*|public/**|index.html|vite.config.*|scripts/emit-*|scripts/prerender-*|scripts/generate-seo.mjs|scripts/enhance-seo-discovery.mjs|scripts/verify-seo-build.mjs|scripts/check-homepage-release.cjs|scripts/check-canonical-tools.cjs|tests/homepage-recovery-contract.test.mjs)
                ui=true ;;
            esac

            case "$file" in
              *tool*|*tools*|tests/core.test.ts|tests/tithi-events.test.ts|tests/sait-baby.test.ts|tests/language.test.ts|tests/bots-letters.test.ts)
                tools=true ;;
            esac

            case "$file" in
              community-frontends/*|community-frontends/**|*samudaya*|*community*|tests/communities.test.ts|tests/nepal-sambat.test.ts)
                community=true ;;
            esac

            case "$file" in
              community-frontends/*|community-frontends/**|scripts/emit-community-suites.mjs|tests/community-migration-contract.test.mjs)
                community_static=true ;;
            esac

            case "$file" in
              worker/*|worker/**|cloudflare/*|cloudflare/**|wrangler.jsonc|scripts/cloudflare/*|scripts/cloudflare/**|scripts/validate-cloudflare.mjs|scripts/prepare-cloudflare-config.mjs|tests/*cloudflare*|tests/*cutover*|tests/*connectivity*)
                cloudflare=true ;;
            esac
          done <<< "$files"

          {
            echo "any=$any"
            echo "full=$full"
            echo "ui=$ui"
            echo "tools=$tools"
            echo "community=$community"
            echo "community_static=$community_static"
            echo "cloudflare=$cloudflare"
          } >> "$GITHUB_OUTPUT"

      - name: Use Node.js 22
        if: steps.changes.outputs.any == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies once
        if: steps.changes.outputs.any == 'true'
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Promotion dependency and tracked-secret security gate
        if: steps.changes.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # This is the same high-severity npm audit enforced at release,
          # now caught before an unsafe PR could be merged.
          npm audit --audit-level=high
          # Protect against accidentally committing provider keys / auth secrets.
          if git grep -nEI '(gsk_[A-Za-z0-9_-]{20,}|nvapi-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,})' -- . ':(exclude).github/workflows/pr-ci.yml' ':(exclude).github/workflows/release-gate.yml'; then
            echo "::error::Potential secret in tracked files"
            exit 1
          fi

      - name: Baseline compile and core tests
        if: steps.changes.outputs.any == 'true'
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:core

      - name: UI / product build
        if: steps.changes.outputs.ui == 'true' || steps.changes.outputs.full == 'true' || steps.changes.outputs.cloudflare == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Release browser/SEO checks run for UI-only changes too. They require the
          # fully prerendered dist output, not a bare Vite shell.
          npm run build

      - name: Pre-promotion feature integrity regressions
        if: steps.changes.outputs.ui == 'true' && steps.changes.outputs.full != 'true' && steps.changes.outputs.cloudflare != 'true'
        run: |
          set -euo pipefail
          npm run test:typing
          npm run test:patro-tools
          npm run test:cloudflare-contract
          npm run test:place-birthday
          npm run test:birthday-modules
          npm run test:free-plan
          npm run test:growth-pages
          npm run test:growth
          npm run test:voice
          npm run test:release-safety

      - name: Patro tool tests
        if: steps.changes.outputs.tools == 'true' || steps.changes.outputs.full == 'true'
        run: npm run test:patro-tools

      - name: Community tests
        if: steps.changes.outputs.community == 'true' || steps.changes.outputs.full == 'true'
        run: npm run test:community

      - name: Community standalone frontends
        if: steps.changes.outputs.community_static == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/emit-community-suites.mjs
          node --test tests/community-migration-contract.test.mjs
          required=(
            dist/nepal-sambat/mandala/index.html
            dist/samudaya/lhosar/index.html
            dist/samudaya/tharu/index.html
            dist/samudaya/mithila/index.html
            dist/samudaya/kirat/index.html
            dist/samudaya/hijri/index.html
            dist/samudaya/chakra/index.html
          )
          for file in "${required[@]}"; do test -s "$file"; done

      - name: Cloudflare and product contracts
        if: steps.changes.outputs.cloudflare == 'true' || steps.changes.outputs.full == 'true'
        run: npm run test:cloudflare-contract

      - name: Place, birthday and free-plan regressions
        if: steps.changes.outputs.cloudflare == 'true' || steps.changes.outputs.full == 'true'
        run: |
          set -euo pipefail
          npm run test:place-birthday
          npm run test:birthday-modules
          npm run test:free-plan
          npm run test:growth-pages
          npm run test:growth

      - name: Cross-cutting safety tests
        if: steps.changes.outputs.full == 'true'
        run: |
          set -euo pipefail
          npm run test:typing
          npm run test:release-safety


      - name: Package validated build for isolated browser checks
        if: steps.changes.outputs.ui == 'true' || steps.changes.outputs.full == 'true' || steps.changes.outputs.cloudflare == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-browser-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Documentation-only PR
        if: steps.changes.outputs.any != 'true'
        run: echo "Only documentation/non-runtime files changed; expensive application checks skipped."

  isolated-browser-checks:
    name: Isolated production browser regressions
    needs: affected-checks
    if: needs.affected-checks.result == 'success' && needs.affected-checks.outputs.browser_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verified PR code
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install Playwright on fresh runner (no rebuild)
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm install --legacy-peer-deps --no-save --no-package-lock playwright@1.56.1 >/dev/null
          npx playwright install chromium
      - name: Download exact CI build artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-browser-dist
          path: dist
      - name: Run release browser tests with isolated memory and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          echo 'CI Chromium preflight:'
          free -h
          cat /sys/fs/cgroup/memory.events 2>/dev/null || true
          PATRO_AUDIT_API=1 node scripts/serve-dist.mjs >/tmp/patro-browser-server.log 2>&1 &
          server=$!
          trap 'status=$?; kill "$server" 2>/dev/null || true; cat /tmp/patro-browser-server.log; free -h; cat /sys/fs/cgroup/memory.events 2>/dev/null || true; exit "$status"' EXIT
          ready=false
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then echo "::error::Static audit server did not start"; exit 1; fi
          node --test tests/homepage-recovery-contract.test.mjs
          NODE_PATH="$PWD/node_modules" node scripts/check-homepage-release.cjs
          NODE_PATH="$PWD/node_modules" node scripts/check-pwa-install-ui.cjs
          NODE_PATH="$PWD/node_modules" node scripts/check-canonical-tools.cjs
          # Measure the same mobile Lighthouse laboratory route on the exact tested
          # production artifact, not a newly rebuilt or redeployed copy.
          # This is diagnostic until 90+ is actually measured; never invent success.
          cat >/tmp/patro-mobile-lhci.json <<'LHCONFIG'
          {"ci":{"collect":{"url":["http://127.0.0.1:4173/"],"numberOfRuns":1}}}
          LHCONFIG
          npx --yes @lhci/cli@0.15.1 collect --config=/tmp/patro-mobile-lhci.json
          node --input-type=module <<'LHSUMMARY'
          import { readdirSync, readFileSync } from "node:fs";
          const files=readdirSync(".lighthouseci").filter(file=>/^lhr-.*\.json$/.test(file));
          if(!files.length)throw new Error("Mobile Lighthouse did not produce LHR JSON");
          const reports=files.map(file=>JSON.parse(readFileSync(".lighthouseci/"+file,"utf8")));
          const score=Math.round(100*reports.reduce((sum,report)=>sum+(report.categories?.performance?.score||0),0)/reports.length);
          const details=["first-contentful-paint","largest-contentful-paint","total-blocking-time","cumulative-layout-shift","speed-index"].map(id=>{const audit=reports[0].audits?.[id];return id+": "+(audit?.displayValue||"not recorded");}).join("; ");
          console.log("MOBILE_LIGHTHOUSE_SCORE="+score+"/100");
          console.log("MOBILE_LIGHTHOUSE_METRICS="+details);
          if(process.env.GITHUB_STEP_SUMMARY){const {appendFileSync}=await import("node:fs");appendFileSync(process.env.GITHUB_STEP_SUMMARY,"Mobile Lighthouse: **"+score+"/100** (goal 90+)\\n\\n"+details+"\\n");}
          if(score<90)console.log("::warning::Measured mobile homepage score "+score+" is below the 90 target; do not claim 90+ or release on this basis.");
          LHSUMMARY
