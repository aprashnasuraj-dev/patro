name: Places-calendar pages to R2

# Builds the places-calendar sections that have their own URL space — /kati, /janma, /shraddha, /mountains,
# /treks (each also under /ne/) — and syncs them to R2 under pc/v1/ in the ARCHIVE bucket, where
# worker/places-calendar.ts serves them. Never touches other R2 keys and never deploys the Worker.
# The generator's /festivals and /places sections are not built: those URLs belong to the main site.
#
# Weekly (ages, countdowns and "next tithi birthday" move forward) and on demand.
on:
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Allow the file count to drop by more than 20% (deletes pages)"
        type: boolean
        default: false
  schedule:
    - cron: "20 18 * * 6"   # Sunday 00:05 NPT

permissions:
  contents: read

concurrency:
  group: places-calendar-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.git || secrets.GIT || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME || secrets.CF_R2_BUCKET_NAME }}
      CF_CACHE_AUTO_PROVISION: '0'
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PREFIX: pc/v1
      SECTIONS: kati,janma,shraddha,mountains,treks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install
        run: |
          pip install -r places-calendar/requirements.txt
          sudo apt-get install -y -q libraqm0 >/dev/null || true
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Accuracy tests
        working-directory: places-calendar
        run: |
          python tests/test_dates.py
          python tests/test_units.py

      - name: Route contract tests
        run: npx vitest run tests/places-calendar-route.test.ts

      - name: Build pages
        working-directory: places-calendar
        run: |
          python -m generator.build --only "$SECTIONS" --base-url https://aafnaipatro.com --out ../.cloudflare/places-calendar --clean
          python tests/check_build.py ../.cloudflare/places-calendar | tail -5
          find ../.cloudflare/places-calendar -type f | wc -l > /tmp/pc-count
          echo "::notice title=Places-calendar build::$(cat /tmp/pc-count) files"

      - name: Resolve ARCHIVE R2 bucket
        run: |
          set -uo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then echo '::error::Cloudflare credentials are required.'; exit 1; fi
          if [[ ! -f dist/index.html ]]; then mkdir -p dist && echo '<!doctype html><title>pc</title>' > dist/index.html; fi
          if ! out="$(node scripts/prepare-cloudflare-config.mjs 2>&1)"; then
            echo "$out" | grep -E "Error|error" | head -6 | while IFS= read -r line; do echo "::error::config: ${line}"; done
            exit 1
          fi
          bucket="$(node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.generated.jsonc','utf8'));const r=(c.r2_buckets||[]).find(x=>x.binding==='ARCHIVE');process.stdout.write(r&&r.bucket_name||'')")"
          if [[ -z "${bucket}" ]]; then echo "::error::ARCHIVE R2 bucket could not be resolved."; exit 1; fi
          echo "${bucket}" > /tmp/r2-bucket

      - name: Resolve R2 S3 credentials
        run: |
          set -euo pipefail
          if [[ -n "${R2_ACCESS_KEY_ID:-}" && -n "${R2_SECRET_ACCESS_KEY:-}" ]]; then
            key_id="${R2_ACCESS_KEY_ID}"; key_secret="${R2_SECRET_ACCESS_KEY}"
          else
            auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            key_id="$(curl -fsS "${auth[@]}" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.result.id // empty' || true)"
            if [[ -z "${key_id}" ]]; then
              key_id="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" | jq -r '.result.id // empty' || true)"
            fi
            key_secret="$(printf '%s' "${CLOUDFLARE_API_TOKEN}" | sha256sum | cut -d' ' -f1)"
          fi
          if [[ -z "${key_id}" ]]; then echo "::error::Could not resolve R2 S3 credentials (tens of thousands of files need rclone)."; exit 1; fi
          echo "::add-mask::${key_id}"; echo "::add-mask::${key_secret}"
          { echo "S3_KEY_ID=${key_id}"; echo "S3_KEY_SECRET=${key_secret}"; } >> "$GITHUB_ENV"

      - name: Upload with rclone (incremental; only pc/v1/ is written or deleted)
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ env.S3_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ env.S3_KEY_SECRET }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          bucket="$(cat /tmp/r2-bucket)"
          next="$(cat /tmp/pc-count)"
          prev="$(rclone size "r2:${bucket}/${PREFIX}" --json 2>/dev/null | jq -r '.count // 0' || echo 0)"
          echo "Previous objects: ${prev}; new files: ${next}"
          if [[ "${prev}" -gt 0 && $(( next * 100 )) -lt $(( prev * 80 )) && "${{ inputs.allow_shrink }}" != "true" ]]; then
            echo "::error::File count would drop from ${prev} to ${next} (>20%). Re-run with allow_shrink if intended."; exit 1
          fi
          if [[ "${{ inputs.allow_shrink }}" == "true" ]]; then max_delete=-1; else max_delete=$(( prev / 5 + 1000 )); fi
          rclone sync .cloudflare/places-calendar "r2:${bucket}/${PREFIX}" --checksum --fast-list --transfers 64 --checkers 64 \
            --max-delete "${max_delete}" --stats 60s --stats-one-line
          echo "::notice title=Places-calendar deployed::${next} files under ${PREFIX}/. Submit https://aafnaipatro.com/sitemap-places.xml in Search Console."
