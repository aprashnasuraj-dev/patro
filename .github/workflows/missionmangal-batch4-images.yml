name: Complete Mission Mangal Batch 4 images
# Re-trigger with the push-enabled image pipeline.

on:
  push:
    branches:
      - missionmangal-writer-batch-production
    paths:
      - writer-workspace/scripts/complete_batch4_images.py
      - .github/workflows/missionmangal-batch4-images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: missionmangal-batch4-image-completion
  cancel-in-progress: false

jobs:
  image-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: missionmangal-writer-batch-production
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check Pillow requests
      - name: Generate/download, validate, and commit all ten heroes
        run: python writer-workspace/scripts/complete_batch4_images.py
      - name: Verify clean image-complete marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          done=json.loads(Path("writer-workspace/output/done/batch-0004.done.json").read_text())
          assert len(done["completed"]) == 10
          assert len(done["images_complete"]) == 10
          assert not any("pending" in k.lower() for k in done)
          for slug in done["completed"]:
              article=json.loads(Path(f"writer-workspace/output/articles/{slug}.json").read_text())
              image=article["image"]
              assert image and image["width"] == 1200 and image["height"] == 630
              assert Path("writer-workspace/output/images", image["file"]).is_file()
          print("All 10 heroes exist, are 1200x630, and have complete image metadata.")
          PY
