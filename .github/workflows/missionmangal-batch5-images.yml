name: Mission Mangal Batch 0005 images and final validation
on:
  push:
    branches:
      - missionmangal-writer-batch-production
    paths:
      - ".github/workflows/missionmangal-batch5-images.yml"
      - "writer-workspace/scripts/complete_batch5.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: missionmangal-batch5-images
  cancel-in-progress: false
jobs:
  build-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out batch branch
        uses: actions/checkout@v4
        with:
          ref: missionmangal-writer-batch-production
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image library
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate hero images and validate all gates
        run: python writer-workspace/scripts/complete_batch5.py
      - name: Commit generated assets and completion marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writer-workspace/output/articles writer-workspace/output/images writer-workspace/output/done/batch-0005.done.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Complete Mission Mangal Writer Batch 0005 images and validation"
          git push origin HEAD:missionmangal-writer-batch-production
