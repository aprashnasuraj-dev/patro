name: Aafnai Library Phase 1 deploy
on:
  repository_dispatch:
    types: [aafnai-library-preview-ready]
  workflow_dispatch:
    inputs:
      handoff_tag:
        description: Draft handoff release tag from Mission Mangal
        required: true
        type: string
      activate_routes:
        description: Activate only /library, /article/*, /blogs/*, /research/* and /sitemap-library.xml
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: aafnai-library-phase1-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LIBRARY_R2_BUCKET: aafnai-library
      LIBRARY_ASSET_DOMAIN: library-assets.aafnaipatro.com
      LIBRARY_ZONE_NAME: aafnaipatro.com
      LIBRARY_ASSET_ORIGIN: https://library-assets.aafnaipatro.com/phase1
    steps:
      - uses: actions/checkout@v4
      - name: Resolve handoff and activation mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.tag }}"
            ACTIVATE="false"
          else
            TAG="${{ inputs.handoff_tag }}"
            ACTIVATE="${{ inputs.activate_routes }}"
          fi
          test -n "$TAG" || { echo "handoff tag required" >&2; exit 1; }
          echo "HANDOFF_TAG=$TAG" >> "$GITHUB_ENV"
          echo "ACTIVATE_ROUTES=$ACTIVATE" >> "$GITHUB_ENV"
      - name: Download validated Mission Mangal handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .library-handoff .library-source .library-rendered
          mkdir -p .library-handoff .library-source
          gh release download "$HANDOFF_TAG" --repo "$GITHUB_REPOSITORY" --dir .library-handoff
          BUNDLE="$(find .library-handoff -maxdepth 1 -name 'aafnai-library-phase1-source-*.tar.gz' -print -quit)"
          test -n "$BUNDLE" || { echo "source bundle missing" >&2; exit 1; }
          test -f "${BUNDLE}.sha256" || { echo "sha256 receipt missing" >&2; exit 1; }
          (cd .library-handoff && sha256sum -c "$(basename "${BUNDLE}.sha256")")
          tar -C .library-source -xzf "$BUNDLE"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
      - name: Render professional Library release
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check markdown beautifulsoup4
          python library-release/render_source_bundle.py --source .library-source --output .library-rendered
          python - <<'PY'
          import json
          p=json.load(open('.library-rendered/ready.json'))
          assert p['ready'] is True
          assert p['article_count']==2640
          assert p['research_page_count']==2640
          print(json.dumps(p,indent=2))
          PY
      - name: Cloudflare credential preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID missing" >&2; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN missing" >&2; exit 1; }
      - name: Upload release objects to isolated R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          node library-release/upload-r2.mjs .library-rendered
      - name: Configure direct R2 asset domain
        shell: bash
        run: |
          set -euo pipefail
          node library-release/configure-r2-domain.mjs
      - name: Deploy isolated Library Worker
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ACTIVATE_ROUTES" = "true" ]; then
            npx wrangler deploy --config library-release/wrangler.production.jsonc | tee .library-deploy.log
          else
            npx wrangler deploy --config library-release/wrangler.preview.jsonc | tee .library-deploy.log
          fi
      - name: Verify R2 public asset surface
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "https://library-assets.aafnaipatro.com/phase1/static/library.css" -o /tmp/library.css; then break; fi
            sleep 3
          done
          test -s /tmp/library.css
          grep -q "article-page" /tmp/library.css
      - name: Production path isolation guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'aafnaipatro.com/library\*' library-release/wrangler.production.jsonc
          grep -q 'aafnaipatro.com/article/\*' library-release/wrangler.production.jsonc
          grep -q 'aafnaipatro.com/blogs/\*' library-release/wrangler.production.jsonc
          grep -q 'aafnaipatro.com/research/\*' library-release/wrangler.production.jsonc
          if grep -q '"pattern": "aafnaipatro.com/\*"' library-release/wrangler.production.jsonc; then
            echo "Broad production route forbidden" >&2
            exit 1
          fi
      - name: Persist deployment readiness receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re
          ready=json.load(open('.library-rendered/ready.json'))
          log=open('.library-deploy.log',errors='ignore').read()
          urls=re.findall(r'https://[^\s]+workers\.dev[^\s]*',log)
          receipt={
            'ready': True,
            'handoff_tag': os.environ['HANDOFF_TAG'],
            'article_count': ready['article_count'],
            'research_page_count': ready['research_page_count'],
            'sector_count': ready['sector_count'],
            'r2_bucket': os.environ['LIBRARY_R2_BUCKET'],
            'asset_domain': os.environ['LIBRARY_ASSET_DOMAIN'],
            'preview_worker_deployed': os.environ.get('ACTIVATE_ROUTES')!='true',
            'production_routes_activated': os.environ.get('ACTIVATE_ROUTES')=='true',
            'workers_dev_urls': urls[:3],
            'existing_homepage_changed': False,
            'existing_feature_routes_changed': False
          }
          open('library-release/readiness-status.json','w').write(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name "aafnai-library-release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library-release/readiness-status.json
          if ! git diff --cached --quiet; then
            git commit -m "release(library): record Phase 1 preview readiness [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
