name: Extract MissionMangal writer source
on:
  workflow_dispatch:
  push:
    branches: [missionmangal-writer-batch-production]
    paths: [.github/workflows/extract-missionmangal-writer.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract archive into versioned workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root=Path('writer-workspace/source')
          with ZipFile('MissionMangal-Writer.zip') as z:
              for item in z.infolist():
                  name=Path(item.filename)
                  if not name.parts or name.parts[0]!='MissionMangal-Writer':
                      raise ValueError('Unexpected archive root')
                  relative=Path(*name.parts[1:])
                  if not relative.parts: continue
                  if relative.is_absolute() or '..' in relative.parts:
                      raise ValueError('Unsafe archive path')
                  target=root/relative
                  if item.is_dir():
                      target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(z.read(item))
          batches=sorted((root/'batches').glob('batch-*.json'))
          assert len(batches)==390, f'Expected 390 batches, found {len(batches)}'
          assert all((root/n).is_file() for n in ['README-FIRST.md','PROTOCOL.md','ARTICLE_SCHEMA.json'])
          print(f'Extracted {len(batches)} batches')
          PY
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writer-workspace/source
          if ! git diff --cached --quiet; then
            git commit -m "Extract complete MissionMangal writer archive and 390 batch manifests"
            git push
          fi
