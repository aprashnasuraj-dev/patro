name: Build Batch 1 hero PNGs
on:
  push:
    branches:
      - missionmangal-writer-batch-production
    paths:
      - 'writer-workspace/output/images/*-hero.svg'
permissions:
  contents: write
concurrency:
  group: batch1-hero-image-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the batch branch
        uses: actions/checkout@v4
        with:
          ref: missionmangal-writer-batch-production
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert original SVG artwork to 1200x630 PNG
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import glob
          import cairosvg
          for source in glob.glob("writer-workspace/output/images/*-hero.svg"):
              target = source[:-4] + ".png"
              cairosvg.svg2png(url=source, write_to=target, output_width=1200, output_height=630)
          PY
      - name: Commit PNG assets and remove temporary SVG sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writer-workspace/output/images/*-hero.png
          git rm --ignore-unmatch writer-workspace/output/images/*-hero.svg
          if ! git diff --cached --quiet; then
            git commit -m "Build Batch 1 hero PNG assets"
            git push
          fi
