name: Mission Mangal v2 regression tests
on:
  push:
    branches: [missionmangal-v2-rescue-combined]
    paths:
      - "missionmangal/**"
      - ".github/workflows/missionmangal-v2-tests.yml"
  pull_request:
    paths:
      - "missionmangal/**"
      - ".github/workflows/missionmangal-v2-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: missionmangal-v2-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Mission Mangal regression tests
        run: node --test missionmangal/tests/*.test.mjs
