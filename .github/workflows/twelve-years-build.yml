name: Twelve Years production build
on:
  push:
    branches:
      - epub-build-20260928
    paths:
      - 'tools/twelve-years/**'
      - '.github/workflows/twelve-years-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCX_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-3224-8211-8583-b6e43b905186/raw?se=2026-09-28T00%3A57%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=e04c7f9a-2352-5d89-8a4b-e7d85d87c5d5&skoid=37f774a3-b6f2-4e56-9fdd-339e5d6e97f8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A30%3A44Z&ske=2026-09-29T00%3A30%3A44Z&sks=b&skv=2026-02-06&sig=Ae1wH6uKnDsXbWePRWd20ompm6bYmcmP3s4mG4FFEQI%3D'
      IMAGES_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-8e74-8211-9367-2bd0f060c145/raw?se=2026-09-28T00%3A57%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=54bd5d68-4834-5f5f-beda-5705c527c8cd&skoid=37f774a3-b6f2-4e56-9fdd-339e5d6e97f8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A00%3A23Z&ske=2026-09-29T00%3A00%3A23Z&sks=b&skv=2026-02-06&sig=SYvJ2e9yqB4cYEWMY/GslQYFZGPTh4DHKNJ/zSeMacs%3D'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx pillow lxml
      - name: Build EPUB and illustrated DOCX
        run: python tools/twelve-years/build_book.py
      - name: Run EPUBCheck 5.3.0
        shell: bash
        run: |
          set +e
          curl -L --fail --retry 3 -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          JAR="$(find /tmp/epubcheck -type f -name epubcheck.jar -print -quit)"
          echo "EPUBCheck jar: $JAR"
          test -n "$JAR" || exit 97
          java -jar "$JAR" output/Twelve-Years-The-Himalayan-Tsunami-Suraj-Dahal.epub 2>&1 | tee output/epubcheck.txt
          rc=${PIPESTATUS[0]}
          printf '\n## EPUBCheck 5.3.0\n\n' >> output/CHECKLIST.md
          cat output/epubcheck.txt >> output/CHECKLIST.md
          printf '\n' >> output/CHECKLIST.md
          exit "$rc"
      - name: Upload completed book package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Twelve-Years-final
          path: |
            output/Twelve-Years-The-Himalayan-Tsunami-Suraj-Dahal.epub
            output/Twelve-Years-The-Himalayan-Tsunami-Suraj-Dahal-Illustrated.docx
            output/CHECKLIST.md
            output/image-placement.csv
            output/epubcheck.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
