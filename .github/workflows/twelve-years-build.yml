name: Twelve Years production build
on:
  push:
    branches:
      - epub-build-20260928
    paths:
      - 'tools/twelve-years/**'
      - '.github/workflows/twelve-years-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCX_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-91b8-8211-8cb2-5804661fe57b/raw?se=2026-09-28T00%3A54%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=c7feeb81-d82f-5e9b-8a91-36751c426505&skoid=37f774a3-b6f2-4e56-9fdd-339e5d6e97f8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T23%3A58%3A04Z&ske=2026-09-28T23%3A58%3A04Z&sks=b&skv=2026-02-06&sig=yYteEHqu38YjM%2BCse66Ufao3LXyq%2Bo9f2y4W2eIUx9U%3D'
      IMAGES_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-b424-8211-a1d9-0370b3e7bdbc/raw?se=2026-09-28T00%3A54%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=f020c55a-f4a5-5bfb-a054-a93d8242d8c2&skoid=37f774a3-b6f2-4e56-9fdd-339e5d6e97f8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A00%3A12Z&ske=2026-09-29T00%3A00%3A12Z&sks=b&skv=2026-02-06&sig=b53UGthM6btgilBlpdT3jnLglg6WXg6vMzWVDa0tfnE%3D'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx pillow lxml
      - name: Build EPUB and illustrated DOCX
        run: python tools/twelve-years/build_book.py
      - name: Run EPUBCheck 5.3.0
        shell: bash
        run: |
          set +e
          curl -L --fail --retry 3 -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          JAR="$(find /tmp/epubcheck -type f -name epubcheck.jar | head -n 1)"\n          echo "EPUBCheck jar: $JAR"\n          java -jar "$JAR" output/Twelve-Years-The-Himalayan-Tsunami-Suraj-Dahal.epub 2>&1 | tee output/epubcheck.txt
          rc=${PIPESTATUS[0]}
          printf '\n## EPUBCheck 5.3.0\n\n\`\`\`text\n' >> output/CHECKLIST.md
          cat output/epubcheck.txt >> output/CHECKLIST.md
          printf '\n\`\`\`\n' >> output/CHECKLIST.md
          exit $rc
      - name: Upload completed book package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Twelve-Years-final
          path: |
            output/Twelve-Years-The-Himalayan-Tsunami-Suraj-Dahal.epub
            output/Twelve-Years-The-Himalayan-Tsunami-Suraj-Dahal-Illustrated.docx
            output/CHECKLIST.md
            output/image-placement.csv
            output/epubcheck.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
