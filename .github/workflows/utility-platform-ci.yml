name: Utility Platform CI

on:
  pull_request:
  push:
    branches: [main, "feat/nepali-utility-platform"]

permissions:
  contents: read

concurrency:
  group: utility-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Core tests
        run: npm run test:core

      - name: Production build
        run: npm run build

      - name: Verify utility artifact
        run: |
          test -f dist/astro/index.html
          test -f dist/astro/sw.js
