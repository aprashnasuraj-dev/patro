name: Utility Platform CI

on:
  pull_request:
  push:
    branches: [main, "feat/nepali-utility-platform"]

permissions:
  contents: read

concurrency:
  group: utility-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install from clean checkout
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Core tests
        run: npm run test:core

      - name: Nepali typing tests
        run: npm run test:typing

      - name: Patro tool feature tests
        run: npm run test:patro-tools

      - name: Community calendar tests
        run: npm run test:community

      - name: Full product route and connectivity contract
        run: npm run test:full-product

      - name: Production build
        run: npm run build

      - name: Verify migration artifact
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/sw.js
          test -f dist/tools/index.html
          test -f dist/samudaya/index.html
          test -f dist/nepal-sambat/mandala/index.html
          test -f dist/samudaya/lhosar/index.html
          test -f dist/samudaya/tharu/index.html
          test -f dist/samudaya/mithila/index.html
          test -f dist/samudaya/kirat/index.html
          test -f dist/samudaya/hijri/index.html
          test -f dist/samudaya/chakra/index.html
