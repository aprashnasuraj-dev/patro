name: UI rebrand normalize

on:
  push:
    branches: [ui-rebrand]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[rebrand-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-rebrand
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize legacy brand and shell paths
        run: node scripts/normalize-aafnai-repo.mjs
      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify normalization and TypeScript
        run: |
          npm run audit:aafnai
          npm run typecheck
      - name: Commit normalized files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ui): [rebrand-bot] normalize legacy brand and shell paths"
          git push origin HEAD:ui-rebrand
