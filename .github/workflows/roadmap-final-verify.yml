name: "Roadmap final full verification"

on:
  workflow_dispatch: {}
  push:
    branches: [wip/roadmap-final-integration]
    paths:
      - ".github/workflows/roadmap-final-verify.yml"
      - "PR_READY.md"
      - "docs/verification/**"
      - "scripts/a11y.sh"
      - "scripts/verify.sh"
      - "scripts/explore/nepal/**"
      - "worker/**"
      - "public/**"
      - "tests/**"
      - "wrangler.jsonc"
      - "package.json"
      - "vite.config.*"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: roadmap-final-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Full one-command roadmap verification
        run: ./scripts/verify.sh
      - name: Preserve final verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-final-full-verification
          path: |
            docs/verification/
            docs/perf/
            test-results/
          if-no-files-found: warn
          retention-days: 30
