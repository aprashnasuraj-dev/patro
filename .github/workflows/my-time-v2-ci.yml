name: My Time V2 integrated verification
on:
  push:
    branches:
      - feature/my-time-v2-integrated-intelligence
  pull_request:
    paths:
      - 'src/features/my-time/**'
      - 'src/jyotish/**'
      - 'src/patro-tools/core/my-time-**'
      - 'worker/my-time/**'
      - 'tests/my-time-**'
      - 'package.json'
      - '.github/workflows/my-time-v2-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: My Time regression suite
        run: npm run test:patro-tools
      - name: Browser smoke script
        run: node scripts/check-mytime-ring.cjs
