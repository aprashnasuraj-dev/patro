name: My Time V2 integrated verification
on:
  push:
    branches:
      - feature/my-time-v2-integrated-intelligence
  pull_request:
    paths:
      - 'src/features/my-time/**'
      - 'src/jyotish/**'
      - 'src/patro-tools/core/my-time-**'
      - 'worker/my-time/**'
      - 'tests/my-time-**'
      - 'package.json'
      - '.github/workflows/my-time-v2-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: My Time regression suite
        run: npm run test:patro-tools
      - name: Build production assets
        run: npm run build
      - name: Install Playwright test runtime and Chromium
        run: |
          npm install --no-save --legacy-peer-deps --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Browser smoke script
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/mytime-vite.log 2>&1 &
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:4173/mytime >/dev/null; then break; fi; sleep 1; done
          node scripts/check-mytime-ring.cjs
