name: "Places: OpenStreetMap import"

# Pulls every named temple, gumba, mosque, church, peak and viewpoint in Nepal
# from OpenStreetMap, assigns each to its district and province, and commits
# places-calendar/data/places_osm.yaml + peaks_osm.yaml.
# Source: the Geofabrik Nepal extract (one file, no query server); the public
# Overpass API is only a fallback if the download fails.
#
# - Manual run or monthly: opens a pull request (never pushes to main).
# - Push to a feature branch that changes the importer: commits to that branch.
# Touches only places-calendar/data/*_osm.yaml. Never builds or deploys the site.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 21 1 * *"   # 03:15 NPT on the 2nd of each month
  push:
    branches-ignore: [main]
    paths:
      - places-calendar/tools/osm_import.py
      - .github/workflows/places-osm-import.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: places-osm-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: places-calendar
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt osmium

      - name: Download the Geofabrik Nepal extract
        id: pbf
        continue-on-error: true
        run: |
          curl -fsSL --retry 4 --retry-delay 15 -o /tmp/nepal-latest.osm.pbf \
            https://download.geofabrik.de/asia/nepal-latest.osm.pbf
          ls -lh /tmp/nepal-latest.osm.pbf

      - name: Import from OpenStreetMap
        run: |
          if [[ -s /tmp/nepal-latest.osm.pbf ]]; then
            python tools/osm_import.py --pbf /tmp/nepal-latest.osm.pbf
          else
            echo "::warning::Geofabrik download failed; trying the Overpass API"
            python tools/osm_import.py --save-raw /tmp/osm-raw
          fi

      - name: Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import yaml, collections
          p = yaml.safe_load(open("data/places_osm.yaml"))["places"]
          k = yaml.safe_load(open("data/peaks_osm.yaml"))["peaks"]
          print("### OpenStreetMap import")
          print(f"- Places of worship: **{len(p)}**")
          print(f"- Peaks and viewpoints: **{len(k)}**")
          print(f"- Places with a district: {sum(1 for x in p if x.get('district'))}")
          print(f"- Districts covered: {len({x['district'] for x in p if x.get('district')})} of 77")
          for r, n in collections.Counter(x['religion'] for x in p).most_common():
              print(f"- {r}: {n}")
          EOF

      - name: Check the data still builds
        run: |
          python tests/test_units.py >/dev/null
          python -m generator.build --only places --years 2083-2083 --no-images --workers 2 --out /tmp/check
          python tests/check_build.py /tmp/check | tail -1

      - name: Commit to this branch
        if: github.ref_name != 'main'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          report() { echo "::error title=Commit step failed::$(tail -c 900 /tmp/git.log | tr '\n' ' ')"; exit 1; }
          git add places-calendar/data/places_osm.yaml places-calendar/data/peaks_osm.yaml > /tmp/git.log 2>&1 || report
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          ls -l places-calendar/data/*_osm.yaml
          git commit -q -m "data(places): OpenStreetMap import $(date -u +%F)" > /tmp/git.log 2>&1 || report
          git fetch -q origin "${GITHUB_REF_NAME}" > /tmp/git.log 2>&1 || report
          git rebase -q "origin/${GITHUB_REF_NAME}" > /tmp/git.log 2>&1 || report
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" > /tmp/git.log 2>&1 || report
          echo "::notice title=Committed::OpenStreetMap data pushed to ${GITHUB_REF_NAME}"

      - name: Open a pull request (main)
        if: github.ref_name == 'main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add places-calendar/data/places_osm.yaml places-calendar/data/peaks_osm.yaml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          branch="places/osm-import-$(date -u +%Y%m%d)"
          git switch -c "$branch"
          git commit -m "data(places): OpenStreetMap import $(date -u +%F)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "data(places): OpenStreetMap import $(date -u +%F)" \
            --body "Monthly refresh of temples, gumbas, mosques, churches, peaks and viewpoints from OpenStreetMap via the Geofabrik Nepal extract (© OpenStreetMap contributors, ODbL 1.0). See the workflow run summary for counts." \
            || echo "::warning::Could not open a PR automatically (repository setting). Branch ${branch} was pushed; open the PR from GitHub."
