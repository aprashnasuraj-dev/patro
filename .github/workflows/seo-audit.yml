name: SEO and performance audit

on:
  pull_request:
    branches: [main, cloudflare-migration]
  push:
    branches: [cloudflare-migration]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Build production assets and SEO manifests
        env:
          PUBLIC_SITE_URL: https://patro-blush.vercel.app
        run: npm run build
      - name: Lighthouse SEO, accessibility and performance gate
        run: npx --yes @lhci/cli@0.15.1 autorun --config=.lighthouserc.json
      - name: Print failed Lighthouse audits
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const dir = ".lighthouseci";
          if (!fs.existsSync(dir)) process.exit(0);
          for (const file of fs.readdirSync(dir).filter((name) => name.endsWith(".json"))) {
            let lhr;
            try { lhr = JSON.parse(fs.readFileSync(dir + "/" + file, "utf8")); } catch { continue; }
            const url = lhr.finalDisplayedUrl || lhr.finalUrl || lhr.requestedUrl || file;
            console.log("\nLighthouse diagnostics:", url);
            for (const categoryId of ["seo", "accessibility"]) {
              const category = lhr?.categories?.[categoryId];
              if (!category) continue;
              for (const ref of category.auditRefs || []) {
                const audit = lhr.audits?.[ref.id];
                if (!audit || audit.score === null || audit.score >= 1) continue;
                const items = Array.isArray(audit.details?.items)
                  ? audit.details.items.slice(0, 12).map((item) => ({
                      selector: item?.node?.selector || item?.selector || null,
                      snippet: item?.node?.snippet || item?.snippet || null,
                      label: item?.node?.nodeLabel || item?.nodeLabel || null,
                      explanation: item?.node?.explanation || item?.explanation || null
                    }))
                  : [];
                console.log(JSON.stringify({
                  category: categoryId,
                  id: ref.id,
                  score: audit.score,
                  title: audit.title,
                  description: audit.description,
                  displayValue: audit.displayValue || null,
                  items
                }));
              }
            }
          }
          NODE
