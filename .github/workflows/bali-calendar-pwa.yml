name: "Bali Calendar PWA evidence"

on:
  workflow_dispatch: {}
  push:
    branches: [wip/bali-native-pwa-continuation, feat/bali-traditional-workspace-v2]
    paths:
      - ".github/workflows/bali-calendar-pwa.yml"
      - "worker/worldcal/**"
      - "worker/roadmap/flags.ts"
      - "public/bali-calendar/**"
      - "public/sw.js"
      - "src/pwa.ts"
      - "wrangler.jsonc"
      - "tests/roadmap-bali*.test.ts"
      - "tests/bali-traditional-workspace.test.ts"
      - "tests/roadmap-wariga.test.ts"
      - "tests/roadmap-ics.test.ts"
      - "scripts/explore/nepal/build-map.mjs"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: bali-calendar-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Typecheck
        run: npm run typecheck
      - name: Bali source-backed and PWA tests
        run: npx vitest run tests/bali-traditional-workspace.test.ts tests/roadmap-bali.test.ts tests/roadmap-bali-annual.test.ts tests/roadmap-bali-pwa.test.ts tests/roadmap-wariga.test.ts tests/roadmap-ics.test.ts
      - name: Static PWA syntax and manifest
        run: |
          node --check public/bali-calendar/pwa.js
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("public/bali-calendar/manifest.webmanifest","utf8")); if(m.id!=="/bali-calendar"||m.start_url!=="/bali-calendar?source=pwa"||m.scope!=="/bali-calendar"||m.display!=="standalone") process.exit(2);'
      - name: Production build
        run: npm run build
      - name: Built Bali PWA delivery contract
        run: |
          test -s dist/bali-calendar/manifest.webmanifest
          test -s dist/bali-calendar/pwa.js
          test -s dist/bali-calendar-sw.js
          test -s dist/bali-calendar/icon.svg
          grep -q '"id": "/bali-calendar"' dist/bali-calendar/manifest.webmanifest
          grep -q 'REV="bali-calendar-pwa-v3"' dist/bali-calendar/pwa.js
          grep -Fq 'register("/bali-calendar-sw.js?rev="+REV' dist/bali-calendar/pwa.js
          grep -q 'bali-calendar-shell-v3' dist/bali-calendar-sw.js
          grep -q 'aafnai-pwa-v19' dist/sw.js
          ! grep -q 'BALI_PWA_CORE' dist/sw.js
          grep -q 'aafnai-pwa-v19' src/pwa.ts
      - name: Evidence summary
        run: |
          {
            echo "## Bali Calendar PWA"
            echo "- TypeScript: PASS"
            echo "- Full 210-day Tika + 35-cell Palelintangan + Bali/Wariga/annual/ICS/PWA tests: PASS"
            echo "- Production build: PASS"
            echo "- Dedicated manifest + install runtime present in dist: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
