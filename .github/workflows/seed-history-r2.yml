name: Seed Public Archives R2

on:
  push:
    branches: [main]
    paths:
      - 'migration/data/public/on_this_day_events/**'
      - 'migration/data/public/astronomy_calendar_map/**'
      - 'scripts/calendar-snapshot.mjs'
      - 'scripts/cloudflare/build-history-r2.mjs'
      - 'scripts/cloudflare/build-calendar-r2.mjs'
      - 'worker/history-fast.ts'
      - 'worker/calendar-fast.ts'
      - '.github/workflows/seed-history-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-public-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME || secrets.CF_R2_BUCKET_NAME }}
      CF_R2_PREVIEW_BUCKET_NAME: ${{ vars.CF_R2_PREVIEW_BUCKET_NAME || secrets.CF_R2_PREVIEW_BUCKET_NAME }}
      CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID || secrets.CF_KV_NAMESPACE_ID }}
      CF_KV_PREVIEW_NAMESPACE_ID: ${{ vars.CF_KV_PREVIEW_NAMESPACE_ID || secrets.CF_KV_PREVIEW_NAMESPACE_ID }}
      CF_CACHE_AUTO_PROVISION: '0'
      PUBLIC_REFERENCE_CACHE_VERSION: public-reference-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install Wrangler
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Resolve production R2 bucket
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo '::error::Cloudflare credentials are required to seed R2.'
            exit 1
          fi
          node scripts/prepare-cloudflare-config.mjs
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const cfg=JSON.parse(readFileSync('wrangler.generated.jsonc','utf8'));
          const row=cfg.r2_buckets?.find(x=>x.binding==='ARCHIVE');
          if(!row?.bucket_name) throw new Error('ARCHIVE R2 bucket could not be resolved');
          writeFileSync('/tmp/patro-r2-bucket',String(row.bucket_name));
          console.log(`ARCHIVE bucket=${row.bucket_name}`);
          NODE
      - name: Build history and calendar archives
        run: node scripts/cloudflare/build-history-r2.mjs
      - name: Upload immutable history source to R2
        run: |
          set -euo pipefail
          bucket="$(cat /tmp/patro-r2-bucket)"
          count=0
          for file in .cloudflare/history-r2/month-*.json .cloudflare/history-r2/manifest.json; do
            [[ -f "$file" ]] || continue
            name="$(basename "$file")"
            key="datasets/on-this-day/v1/${name}"
            npx wrangler r2 object put "${bucket}/${key}" \
              --file "$file" \
              --content-type application/json \
              --cache-control 'public, max-age=31536000, immutable' \
              --remote \
              --force
            count=$((count+1))
          done
          if [[ "$count" -ne 13 ]]; then
            echo "::error::Expected 13 R2 history objects, uploaded ${count}."
            exit 1
          fi
      - name: Upload validated calendar cohort to R2
        run: |
          set -euo pipefail
          bucket="$(cat /tmp/patro-r2-bucket)"
          count=0
          # R2 carries the high-value 2016-2035 AD / corresponding 2072-2092 BS cohort.
          # The full validated archive is still packaged under public/data/calendar, so dates
          # outside this R2 cohort remain D1-independent instead of triggering a huge R2 seed.
          for year in $(seq 2016 2035); do
            file=".cloudflare/calendar-r2/ad/${year}.json"
            [[ -f "$file" ]] || { echo "::error::Missing ${file}"; exit 1; }
            npx wrangler r2 object put "${bucket}/datasets/calendar/v1/ad/${year}.json" --file "$file" --content-type application/json --cache-control 'public, max-age=31536000, immutable' --remote --force
            count=$((count+1))
          done
          for year in $(seq 2072 2092); do
            file=".cloudflare/calendar-r2/bs/${year}.json"
            [[ -f "$file" ]] || continue
            npx wrangler r2 object put "${bucket}/datasets/calendar/v1/bs/${year}.json" --file "$file" --content-type application/json --cache-control 'public, max-age=31536000, immutable' --remote --force
            count=$((count+1))
          done
          if [[ "$count" -lt 40 ]]; then
            echo "::error::Expected at least 40 R2 calendar year objects, uploaded ${count}."
            exit 1
          fi
          echo "Uploaded ${count} validated calendar year shards."
      - name: Verify R2 archives
        run: |
          set -euo pipefail
          bucket="$(cat /tmp/patro-r2-bucket)"
          npx wrangler r2 object get "${bucket}/datasets/on-this-day/v1/manifest.json" --file /tmp/r2-history-manifest.json --remote
          npx wrangler r2 object get "${bucket}/datasets/calendar/v1/ad/2026.json" --file /tmp/r2-calendar-2026.json --remote
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const localHistory=JSON.parse(readFileSync('.cloudflare/history-r2/manifest.json','utf8'));
          const remoteHistory=JSON.parse(readFileSync('/tmp/r2-history-manifest.json','utf8'));
          if(remoteHistory.row_count!==5454) throw new Error(`R2 history row count ${remoteHistory.row_count} != 5454`);
          if(remoteHistory.source_version!==localHistory.source_version) throw new Error('R2 history source version does not match this release');
          if(!Array.isArray(remoteHistory.files)||remoteHistory.files.length!==12) throw new Error('R2 history manifest must contain 12 month shards');

          const localCalendar=JSON.parse(readFileSync('.cloudflare/calendar-r2/ad/2026.json','utf8'));
          const remoteCalendar=JSON.parse(readFileSync('/tmp/r2-calendar-2026.json','utf8'));
          if(remoteCalendar.calendar!=='ad'||remoteCalendar.year!==2026||!Array.isArray(remoteCalendar.rows)||remoteCalendar.rows.length<365) throw new Error('R2 calendar 2026 shard is incomplete');
          if(remoteCalendar.source_version!==localCalendar.source_version) throw new Error('R2 calendar source version does not match this release');
          console.log(JSON.stringify({ok:true,history_rows:remoteHistory.row_count,calendar_2026_rows:remoteCalendar.rows.length,calendar_source_version:remoteCalendar.source_version}));
          NODE