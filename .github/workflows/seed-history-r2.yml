name: Seed On This Day R2

on:
  push:
    branches: [main]
    paths:
      - 'migration/data/public/on_this_day_events/**'
      - 'scripts/cloudflare/build-history-r2.mjs'
      - 'worker/history-fast.ts'
      - '.github/workflows/seed-history-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-history-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.git || secrets.GIT || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME || secrets.CF_R2_BUCKET_NAME }}
      CF_R2_PREVIEW_BUCKET_NAME: ${{ vars.CF_R2_PREVIEW_BUCKET_NAME || secrets.CF_R2_PREVIEW_BUCKET_NAME }}
      CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID || secrets.CF_KV_NAMESPACE_ID }}
      CF_KV_PREVIEW_NAMESPACE_ID: ${{ vars.CF_KV_PREVIEW_NAMESPACE_ID || secrets.CF_KV_PREVIEW_NAMESPACE_ID }}
      CF_CACHE_AUTO_PROVISION: '0'
      PUBLIC_REFERENCE_CACHE_VERSION: public-reference-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install Wrangler
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Resolve production R2 bucket
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo '::error::Cloudflare credentials are required to seed R2.'
            exit 1
          fi
          node scripts/prepare-cloudflare-config.mjs
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const cfg=JSON.parse(readFileSync('wrangler.generated.jsonc','utf8'));
          const row=cfg.r2_buckets?.find(x=>x.binding==='ARCHIVE');
          if(!row?.bucket_name) throw new Error('ARCHIVE R2 bucket could not be resolved');
          writeFileSync('/tmp/patro-r2-bucket',String(row.bucket_name));
          console.log(`ARCHIVE bucket=${row.bucket_name}`);
          NODE
      - name: Build 12-month history archive
        run: node scripts/cloudflare/build-history-r2.mjs
      - name: Upload immutable history source to R2
        run: |
          set -euo pipefail
          bucket="$(cat /tmp/patro-r2-bucket)"
          count=0
          for file in .cloudflare/history-r2/month-*.json .cloudflare/history-r2/manifest.json; do
            [[ -f "$file" ]] || continue
            name="$(basename "$file")"
            key="datasets/on-this-day/v1/${name}"
            npx wrangler r2 object put "${bucket}/${key}" \
              --file "$file" \
              --content-type application/json \
              --cache-control 'public, max-age=31536000, immutable' \
              --remote \
              --force
            count=$((count+1))
          done
          if [[ "$count" -ne 13 ]]; then
            echo "::error::Expected 13 R2 history objects, uploaded ${count}."
            exit 1
          fi
      - name: Verify R2 archive
        run: |
          set -euo pipefail
          bucket="$(cat /tmp/patro-r2-bucket)"
          npx wrangler r2 object get "${bucket}/datasets/on-this-day/v1/manifest.json" --file /tmp/r2-history-manifest.json --remote
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const local=JSON.parse(readFileSync('.cloudflare/history-r2/manifest.json','utf8'));
          const remote=JSON.parse(readFileSync('/tmp/r2-history-manifest.json','utf8'));
          if(remote.row_count!==5454) throw new Error(`R2 row count ${remote.row_count} != 5454`);
          if(remote.source_version!==local.source_version) throw new Error('R2 source version does not match this release');
          if(!Array.isArray(remote.files)||remote.files.length!==12) throw new Error('R2 manifest must contain 12 month shards');
          console.log(JSON.stringify({ok:true,row_count:remote.row_count,source_version:remote.source_version,months:remote.files.length}));
          NODE
