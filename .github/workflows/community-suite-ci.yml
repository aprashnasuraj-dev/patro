name: Community Suite release gate
on:
  push:
    branches:
      - cloudflare-migration
      - "migration/cloudflare-*"
      - main
      - feat/community-suites-c-pages-settings
      - release/community-suites-20260930
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Supplied engine tests
        run: npx vitest run tests/*.test.ts
      - name: Existing core tests
        run: npm run test:core
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build all static routes
        run: npm run build
      - name: Verify seven generated pages and JavaScript budget
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            dist/nepal-sambat/mandala/index.html
            dist/samudaya/lhosar/index.html
            dist/samudaya/tharu/index.html
            dist/samudaya/mithila/index.html
            dist/samudaya/kirat/index.html
            dist/samudaya/hijri/index.html
            dist/samudaya/chakra/index.html
          )
          for page in "${pages[@]}"; do
            test -s "$page"
            ! grep -Eiq 'Loading\.\.\.|>Loading<|>लोड हुँदै' "$page"
          done
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/community-http.log 2>&1 &
          echo $! >/tmp/community-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/samudaya/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/community-http.log
          exit 1
      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps --no-save --no-package-lock playwright@1.56.1 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Mobile check · Nepal Sambat
        run: NODE_PATH="$PWD/node_modules" node scripts/check-community-page.cjs /nepal-sambat/mandala/
      - name: Mobile check · Lhosar
        run: NODE_PATH="$PWD/node_modules" node scripts/check-community-page.cjs /samudaya/lhosar/
      - name: Mobile check · Tharu
        run: NODE_PATH="$PWD/node_modules" node scripts/check-community-page.cjs /samudaya/tharu/
      - name: Mobile check · Mithila
        run: NODE_PATH="$PWD/node_modules" node scripts/check-community-page.cjs /samudaya/mithila/
      - name: Mobile check · Kirat
        run: NODE_PATH="$PWD/node_modules" node scripts/check-community-page.cjs /samudaya/kirat/
      - name: Mobile check · Hijri
        run: NODE_PATH="$PWD/node_modules" node scripts/check-community-page.cjs /samudaya/hijri/
      - name: Mobile check · Samudaya Chakra
        run: NODE_PATH="$PWD/node_modules" node scripts/check-community-page.cjs /samudaya/chakra/
      - name: Lighthouse mobile accessibility
        shell: bash
        run: |
          set -euo pipefail
          routes=(nepal-sambat/mandala samudaya/lhosar samudaya/tharu samudaya/mithila samudaya/kirat samudaya/hijri samudaya/chakra)
          failed=0
          for route in "${routes[@]}"; do
            out="/tmp/lh-${route//\//-}.json"
            npx --yes lighthouse@12.4.0 "http://127.0.0.1:4173/$route/" --only-categories=accessibility --output=json --output-path="$out" --quiet --chrome-flags="--headless --no-sandbox"
            if ! node -e "const x=require(process.argv[1]); const s=x.categories.accessibility.score; const bad=Object.values(x.audits).filter(a=>a.scoreDisplayMode!==\"notApplicable\"&&a.score!==null&&a.score<1).map(a=>a.id+\": \"+a.title+\" [\"+a.score+\"]\"); console.log(process.argv[2],s,bad.join(\" | \")); if(s<0.95) process.exit(1)" "$out" "$route"; then
              failed=1
            fi
          done
          exit "$failed"
