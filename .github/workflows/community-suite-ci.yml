name: Community Suite release gate
on:
  push:
    branches: [cloudflare-migration, main, feat/community-suites-c-pages-settings, release/community-suites-20260930]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Supplied engine tests
        run: npx vitest run tests/*.test.ts
      - name: Existing core tests
        run: npm run test:core
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build all static routes
        run: npm run build
      - name: Verify seven generated pages and JavaScript budget
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            dist/nepal-sambat/mandala/index.html
            dist/samudaya/lhosar/index.html
            dist/samudaya/tharu/index.html
            dist/samudaya/mithila/index.html
            dist/samudaya/kirat/index.html
            dist/samudaya/hijri/index.html
            dist/samudaya/chakra/index.html
          )
          for page in "${pages[@]}"; do
            test -s "$page"
            ! grep -Eiq 'Loading\.\.\.|>Loading<|>लोड हुँदै' "$page"
          done
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/community-http.log 2>&1 &
          echo $! >/tmp/community-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/samudaya/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/community-http.log
          exit 1
      - name: 360px overflow and runtime checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1 >/dev/null
          npx playwright install chromium >/dev/null
          cat >/tmp/check-pages.cjs <<'NODE'
          const { chromium }=require('playwright');
          const routes=['/nepal-sambat/mandala/','/samudaya/lhosar/','/samudaya/tharu/','/samudaya/mithila/','/samudaya/kirat/','/samudaya/hijri/','/samudaya/chakra/'];
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:360,height:800},reducedMotion:'reduce'});for(const route of routes){const p=await c.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e)));await p.goto('http://127.0.0.1:4173'+route,{waitUntil:'networkidle'});const size=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,w:innerWidth}));if(size.sw>size.w+1)throw new Error(route+' sideways overflow '+JSON.stringify(size));if(errors.length)throw new Error(route+' page errors '+errors.join(' | '));await p.close();}await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/check-pages.cjs
      - name: Lighthouse mobile accessibility
        shell: bash
        run: |
          set -euo pipefail
          routes=(nepal-sambat/mandala samudaya/lhosar samudaya/tharu samudaya/mithila samudaya/kirat samudaya/hijri samudaya/chakra)
          failed=0
          for route in "${routes[@]}"; do
            out="/tmp/lh-${route//\//-}.json"
            npx --yes lighthouse@12.4.0 "http://127.0.0.1:4173/$route/" --only-categories=accessibility --output=json --output-path="$out" --quiet --chrome-flags="--headless --no-sandbox"
            if ! node -e "const x=require(process.argv[1]); const s=x.categories.accessibility.score; const bad=Object.values(x.audits).filter(a=>a.scoreDisplayMode!==\"notApplicable\"&&a.score!==null&&a.score<1).map(a=>a.id+\": \"+a.title+\" [\"+a.score+\"]\"); console.log(process.argv[2],s,bad.join(\" | \")); if(s<0.95) process.exit(1)" "$out" "$route"; then
              failed=1
            fi
          done
          exit "$failed"
