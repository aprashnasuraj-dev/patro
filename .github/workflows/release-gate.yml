name: Release Gate

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full release validation
    # Playwright 1.56.1 Chromium is not supported by the current ubuntu-26.04 latest image.
    # Keep the release validation on the same supported LTS image as PR browser regressions.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PUBLIC_SITE_URL: https://aafnaipatro.com
    steps:
      - name: Runner allocation preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "runner.os=${RUNNER_OS:-unknown}"
          echo "runner.arch=${RUNNER_ARCH:-unknown}"
          uname -a
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect release scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive=true
          heavy=true
          files=""
          if [[ "$EVENT_NAME" == "push" && -n "${BEFORE:-}" && ! "$BEFORE" =~ ^0+$ ]]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE"
            fi
            files="$(git diff --name-only "$BEFORE" "$AFTER")"
            printf '%s\n' "$files"
            archive=false
            heavy=false
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                migration/data/public/*|migration/data/public/**|public/data/calendar/*|public/data/calendar/**|cloudflare/d1/*|cloudflare/d1/**|scripts/cloudflare/*r2*|scripts/cloudflare/*archive*|worker/calendar-archive.ts|worker/calendar-fast.ts|worker/history-fast.ts|worker/public-archive-pages.ts|worker/seo-window.ts|wrangler.jsonc)
                  archive=true
                  ;;
              esac
              case "$file" in
                src/rashifal/*|src/rashifal/**|src/jyotish/*|src/jyotish/**|src/auth/*|src/auth/**|src/PatroRouter.tsx|src/components/FeatureLauncher.tsx|src/components/HomeQuickNote.tsx|src/components/MyDiary.tsx|src/components/AppChrome.tsx|src/patro-tools-integration/storage.ts|worker/auth.ts|worker/rashifal-native.ts|worker/optimized-entry.ts|worker/connected-entry.ts|worker/connected-seo.ts|worker/admin-console/site-config.ts|packages/engine/*|packages/engine/**|scripts/seo-config.mjs|scripts/generate-search-intents.mjs|scripts/prerender-seo.mjs|tests/google-account.test.mjs|tests/rashifal-*.test.mjs|tests/janmapatro-*.test.mjs|tests/premium-release-contract.test.mjs|tests/seo-intent-coverage-contract.test.mjs|docs/GOOGLE_ACCOUNT_LOGIN.md|docs/rashifal/*|docs/rashifal/**|docs/janmapatro/*|docs/janmapatro/**|.github/workflows/rashifal-fast-gate.yml|.github/workflows/janmapatro-fast-gate.yml|.github/workflows/release-gate.yml)
                  ;;
                *)
                  heavy=true
                  ;;
              esac
            done <<< "$files"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "archive-sensitive validation=$archive"
          echo "heavy browser validation=$heavy"
      - name: Verify external Worker routes are not claimed by the main release
        run: node scripts/tool-growth/verify-external-routing.mjs
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install once
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify committed migration sources
        id: migration
        if: steps.scope.outputs.archive == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run cloudflare:verify-inventory
          npm run cloudflare:verify-snapshot
      - name: Production build, typecheck, SEO, doctor and product gate
        id: build
        continue-on-error: true
        run: npm run build
      - name: MM530 Phase 9 production artifact audit
        id: mm530_phase9
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: node scripts/mm530/phase9-verify.mjs
      - name: Core, focused feature and release-safety tests
        id: product_tests
        continue-on-error: true
        env:
          HEAVY_RELEASE: ${{ steps.scope.outputs.heavy }}
        run: |
          set -euo pipefail
          npm run test:growth
          npm run test:worker-html
          if [[ "$HEAVY_RELEASE" == "true" ]]; then
            npm run test:core
            npm run test:typing
            npm run test:patro-tools
            npm run test:community
            npm run test:release-safety
            node --test tests/homepage-recovery-contract.test.mjs
          else
            node --test tests/rashifal-fast-contract.test.mjs tests/janmapatro-*.test.mjs
            npm run test:release-safety
          fi
      - name: Cloudflare Worker and full-product contracts
        id: cloudflare
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run test:cloudflare-contract
          npm run cloudflare:validate
      - name: Verify production runtime boundaries
        id: router_boundaries
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("worker/connected-entry.ts", "utf8");
          const match = source.match(/const\s+ALLOWED_COMPAT_ROOTS\s*=\s*new\s+Set\(\[([^\]]*)\]\);/);
          if (!match) throw new Error("ALLOWED_COMPAT_ROOTS declaration not found");
          const roots = [...match[1].matchAll(/"([^"]+)"/g)].map((item) => item[1]);
          const expected = ["tv", "fm", "samachar"];
          if (JSON.stringify(roots) !== JSON.stringify(expected)) {
            throw new Error(`Supabase compatibility roots must be exactly ${expected.join(", ")}; got ${roots.join(", ")}`);
          }
          NODE
          ! grep -q 'SUPABASE_PROTECTED_ORIGIN' wrangler.jsonc worker/connected-entry.ts
          ! grep -q '"miti_rashifal_publications"' cloudflare/d1/expected-public-counts.json
          ! grep -q '"market_snapshots"' cloudflare/d1/expected-public-counts.json
          grep -q '"time_machine_moments": 706' cloudflare/d1/expected-public-counts.json
          grep -q '"mode": "native_bundle"' cloudflare/d1/expected-public-counts.json
      - name: Verify generated release artifact parity
        id: artifacts
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -d dist/assets
          required=(dist/index.html dist/sw.js dist/tools/index.html dist/samudaya/index.html dist/nepal-sambat/mandala/index.html dist/samudaya/lhosar/index.html dist/samudaya/tharu/index.html dist/samudaya/mithila/index.html dist/samudaya/kirat/index.html dist/samudaya/hijri/index.html dist/samudaya/chakra/index.html dist/data/on-this-day/manifest.json dist/data/on-this-day/month-01.json dist/data/on-this-day/month-12.json)
          for file in "${required[@]}"; do
            test -s "$file"
            if grep -Eiq 'Loading\.\.\.|>Loading<|>लोड हुँदै' "$file"; then echo "Terminal loading placeholder found in $file"; exit 1; fi
          done
      - name: Verify immutable R2 release inventory
        id: r2_inventory
        if: always() && steps.build.outcome == 'success' && steps.scope.outputs.archive == 'true'
        continue-on-error: true
        run: node scripts/cloudflare/verify-r2-release-inventory.mjs
      - name: Dependency audit
        id: dependency_audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Reject obvious committed secrets
        id: secret_scan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          patterns='(gsk_[A-Za-z0-9_-]{20,}|nvapi-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,})'
          if git grep -nEI "$patterns" -- . ':(exclude).github/workflows/release-gate.yml'; then echo "Potential secret detected in tracked files."; exit 1; fi
      - name: Install browser validation runtime
        id: browser_runtime
        if: steps.scope.outputs.heavy == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps --no-save --no-package-lock playwright@1.56.1 >/dev/null
          npx playwright install chromium >/dev/null
          mkdir -p .lighthouseci
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .lighthouseci/localhost.key -out .lighthouseci/localhost.crt -days 1 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

      - name: MM530 consolidated production browser acceptance
        id: mm530_phase10
        if: always() && steps.scope.outputs.heavy == 'true' && steps.build.outcome == 'success' && steps.browser_runtime.outcome == 'success' && steps.mm530_phase9.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/serve-dist.mjs >/tmp/mm530-release-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/advancetools/web-tools/ >/dev/null; then break; fi; sleep 1; done
          NODE_PATH="$PWD/node_modules" node scripts/mm530/phase10-browser-gate.mjs
          NODE_PATH="$PWD/node_modules" node scripts/mm530/production-functional-sweep.mjs
          node scripts/mm530/final-acceptance.mjs
          kill "$server" 2>/dev/null || true
          trap - EXIT
      - name: Homepage first-paint, API-failure and offline PWA checks
        id: home_pwa_checks
        if: always() && steps.scope.outputs.heavy == 'true' && steps.build.outcome == 'success' && steps.browser_runtime.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PATRO_AUDIT_API=1 node scripts/serve-dist.mjs >/tmp/patro-release-home-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi; sleep 1; done
          NODE_PATH="$PWD/node_modules" node scripts/check-homepage-release.cjs
          NODE_PATH="$PWD/node_modules" node scripts/check-offline-pwa.cjs
          NODE_PATH="$PWD/node_modules" node scripts/check-pwa-install-ui.cjs
          NODE_PATH="$PWD/node_modules" node scripts/check-growth.cjs
          NODE_PATH="$PWD/node_modules" node scripts/check-voice.cjs
          NODE_PATH="$PWD/node_modules" node scripts/check-voice-features.cjs
          NODE_PATH="$PWD/node_modules" node scripts/check-mytime-ring.cjs
          kill "$server" 2>/dev/null || true
          trap - EXIT
      - name: Canonical tools and community mobile functional checks
        id: mobile_checks
        if: always() && steps.scope.outputs.heavy == 'true' && steps.build.outcome == 'success' && steps.browser_runtime.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/serve-dist.mjs >/tmp/patro-release-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/tools >/dev/null; then break; fi; sleep 1; done
          NODE_PATH="$PWD/node_modules" node scripts/check-canonical-tools.cjs
          NODE_PATH="$PWD/node_modules" node scripts/check-advancetools-dashboard.cjs
          routes=(/nepal-sambat/mandala/ /samudaya/lhosar/ /samudaya/tharu/ /samudaya/mithila/ /samudaya/kirat/ /samudaya/hijri/ /samudaya/chakra/)
          for route in "${routes[@]}"; do NODE_PATH="$PWD/node_modules" node scripts/check-community-page.cjs "$route"; done
          kill "$server" 2>/dev/null || true
          trap - EXIT
      - name: Lighthouse SEO, accessibility, best-practices and performance gate
        id: lighthouse
        if: always() && steps.scope.outputs.heavy == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run seo:audit
          audit_status=$?
          set -e
          if [[ "$audit_status" -ne 0 ]]; then
            node scripts/report-lighthouse-failures.mjs
          fi
          exit "$audit_status"
      - name: Release verdict
        if: always()
        shell: bash
        env:
          MIGRATION: ${{ steps.migration.outcome }}
          BUILD: ${{ steps.build.outcome }}
          MM530_PHASE9: ${{ steps.mm530_phase9.outcome }}
          MM530_PHASE10: ${{ steps.mm530_phase10.outcome }}
          PRODUCT_TESTS: ${{ steps.product_tests.outcome }}
          CLOUDFLARE: ${{ steps.cloudflare.outcome }}
          ROUTER_BOUNDARIES: ${{ steps.router_boundaries.outcome }}
          ARTIFACTS: ${{ steps.artifacts.outcome }}
          R2_INVENTORY: ${{ steps.r2_inventory.outcome }}
          DEPENDENCY_AUDIT: ${{ steps.dependency_audit.outcome }}
          SECRET_SCAN: ${{ steps.secret_scan.outcome }}
          BROWSER_RUNTIME: ${{ steps.browser_runtime.outcome }}
          HOME_PWA_CHECKS: ${{ steps.home_pwa_checks.outcome }}
          MOBILE_CHECKS: ${{ steps.mobile_checks.outcome }}
          LIGHTHOUSE: ${{ steps.lighthouse.outcome }}
          ARCHIVE_REQUIRED: ${{ steps.scope.outputs.archive }}
          HEAVY_REQUIRED: ${{ steps.scope.outputs.heavy }}
        run: |
          set -euo pipefail
          failures=0
          check() { local name="$1" outcome="$2"; if [[ "$outcome" != "success" ]]; then echo "::error::$name outcome=$outcome"; failures=1; else echo "$name=success"; fi; }
          if [[ "$ARCHIVE_REQUIRED" == "true" ]]; then
            check migration "$MIGRATION"
          else
            echo "migration=skipped (no archive-sensitive changes)"
          fi
          check build "$BUILD"
          check mm530_phase9 "$MM530_PHASE9"
          check product_tests "$PRODUCT_TESTS"
          check cloudflare "$CLOUDFLARE"
          check router_boundaries "$ROUTER_BOUNDARIES"
          check artifacts "$ARTIFACTS"
          if [[ "$ARCHIVE_REQUIRED" == "true" ]]; then
            check r2_inventory "$R2_INVENTORY"
          else
            echo "r2_inventory=skipped (no archive-sensitive changes)"
          fi
          check dependency_audit "$DEPENDENCY_AUDIT"
          check secret_scan "$SECRET_SCAN"
          if [[ "$HEAVY_REQUIRED" == "true" ]]; then
            check browser_runtime "$BROWSER_RUNTIME"
            check mm530_phase10 "$MM530_PHASE10"
            check home_pwa_checks "$HOME_PWA_CHECKS"
            check mobile_checks "$MOBILE_CHECKS"
            check lighthouse "$LIGHTHOUSE"
          else
            echo "browser_runtime=skipped (focused release)"
            echo "mm530_phase10=skipped (focused release)"
            echo "home_pwa_checks=skipped (focused release)"
            echo "mobile_checks=skipped (focused release)"
            echo "lighthouse=skipped (focused release)"
          fi
          exit "$failures"
      - name: Optional On This Day D1 snapshot refresh
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SYNC_HISTORY_D1 == '1' && vars.PATRO_ROOT_ASSET_PARITY_VERIFIED == '1'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.git || secrets.GIT || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: fb25c860-01db-4ab0-9036-7f87b26ca64b
          ALLOW_D1_QUOTA_DEFER: "1"
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare credentials are required for the optional D1 history sync."
            exit 1
          fi
          node scripts/cloudflare/ensure-history-d1.mjs
      - name: Deploy validated build to Cloudflare
        # Cloudflare-only static assets have not been reconciled with Git source.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PATRO_ROOT_ASSET_PARITY_VERIFIED == '1'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.git || secrets.GIT || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.GIT || secrets.git }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: 3056ed12f9ab1ea7d567f089ee6807be
          PATRO_DEPLOY_DATE_WORKER: ${{ vars.PATRO_DEPLOY_DATE_WORKER || '0' }}
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID || secrets.CF_KV_NAMESPACE_ID }}
          CF_KV_PREVIEW_NAMESPACE_ID: ${{ vars.CF_KV_PREVIEW_NAMESPACE_ID || secrets.CF_KV_PREVIEW_NAMESPACE_ID }}
          CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME || secrets.CF_R2_BUCKET_NAME }}
          CF_R2_PREVIEW_BUCKET_NAME: ${{ vars.CF_R2_PREVIEW_BUCKET_NAME || secrets.CF_R2_PREVIEW_BUCKET_NAME }}
          CF_CACHE_AUTO_PROVISION: "1"
          REQUIRE_QUOTA_CACHE: "1"
          PUBLIC_REFERENCE_CACHE_VERSION: public-reference-v1
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::GitHub Actions requires a Cloudflare API token and CLOUDFLARE_ACCOUNT_ID before GitHub-owned deployment can be enabled."
            exit 1
          fi
          test -s dist/index.html
          test -s dist/data/on-this-day/manifest.json
          node scripts/tool-growth/verify-external-routing.mjs --live
          node scripts/prepare-cloudflare-config.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const cfg=JSON.parse(readFileSync("wrangler.generated.jsonc","utf8"));
          const kv=cfg.kv_namespaces?.find(x=>x.binding==="CACHE");
          const r2=cfg.r2_buckets?.find(x=>x.binding==="ARCHIVE");
          if(!kv?.id)throw new Error("CACHE KV binding missing from production release config");
          if(!r2?.bucket_name)throw new Error("ARCHIVE R2 binding missing from production release config");
          console.log(`quota bindings required: KV=true R2=true (${r2.bucket_name})`);
          NODE
          set +e
          migration_output="$(CLOUDFLARE_API_TOKEN="${CLOUDFLARE_D1_API_TOKEN:-$CLOUDFLARE_API_TOKEN}" npx wrangler d1 migrations apply DB --remote --config wrangler.generated.jsonc 2>&1)"
          migration_status=$?
          set -e
          printf '%s\n' "$migration_output"
          if [[ "$migration_status" -ne 0 ]]; then
            if grep -q 'code: 7403' <<<"$migration_output"; then
              echo "::warning::Deployment token cannot call the D1 migrations API (7403). Continuing because account schema is idempotently bootstrapped by worker/auth.ts; post-deploy auth smoke will verify it."
            else
              exit "$migration_status"
            fi
          fi
          # Migration 0006 is idempotent even if the live Worker bootstrapped weight
          # first. Verify/add that column on the same remote DB before deployment.
          if [[ "$migration_status" -eq 0 ]]; then
            CLOUDFLARE_API_TOKEN="${CLOUDFLARE_D1_API_TOKEN:-$CLOUDFLARE_API_TOKEN}" node scripts/cloudflare/ensure-analytics-weight-d1.mjs
            CLOUDFLARE_API_TOKEN="${CLOUDFLARE_D1_API_TOKEN:-$CLOUDFLARE_API_TOKEN}" node scripts/cloudflare/initialize-runtime-schema.mjs
          else
            echo "::warning::D1 migration API denied (7403); Worker bootstrap is the existing fallback. Validate runtime after deploy."
          fi
          node scripts/cloudflare/ensure-push-secrets.mjs
          npx wrangler deploy --config wrangler.generated.jsonc
          # /date/* has its own Worker and must not be replaced by a root SEO release.
          if [[ "${PATRO_DEPLOY_DATE_WORKER:-0}" == "1" ]]; then
            npx wrangler deploy --config extensions/date-pages/wrangler.jsonc
          else
            echo "Independent date-pages Worker unchanged"
          fi
      - name: Prime annual On This Day cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.scope.outputs.archive == 'true' && vars.PATRO_ROOT_ASSET_PARITY_VERIFIED == '1'
        env:
          PUBLIC_SITE_URL: https://aafnaipatro.com
          HISTORY_PRIME_CONCURRENCY: "8"
          HISTORY_PRIME_SETTLE_MS: "2000"
        run: node scripts/cloudflare/prime-history-cache.mjs
      - name: Smoke test deployed Cloudflare runtime
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PATRO_ROOT_ASSET_PARITY_VERIFIED == '1'
        shell: bash
        env:
          ARCHIVE_CHANGED: ${{ steps.scope.outputs.archive }}
        run: |
          set -euo pipefail
          for path in / /tools /convert /time-machine /on-this-day /tools/astro /janmapatro/ /janmapatro/milan.html /jyotish/china /jyotish/matchmaking /advancetools/ /advancetools/web-tools/ /calculators/semver-range-calculator /generators/cors-config-generator /converters/json-to-zod-schema /validators/webcam-mic-test /bali-calendar /bali-calendar/palelintangan /bali-calendar/sasih-saka /bali-calendar/otonan /bali-calendar/piodalan /bali-calendar/1929-01-01 /bali-calendar/2129-12-31 /bali-calendar/manifest.webmanifest /bali-calendar/pwa.js /bali-calendar-sw.js; do
            curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "https://aafnaipatro.com${path}" >/dev/null
          done
          bali_root="$(curl --retry 5 --retry-delay 2 --retry-all-errors -fsS https://aafnaipatro.com/bali-calendar)"
          grep -Fq 'class="tika-month-grid"' <<<"$bali_root" || { echo "::error::Bali root missing monthly Tika grid"; exit 1; }
          grep -Fq 'id="my-bali"' <<<"$bali_root" || { echo "::error::Bali root missing My Bali Calendar hub"; exit 1; }
          grep -Fq '1929–2129' <<<"$bali_root" || { echo "::error::Bali root missing dynamic 1929–2129 support marker"; exit 1; }
          grep -Fq 'Memahami Pawukon, Wuku, Wewaran dan hari raya Bali' <<<"$bali_root" || { echo "::error::Bali root missing visitor-facing SEO guide"; exit 1; }
          ! grep -Fq 'fail-closed' <<<"$bali_root" || { echo "::error::Developer terminology leaked onto Bali root"; exit 1; }
          ! grep -Fq 'Dasar tampilan' <<<"$bali_root" || { echo "::error::Research panel leaked into top-level Bali experience"; exit 1; }

          bali_palelintangan="$(curl --retry 5 --retry-delay 2 --retry-all-errors -fsS https://aafnaipatro.com/bali-calendar/palelintangan)"
          grep -Fq 'Kala Sungsang' <<<"$bali_palelintangan" || { echo "::error::Palelintangan missing sourced lintang data"; exit 1; }
          grep -Fq 'ᬭᬤᬶᬢᬾ' <<<"$bali_palelintangan" || { echo "::error::Palelintangan missing sourced Aksara Bali Saptawara label"; exit 1; }
          grep -Fq 'ᬓᬮᬲᬸᬗ᭄ᬲᬂ' <<<"$bali_palelintangan" || { echo "::error::Palelintangan missing Lintang Aksara Bali"; exit 1; }
          grep -Fq 'class="pal-hero"' <<<"$bali_palelintangan" || { echo "::error::Palelintangan rich selected-Lintang hero missing"; exit 1; }
          grep -Fq 'Cara membaca Palelintangan Bali' <<<"$bali_palelintangan" || { echo "::error::Palelintangan visitor guide missing"; exit 1; }

          bali_far="$(curl --retry 5 --retry-delay 2 --retry-all-errors -fsS https://aafnaipatro.com/bali-calendar/2129-12-31)"
          grep -Fq 'Fase Bulan' <<<"$bali_far" || { echo "::error::2129 Bali page missing Moon-phase context"; exit 1; }
