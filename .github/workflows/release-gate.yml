          [[ "$(grep -o 'https://aafnaipatro.com/sitemap-client-tools.xml' <<<"$root_sitemap" | wc -l | tr -d ' ')" == "1" ]] || { echo "::error::Root sitemap must reference sitemap-client-tools.xml exactly once"; exit 1; }

