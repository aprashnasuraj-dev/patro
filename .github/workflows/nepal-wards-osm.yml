name: "Nepal wards: OpenStreetMap import"

# Extracts palika and ward boundaries, named villages and landmarks for the /nepal explore pages from the
# Geofabrik Nepal extract (scripts/explore/nepal/osm_wards.py) and commits the compact JSON under
# data/explore/nepal/osm-*.json. Never builds or deploys the site; the explore deploy workflow publishes pages.
#
# - Manual run or monthly: opens a pull request (never pushes to main).
# - Push to a feature branch that changes the extractor: commits to that branch.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "40 21 2 * *"   # 03:25 NPT on the 3rd of each month
  push:
    branches-ignore: [main]
    paths:
      - scripts/explore/nepal/osm_wards.py
      - .github/workflows/nepal-wards-osm.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nepal-wards-osm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install osmium

      - name: Download the Geofabrik Nepal extract
        run: |
          curl -fsSL --retry 5 --retry-delay 20 -o /tmp/nepal-latest.osm.pbf https://download.geofabrik.de/asia/nepal-latest.osm.pbf
          echo "::notice title=Extract::$(ls -lh /tmp/nepal-latest.osm.pbf | awk '{print $5}')"

      - name: Extract wards, villages and landmarks
        run: python scripts/explore/nepal/osm_wards.py --pbf /tmp/nepal-latest.osm.pbf --out data/explore/nepal

      - name: Summary
        if: always()
        run: |
          if [[ -f data/explore/nepal/osm-report.json ]]; then
            python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("data/explore/nepal/osm-report.json"))
          print("### Nepal wards from OpenStreetMap")
          for k in ("level_counts", "levels", "palikas", "wards", "settlements", "pois"):
              v = r.get(k)
              if isinstance(v, dict):
                  v = {a: b for a, b in v.items() if not str(a).startswith("unmatched")}
              print(f"- **{k}**: `{json.dumps(v, ensure_ascii=False)}`")
          EOF
          fi

      - name: Commit to this branch
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          report() { echo "::error title=Commit step failed::$(tail -c 900 /tmp/git.log | tr '\n' ' ')"; exit 1; }
          git add data/explore/nepal/osm-*.json > /tmp/git.log 2>&1 || report
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "data(nepal): OpenStreetMap wards, villages and landmarks $(date -u +%F)" > /tmp/git.log 2>&1 || report
          for attempt in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}" > /tmp/git.log 2>&1 || report
            git rebase -q "origin/${GITHUB_REF_NAME}" > /tmp/git.log 2>&1 || report
            git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}" > /tmp/git.log 2>&1 && break
            sleep 5
          done
          echo "::notice title=Committed::Nepal ward data pushed to ${GITHUB_REF_NAME}"

      - name: Open a pull request (main)
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/explore/nepal/osm-*.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          branch="nepal/osm-wards-$(date -u +%Y%m%d)"
          git switch -c "$branch"
          git commit -m "data(nepal): OpenStreetMap wards, villages and landmarks $(date -u +%F)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "data(nepal): OpenStreetMap wards, villages and landmarks $(date -u +%F)" \
            --body "Monthly refresh of ward boundaries, villages and landmarks for the /nepal pages from the Geofabrik Nepal extract (© OpenStreetMap contributors, ODbL 1.0). Merge, then run **Explore pages to R2**." \
            || echo "::warning::Could not open a PR automatically. Branch ${branch} was pushed; open the PR from GitHub."
