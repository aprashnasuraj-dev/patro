name: "Nepal wards: OpenStreetMap import"

# Extracts palika and ward boundaries, named villages and landmarks for the /nepal explore pages from the
# Geofabrik Nepal extract (scripts/explore/nepal/osm_wards.py) and commits the compact JSON under
# data/explore/nepal/osm-*.json. Never builds or deploys the site; the explore deploy workflow publishes pages.
#
# - Manual run or monthly: opens a pull request (never pushes to main).
# - Push to a feature branch that changes the extractor: commits to that branch.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "40 21 2 * *"   # 03:25 NPT on the 3rd of each month
  push:
    branches-ignore: [main]
    paths:
      - scripts/explore/nepal/osm_wards.py
      - .github/workflows/nepal-wards-osm.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nepal-wards-osm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install osmium

      - name: Download the Geofabrik Nepal extract
        run: |
          curl -fsSL --retry 5 --retry-delay 20 -o /tmp/nepal-latest.osm.pbf https://download.geofabrik.de/asia/nepal-latest.osm.pbf
          echo "::notice title=Extract::$(ls -lh /tmp/nepal-latest.osm.pbf | awk '{print $5}')"

      - name: Extract wards, villages and landmarks
        run: python scripts/explore/nepal/osm_wards.py --pbf /tmp/nepal-latest.osm.pbf --out data/explore/nepal

      - name: Summary
        if: always()
        run: |
          if [[ -f data/explore/nepal/osm-report.json ]]; then
            python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("data/explore/nepal/osm-report.json"))
          print("### Nepal wards from OpenStreetMap")
          for k in ("level_counts", "levels", "palikas", "wards", "settlements", "pois"):
              v = r.get(k)
              if isinstance(v, dict):
                  v = {a: b for a, b in v.items() if not str(a).startswith("unmatched")}
              print(f"- **{k}**: `{json.dumps(v, ensure_ascii=False)}`")
          EOF
          fi

      - name: Commit to this branch
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          report() { echo "::error title=Commit step failed::$(tail -c 900 /tmp/git.log | tr '\n' ' ')"; exit 1; }
          git add data/explore/nepal/osm-*.json > /tmp/git.log 2>&1 || report
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "data(nepal): OpenStreetMap wards, villages and landmarks $(date -u +%F)" > /tmp/git.log 2>&1 || report
          for attempt in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}" > /tmp/git.log 2>&1 || report
            git rebase -q "origin/${GITHUB_REF_NAME}" > /tmp/git.log 2>&1 || report
            git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}" > /tmp/git.log 2>&1 && break
            sleep 5
          done
          echo "::notice title=Committed::Nepal ward data pushed to ${GITHUB_REF_NAME}"

      - name: Open a pull request (main)
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/explore/nepal/osm-*.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          branch="nepal/osm-wards-$(date -u +%Y%m%d)"
          git switch -c "$branch"
          git commit -m "data(nepal): OpenStreetMap wards, villages and landmarks $(date -u +%F)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "data(nepal): OpenStreetMap wards, villages and landmarks $(date -u +%F)" \
            --body "Monthly refresh of ward boundaries, villages and landmarks for the /nepal pages from the Geofabrik Nepal extract (© OpenStreetMap contributors, ODbL 1.0). Merge, then run **Explore pages to R2**." \
            || echo "::warning::Could not open a PR automatically. Branch ${branch} was pushed; open the PR from GitHub."

  census-probe:
    # One-off look at the National Statistics Office open-data portal (CKAN) for ward-level Census 2021 tables:
    # lists the datasets, their licence and the first lines of each file, so the adapter can be written against
    # the real format. Writes only data/explore/nepal/census-probe/; nothing is published from it.
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe the NSO portal
        continue-on-error: true
        run: |
          mkdir -p data/explore/nepal/census-probe
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse, ssl, os
          out = "data/explore/nepal/census-probe"
          base = "https://data.nsonepal.gov.np/api/3/action/"
          ctx = ssl.create_default_context()
          def get(url, n=None):
              req = urllib.request.Request(url, headers={"User-Agent": "aafnaipatro-open-data-probe/1.0"})
              with urllib.request.urlopen(req, timeout=60, context=ctx) as r:
                  return r.read(n) if n else r.read()
          found = {}
          for q in ("ward", "census 2021 ward", "population ward", "household ward"):
              try:
                  res = json.loads(get(base + "package_search?" + urllib.parse.urlencode({"q": q, "rows": 100})))["result"]["results"]
                  for p in res:
                      found[p["name"]] = p
              except Exception as e:
                  print(f"::warning title=CKAN search {q}::{e}")
          for name in ("ward",):
              try:
                  p = json.loads(get(base + "package_show?id=" + name))["result"]
                  found[p["name"]] = p
              except Exception as e:
                  print(f"::warning title=CKAN package {name}::{e}")
          summary = []
          for p in found.values():
              summary.append({"name": p["name"], "title": p.get("title"), "license_id": p.get("license_id"), "license_title": p.get("license_title"),
                              "organization": (p.get("organization") or {}).get("title"), "notes": (p.get("notes") or "")[:400],
                              "resources": [{"name": r.get("name"), "format": r.get("format"), "url": r.get("url"), "size": r.get("size")} for r in p.get("resources", [])]})
          json.dump(summary, open(f"{out}/packages.json", "w"), ensure_ascii=False, indent=1)
          print(f"::notice title=NSO packages::{len(summary)} packages; licences: {sorted({str(s['license_title']) for s in summary})}")
          n = 0
          for s in summary:
              for r in s["resources"]:
                  if n >= 40 or not r["url"] or str(r["format"]).lower() not in ("csv", "xlsx", "xls", "json"):
                      continue
                  n += 1
                  try:
                      head = get(r["url"], 6000)
                      fn = f"{out}/sample-{n:02d}.{str(r['format']).lower()}"
                      open(fn, "wb").write(head)
                      r["sample"] = fn
                  except Exception as e:
                      r["sample_error"] = str(e)[:200]
          json.dump(summary, open(f"{out}/packages.json", "w"), ensure_ascii=False, indent=1)
          print(f"::notice title=NSO samples::{n} file heads saved")
          EOF
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/explore/nepal/census-probe || true
          if git diff --cached --quiet; then echo "::warning::No probe output"; exit 0; fi
          git commit -q -m "chore(nepal): NSO census portal probe (temporary)"
          for attempt in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git rebase -q "origin/${GITHUB_REF_NAME}" && git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}" && break
            sleep 7
          done
