name: Cloudflare migration readiness

on:
  push:
    branches:
      - cloudflare-migration
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:typing
      - run: npm run test:patro-tools
      - run: npm run cloudflare:verify-inventory
      - run: npm run cloudflare:verify-snapshot
      - run: npm run cloudflare:validate
