name: All tools SEO inventory gate
on:
  pull_request:
    paths:
      - "scripts/tool-growth/**"
      - "scripts/client-tools/**"
      - "scripts/mm530/emit-leaf-shells.mjs"
      - "tools/advancetools/scripts/build.mjs"
      - "tests/all-tools-*.test.mjs"
      - "client-tools/*.json"
      - "src/mm530/mm530-registry.json"
      - "public/advancetools/module-manifest.json"
      - ".github/workflows/all-tools-seo.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify free SEO and all 3,091 canonical tools
        run: node --test tests/all-tools-free-seo.test.mjs tests/all-tools-inventory-seo.test.mjs
      - name: Protect independently deployed blogs, atlas, dates and custom domains
        run: node scripts/tool-growth/verify-external-routing.mjs
