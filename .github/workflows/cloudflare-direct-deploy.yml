name: Cloudflare direct deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Verify credentials/bundle or deploy production"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deploy

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 8cbd02dbb38348565fe56e14fccf1710
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Cloudflare deploy credential is configured
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
      - name: Install pinned dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify Cloudflare account authentication
        run: npx wrangler whoami
      - name: Verify production Worker bundle locally
        if: inputs.mode == 'verify'
        run: |
          npm run build
          npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Apply D1 migrations and deploy production Worker
        if: inputs.mode == 'deploy'
        run: npm run deploy:cloudflare
