name = "mero-patro"
main = "worker/index.ts"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*", "!/astro/assets/*"]

# Draft bindings intentionally omit account-specific IDs.
# Cloudflare can provision/link these when the repository is connected.
[[d1_databases]]
binding = "DB"

[[kv_namespaces]]
binding = "CACHE"

[vars]
CALENDAR_COVERAGE_START = "1826-04-11"
CALENDAR_COVERAGE_END = "2037-04-13"
CALENDAR_SOURCE_VERSION = "patro-archive-v79"

[triggers]
crons = ["5 * * * *", "17 0,6,12,18 * * *", "43 2 * * *"]

[observability]
enabled = true
