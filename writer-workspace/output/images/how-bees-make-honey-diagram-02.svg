<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#102d29"/><text x="55" y="70" fill="#ffe2a2" font-family="Arial" font-size="34" font-weight="700">Two changes make nectar into honey</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="175" width="480" height="280" rx="28" fill="#f4e5bd"/><text x="310" y="225" font-size="28" fill="#4a3514" font-weight="700">Enzymatic change</text><circle cx="210" cy="310" r="45" fill="#c28024"/><text x="210" y="318" font-size="18" fill="#fff">Sucrose</text><path d="M275 310 H332" stroke="#7c5525" stroke-width="7"/><path d="M320 295 L340 310 L320 325" stroke="#7c5525" stroke-width="7" fill="none"/><circle cx="395" cy="284" r="35" fill="#e7a647"/><circle cx="395" cy="350" r="35" fill="#b45a27"/><text x="310" y="414" font-size="19" fill="#4a3514">Invertase helps split sucrose</text><rect x="650" y="175" width="480" height="280" rx="28" fill="#dcecf3"/><text x="890" y="225" font-size="28" fill="#204762" font-weight="700">Moisture reduction</text><path d="M770 365 Q820 275 870 365 Q920 455 970 365" fill="none" stroke="#267d9a" stroke-width="12"/><path d="M820 280 V245 M890 280 V245 M960 280 V245" stroke="#267d9a" stroke-width="5"/><path d="M810 253 L820 235 L830 253 M880 253 L890 235 L900 253 M950 253 L960 235 L970 253" stroke="#267d9a" stroke-width="5" fill="none"/><text x="890" y="414" font-size="19" fill="#204762">Fanning and airflow evaporate water</text></g><text x="600" y="535" text-anchor="middle" fill="#d3e4de" font-family="Arial" font-size="20">Chemical transformation and evaporation work together; neither alone describes the process.</text></svg>