<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f6f3ea"/><text x="55" y="75" fill="#1f3348" font-family="Arial" font-size="34" font-weight="700">The acoustic sound path</text><text x="55" y="115" fill="#526779" font-family="Arial" font-size="21">Mechanical vibration becomes radiated sound</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="205" width="220" height="150" rx="22" fill="#18334a"/><text x="165" y="267" fill="#fff" font-size="26" font-weight="700">Pluck</text><text x="165" y="306" fill="#c9d9e6" font-size="19">String moves</text><path d="M280 280 H350" stroke="#e39a43" stroke-width="9"/><path d="M337 263 L358 280 L337 297" stroke="#e39a43" stroke-width="9" fill="none"/><rect x="365" y="205" width="220" height="150" rx="22" fill="#9a5b32"/><text x="475" y="267" fill="#fff" font-size="26" font-weight="700">Bridge</text><text x="475" y="306" fill="#fff0d9" font-size="19">Transfers energy</text><path d="M590 280 H660" stroke="#e39a43" stroke-width="9"/><path d="M647 263 L668 280 L647 297" stroke="#e39a43" stroke-width="9" fill="none"/><rect x="675" y="205" width="220" height="150" rx="22" fill="#217e87"/><text x="785" y="267" fill="#fff" font-size="26" font-weight="700">Soundboard</text><text x="785" y="306" fill="#dff8f4" font-size="19">Vibrating surface</text><path d="M900 280 H970" stroke="#e39a43" stroke-width="9"/><path d="M957 263 L978 280 L957 297" stroke="#e39a43" stroke-width="9" fill="none"/><rect x="985" y="205" width="160" height="150" rx="22" fill="#493d6b"/><text x="1065" y="267" fill="#fff" font-size="24" font-weight="700">Air</text><text x="1065" y="306" fill="#eee6ff" font-size="18">Sound waves</text></g><path d="M690 390 C740 430 830 430 890 390" fill="none" stroke="#217e87" stroke-width="5" stroke-dasharray="12 9"/><text x="600" y="465" text-anchor="middle" font-family="Arial" font-size="23" fill="#1f3348">Body and cavity resonances shape which frequencies radiate efficiently.</text><text x="600" y="525" text-anchor="middle" font-family="Arial" font-size="19" fill="#526779">Energy is transferred and reshaped—not created from nothing.</text></svg>