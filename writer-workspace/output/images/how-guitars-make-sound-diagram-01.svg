<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#0b2036"/><text x="60" y="75" fill="#f5d09b" font-family="Arial" font-size="34" font-weight="700">A plucked string contains many modes</text><text x="60" y="118" fill="#c7d8e5" font-family="Arial" font-size="22">Standing waves fit between two fixed ends</text><line x1="100" y1="260" x2="1080" y2="260" stroke="#e8dfc7" stroke-width="7"/><circle cx="100" cy="260" r="11" fill="#f1b86c"/><circle cx="1080" cy="260" r="11" fill="#f1b86c"/><path d="M100 260 Q345 120 590 260 T1080 260" fill="none" stroke="#37c4d2" stroke-width="7"/><path d="M100 260 Q222 180 345 260 T590 260 T835 260 T1080 260" fill="none" stroke="#eea55d" stroke-width="6"/><path d="M100 260 Q161 218 222 260 T345 260 T468 260 T590 260 T712 260 T835 260 T957 260 T1080 260" fill="none" stroke="#94d6a9" stroke-width="5"/><text x="150" y="345" fill="#37c4d2" font-family="Arial" font-size="24">Fundamental</text><text x="440" y="385" fill="#eea55d" font-family="Arial" font-size="24">Higher harmonic</text><text x="750" y="425" fill="#94d6a9" font-family="Arial" font-size="24">More nodes and shorter wavelengths</text><rect x="60" y="480" width="1080" height="90" rx="18" fill="#132e48"/><text x="90" y="520" fill="#f2f5f7" font-family="Arial" font-size="22">The fundamental helps set pitch; relative harmonic strengths help define timbre.</text><text x="90" y="552" fill="#b8cede" font-family="Arial" font-size="18">Original explanatory diagram • not measured data</text></svg>