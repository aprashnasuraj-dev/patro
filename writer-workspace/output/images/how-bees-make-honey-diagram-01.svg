<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff6df"/><text x="50" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#40331d">From blossom to capped comb</text><g font-family="Arial" text-anchor="middle"><rect x="35" y="190" width="200" height="190" rx="20" fill="#deedc8"/><text x="135" y="265" font-size="25" fill="#244d35" font-weight="700">Flower</text><text x="135" y="310" font-size="20" fill="#244d35">Nectar</text><path d="M238 284 H287 L272 270 M287 284 L272 298" fill="none" stroke="#b77929" stroke-width="8"/><rect x="300" y="190" width="200" height="190" rx="20" fill="#f1d99c"/><text x="400" y="265" font-size="25" fill="#60420f" font-weight="700">Forager</text><text x="400" y="310" font-size="20" fill="#60420f">Carries crop</text><path d="M503 284 H552 L537 270 M552 284 L537 298" fill="none" stroke="#b77929" stroke-width="8"/><rect x="565" y="190" width="200" height="190" rx="20" fill="#f6c66c"/><text x="665" y="265" font-size="25" fill="#60420f" font-weight="700">Receiver bees</text><text x="665" y="310" font-size="20" fill="#60420f">Enzymes + transfer</text><path d="M768 284 H817 L802 270 M817 284 L802 298" fill="none" stroke="#b77929" stroke-width="8"/><rect x="830" y="190" width="200" height="190" rx="20" fill="#d5e9f3"/><text x="930" y="265" font-size="25" fill="#204762" font-weight="700">Open cell</text><text x="930" y="310" font-size="20" fill="#204762">Water evaporates</text><path d="M1033 284 H1082 L1067 270 M1082 284 L1067 298" fill="none" stroke="#b77929" stroke-width="8"/><rect x="1090" y="190" width="85" height="190" rx="18" fill="#e9b648"/><text x="1132" y="265" font-size="18" fill="#60420f" font-weight="700">Wax</text><text x="1132" y="310" font-size="18" fill="#60420f">cap</text></g><text x="600" y="465" text-anchor="middle" font-family="Arial" font-size="23" fill="#40331d">Several workers perform linked steps; one bee does not complete the entire process alone.</text></svg>