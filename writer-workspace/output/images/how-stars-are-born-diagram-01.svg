<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#111f39"/><text x="55" y="70" fill="#f2d18c" font-family="Arial" font-size="35" font-weight="700">From cloud to star</text><g font-family="Arial" text-anchor="middle"><rect x="45" y="200" width="245" height="190" rx="22" fill="#293d5d"/><text x="167" y="275" fill="#fff" font-size="26" font-weight="700">Molecular cloud</text><text x="167" y="320" fill="#d3e0f0" font-size="20">Cold gas + dust</text><path d="M296 295 H335 L320 280 M335 295 L320 310" stroke="#e8b95c" stroke-width="7" fill="none"/><rect x="350" y="200" width="245" height="190" rx="22" fill="#3b4c76"/><text x="472" y="275" fill="#fff" font-size="26" font-weight="700">Dense core</text><text x="472" y="320" fill="#d3e0f0" font-size="20">Gravity contracts</text><path d="M601 295 H640 L625 280 M640 295 L625 310" stroke="#e8b95c" stroke-width="7" fill="none"/><rect x="655" y="200" width="245" height="190" rx="22" fill="#744b68"/><text x="777" y="275" fill="#fff" font-size="26" font-weight="700">Protostar</text><text x="777" y="320" fill="#f4d9e5" font-size="20">Accretes material</text><path d="M906 295 H945 L930 280 M945 295 L930 310" stroke="#e8b95c" stroke-width="7" fill="none"/><rect x="960" y="200" width="205" height="190" rx="22" fill="#c28a39"/><text x="1062" y="275" fill="#fff" font-size="25" font-weight="700">Main sequence</text><text x="1062" y="320" fill="#fff4d8" font-size="20">Fusion sustained</text></g><text x="600" y="475" text-anchor="middle" fill="#d3e0f0" font-family="Arial" font-size="22">Stages overlap; the path and timescale depend on mass and environment.</text></svg>