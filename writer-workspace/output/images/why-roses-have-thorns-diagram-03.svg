<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f4f4ed"/><text x="55" y="70" fill="#234234" font-family="Arial" font-size="35" font-weight="700">Prickle development: a simplified view</text><rect x="80" y="190" width="1040" height="120" rx="35" fill="#4d9868"/><path d="M300 190 L365 115 L389 190 M590 190 L680 125 L710 190 M870 190 L920 130 L951 190" fill="#c77e55" stroke="#8b4f37" stroke-width="4"/><g font-family="Arial" text-anchor="middle"><rect x="95" y="390" width="300" height="125" rx="18" fill="#dfeadf" stroke="#4d9868" stroke-width="3"/><text x="245" y="435" fill="#234234" font-size="24" font-weight="700">Tissue growth</text><text x="245" y="472" fill="#3f5f4b" font-size="18">Local development builds</text><text x="245" y="497" fill="#3f5f4b" font-size="18">the projection</text><rect x="450" y="390" width="300" height="125" rx="18" fill="#f1e3d5" stroke="#c77e55" stroke-width="3"/><text x="600" y="435" fill="#5d3d2b" font-size="24" font-weight="700">Genes and signals</text><text x="600" y="472" fill="#6a4c3c" font-size="18">Research identifies pathways</text><text x="600" y="497" fill="#6a4c3c" font-size="18">that regulate appearance</text><rect x="805" y="390" width="300" height="125" rx="18" fill="#e2e7f0" stroke="#7189a8" stroke-width="3"/><text x="955" y="435" fill="#263d59" font-size="24" font-weight="700">Visible variation</text><text x="955" y="472" fill="#4b627b" font-size="18">Species and cultivars differ</text><text x="955" y="497" fill="#4b627b" font-size="18">in form and abundance</text></g><text x="600" y="575" text-anchor="middle" fill="#52675a" font-family="Arial" font-size="17">Conceptual drawing, not a micrograph; mechanisms remain an active research topic.</text></svg>