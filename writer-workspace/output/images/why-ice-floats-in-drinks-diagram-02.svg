<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f8f4e9"/><text x="55" y="70" fill="#354a5c" font-family="Arial" font-size="34" font-weight="700">Lower density means less mass per unit volume</text><g font-family="Arial"><text x="100" y="190" fill="#354a5c" font-size="24" font-weight="700">Density (approx.)</text><text x="105" y="275" fill="#2d78a5" font-size="25">Ice</text><rect x="235" y="240" width="690" height="60" rx="12" fill="#4b9ac7"/><text x="950" y="280" fill="#2d78a5" font-size="24" font-weight="700">0.917 g/cm³</text><text x="105" y="390" fill="#a36629" font-size="25">Freshwater</text><rect x="235" y="355" width="755" height="60" rx="12" fill="#e8b75c"/><text x="1010" y="395" fill="#8d5d24" font-size="24" font-weight="700">~1.0</text><path d="M235 460 H990" stroke="#354a5c" stroke-width="3"/><text x="600" y="510" text-anchor="middle" fill="#4e6170" font-size="20">Reference values near freezing; actual density depends on temperature and sample.</text></g></svg>