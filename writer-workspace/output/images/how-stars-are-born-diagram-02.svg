<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f2f4f7"/><text x="55" y="70" fill="#253f59" font-family="Arial" font-size="34" font-weight="700">Cloud collapse can create several cores</text><ellipse cx="310" cy="310" rx="235" ry="150" fill="#d0d8e7" stroke="#7488a7" stroke-width="5"/><ellipse cx="310" cy="310" rx="165" ry="103" fill="#9babc5"/><circle cx="230" cy="280" r="32" fill="#536f99"/><circle cx="370" cy="335" r="35" fill="#536f99"/><circle cx="330" cy="250" r="24" fill="#536f99"/><path d="M575 310 H655 L635 290 M655 310 L635 330" fill="none" stroke="#ba7a2e" stroke-width="8"/><g><circle cx="770" cy="250" r="45" fill="#e5ae55"/><circle cx="940" cy="340" r="40" fill="#d78f3e"/><circle cx="1055" cy="220" r="32" fill="#edc878"/><text x="900" y="450" text-anchor="middle" fill="#253f59" font-family="Arial" font-size="24" font-weight="700">Multiple protostars may form</text></g><text x="600" y="535" text-anchor="middle" fill="#526579" font-family="Arial" font-size="20">A cloud does not turn into one star: dense regions can fragment and collapse independently.</text></svg>