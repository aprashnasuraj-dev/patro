<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#101d2c"/><text x="60" y="75" fill="#f4c47e" font-family="Arial" font-size="34" font-weight="700">The electric-guitar signal path</text><text x="60" y="115" fill="#b8cbd8" font-family="Arial" font-size="21">A pickup senses string motion; the speaker creates the audible wave</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="220" width="235" height="160" rx="20" fill="#233c52" stroke="#4ba2ba" stroke-width="3"/><text x="172" y="270" fill="#fff" font-size="27" font-weight="700">Steel string</text><text x="172" y="312" fill="#cddde7" font-size="20">Vibrates in a</text><text x="172" y="342" fill="#cddde7" font-size="20">magnetic field</text><path d="M295 300 H363" stroke="#48bed1" stroke-width="8"/><path d="M350 284 L371 300 L350 316" stroke="#48bed1" stroke-width="8" fill="none"/><rect x="380" y="220" width="220" height="160" rx="20" fill="#8d522e" stroke="#f1bc75" stroke-width="3"/><text x="490" y="270" fill="#fff" font-size="27" font-weight="700">Pickup coil</text><text x="490" y="312" fill="#ffe8c9" font-size="20">Induces a varying</text><text x="490" y="342" fill="#ffe8c9" font-size="20">electrical signal</text><path d="M605 300 H673" stroke="#48bed1" stroke-width="8"/><path d="M660 284 L681 300 L660 316" stroke="#48bed1" stroke-width="8" fill="none"/><rect x="690" y="220" width="220" height="160" rx="20" fill="#24556d" stroke="#4ba2ba" stroke-width="3"/><text x="800" y="270" fill="#fff" font-size="27" font-weight="700">Amplifier</text><text x="800" y="312" fill="#d8f1f4" font-size="20">Raises and shapes</text><text x="800" y="342" fill="#d8f1f4" font-size="20">the signal</text><path d="M915 300 H983" stroke="#48bed1" stroke-width="8"/><path d="M970 284 L991 300 L970 316" stroke="#48bed1" stroke-width="8" fill="none"/><rect x="1000" y="220" width="150" height="160" rx="20" fill="#4b3d6c" stroke="#a18bdb" stroke-width="3"/><text x="1075" y="270" fill="#fff" font-size="25" font-weight="700">Speaker</text><text x="1075" y="312" fill="#eee8ff" font-size="19">Moves air</text><text x="1075" y="342" fill="#eee8ff" font-size="19">to make sound</text></g><path d="M1030 420 Q1075 455 1120 420 M1008 444 Q1075 500 1142 444" stroke="#a18bdb" stroke-width="5" fill="none"/><text x="600" y="535" text-anchor="middle" fill="#d2e2ec" font-family="Arial" font-size="21">A solid-body guitar's main output path is electronic.</text></svg>