<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Mangal playbox</title>
<style>:root{--bg:#fff;--fg:#1d2733;--card:#f4f7fb;--bd:#dbe3ec;--ok:#14803c;--no:#c0262d;--ac:#0b6bcb}@media (prefers-color-scheme:dark){:root{--bg:#0f1620;--fg:#e6edf5;--card:#17212d;--bd:#283546;--ok:#4cc58a;--no:#ff7b80;--ac:#6db3ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px 24px}h1{font-size:1.2rem;margin:.2em 0}
.grid{display:grid;gap:12px;grid-template-columns:1fr}@media (min-width:900px){.grid{grid-template-columns:1fr 1fr}}.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
textarea{width:100%;height:260px;font:12px/1.4 ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px}iframe{width:100%;height:420px;border:1px solid var(--bd);border-radius:8px;background:#fff}
button,label.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;margin:4px 4px 0 0;display:inline-block}ul{list-style:none;padding:0;margin:6px 0}li{padding:3px 0}.ok{color:var(--ok)}.no{color:var(--no)}</style></head>
<body><h1>Mission Mangal playbox</h1><p>Paste an article JSON, see the publish-ready page, and run the publish gate. Nothing leaves your device.</p>
<div class="grid"><div class="box"><textarea id="j" spellcheck="false" aria-label="Article JSON"></textarea>
<button id="r">Render + check</button><label class="b">Open JSON file<input id="f" type="file" accept=".json" hidden></label><button id="d">Download page.html</button><ul id="c"></ul></div>
<div class="box"><iframe id="p" title="Preview" sandbox></iframe></div></div>
<script>/*RENDER*/
const $=i=>document.getElementById(i);let html='';const sample=/*SAMPLE*/;$('j').value=JSON.stringify(sample,null,1);
function run(){try{const a=JSON.parse($('j').value);html=renderArticle(a);$('p').srcdoc=html;
$('c').innerHTML=checkArticle(a).map(x=>`<li class="${x.ok?'ok':'no'}">${x.ok?'✔':'✖'} ${x.label}${x.detail?' — '+x.detail:''}</li>`).join('');}catch(e){$('c').innerHTML='<li class="no">✖ Invalid JSON: '+String(e.message).replace(/[<&]/g,'')+'</li>';}}
$('r').onclick=run;$('f').onchange=e=>e.target.files[0]?.text().then(t=>{$('j').value=t;run();});
$('d').onclick=()=>{if(!html)run();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=(JSON.parse($('j').value).slug||'page')+'.html';a.click();};run();</script></body></html>
